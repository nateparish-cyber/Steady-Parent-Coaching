async function extractTextFromFile(file) {
  if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(content.items.map(item => item.str).join(" "));
    }
    return pages.join("\n\n");
  }
  // Plain text / markdown
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

const SYSTEM_PROMPT = `You are Steady Parent Coach, a between-session coaching companion built on Nate Parish's clinical model — grounded in ACT, attachment theory, relational therapy, and a SPACE-informed approach to anxiety treatment with a fast accommodation fade approach. Your role is to support parents in applying what they're already working on in therapy, not to replace it.

You are not a therapist. You do not create treatment plans, provide crisis support, or speak as Nate. If questions about long-term strategy, pacing, or treatment decisions come up, warmly redirect the parent to bring those to their next session — while still helping with what's right in front of them.

You speak only to parents or caregivers. If a child or teen ever addresses you directly, respond: "This tool is designed for parents. Please have your caregiver use it."

---

WHO YOU ARE

You sound like a knowledgeable friend who also happens to have deep clinical training. Someone who gets it — both the love and the exhaustion of parenting. You build trust quickly. You validate without sugarcoating. You normalize struggle while keeping the focus forward — on the child, on the relationship, on what's still possible.

You are curious, not judgmental. Grounded, not harsh. Warm, but never syrupy. Humor and lightness are welcome when the moment calls for it. You think out loud alongside parents — you don't lecture them.

You do NOT sound like a generic wellness app, a textbook, or an overly cautious AI hedging every sentence. You are warm and clear — but you always invite, never instruct.

---

CLINICAL STANCE

Accommodation is the primary lens. Avoidance feeds anxiety. When we accommodate — removing the discomfort, answering the same worried question again, staying until they fall asleep — we're actually denying our kids the opportunity to develop the internal skills and strength that help them not just tolerate discomfort, but truly learn from it and grow through it. Warmth is always present. But warmth is not accommodation. Parent steadiness is the foundation. Exposure builds real courage.

Secondary lenses enrich the work. A parent's history shows up in their parenting. Neurodivergence changes what's possible and what's needed. Family patterns repeat across generations. These are real and worth naming — gently, as context, not as the main thread. One eye is always on the child and on reducing accommodation. The other eye holds the fuller picture of why this particular parent finds it hard.

---

TONE & LANGUAGE

Write in flowing, connected prose. Let thoughts breathe the way a real conversation does. Contractions are fine. Plain language always. No jargon unless the parent uses it first.

Do not open with generic reassurance. Start by meeting them where they are — name what's happening, reflect it back with warmth, and let them feel genuinely understood before moving anywhere.

Avoid overusing the word "anxiety." Vary naturally — worry, fear, overwhelm, distress, nervous system activation, big feelings, stress, panic. Match their words when you can.

Use "we" and "our" when normalizing — parents are not alone in this. Short questions land hard — use them deliberately. "What comes up for you when they push back like that?" hits differently than a paragraph of explanation.

---

SUGGESTIONS, NOT DIRECTIVES — ALWAYS

You never tell a parent what to do. You offer possibilities, share perspectives, and invite exploration. Every piece of guidance is framed as an option the parent is free to take, adapt, or leave entirely. Parents are the experts on their own child and family — you hold clinical knowledge, they hold context and choice.

Use language like:
• "Some parents find it helpful to…"
• "One possibility might be…"
• "You could experiment with…"
• "It might be worth trying…"
• "Something to consider could be…"
• "One approach that sometimes helps is…"
• "You might explore whether…"

Avoid language like:
• "You need to…" / "You should…" / "You must…"
• "The right thing to do is…"
• "Make sure you…" / "Don't…" (as commands)
• Definitive prescriptions stated as facts

This applies to scripts too — always introduce them as options: "Here's something you might consider saying…" or "One thing you could try is…" never "Say this."

---

READING THE MOMENT — TWO MODES

Before responding, read what the parent actually needs right now.

MODE 1 — PROCESSING MODE (parent is venting, overwhelmed, or exploring why)
When a parent is in emotional processing mode — venting, confused, circling something painful — don't rush to action. Sit with them first. Validate. Get curious. Ask the question that connects the present moment to something deeper. Help them see the thread without making it heavy.

In this mode: favor flowing prose, curiosity, and one good question at the end. Hold the structure loosely. The conversation is the work.

Example questions in this mode:
"What comes up for you when your child melts down like that?"
"Where did you learn to respond to big feelings that way?"
"Sometimes our kids trigger something old in us — does any of that feel familiar?"

MODE 2 — ACTION MODE (parent needs to know what to do, right now or soon)
When a parent needs direction — they're in a hard moment, they've been stuck in a pattern, they're ready to try something — move through the full structure. Give them something concrete to hold.

In this mode, responses move through these layers as connected prose:

1. VALIDATION — Reflect back what they're carrying with genuine warmth. Name the difficulty specifically.

2. REFRAME — Help them understand what's underneath the behavior and why accommodation, while understandable, is working against what they want for their child. Use Nate's framing: we're not withholding comfort to be tough — we're creating the space for real growth. "When we keep stepping in, we're actually taking away the chance for them to find those internal resources — the ones that help them not just get through hard moments, but actually learn from them."

3. DIRECTION — One or two sentences of grounded perspective on what might help. Offered as a possibility, not a prescription. Frame it as something to consider or experiment with, not a rule to follow.

4. SCRIPT — Always present this with the header **Script** bolded and on its own line. Introduce it as an option: "Here's something you might consider saying…" or "One thing you could try…" One or two short scripts the parent can actually use. These should sound like something a warm, regulated adult would genuinely say — not a rehearsed line. Lead with presence over words. Scripts should be specific, human, and exposure-oriented. They may name the child's emotional experience and affirm the parent's steadiness. Two sentences max per script. Parents are free to adapt these however feels right for their family.

5. NORMALIZE — One sentence acknowledging that escalation or pushback is expected and is not a sign they're doing it wrong.

6. CLOSING — End with either a single warm curious question, OR — when the challenge feels managed — a genuine fork: "Are you finding yourself wanting to understand more about what's driving this, or would it feel more useful to keep working on the practical steps?"

---

SECONDARY LENSES (use when relevant, hold lightly)

FAMILY OF ORIGIN — When a parent's reaction seems bigger than the moment warrants, name it gently. "Sometimes our kids trigger something old in us — that reaction might not just be about today." Then move forward. This is coaching, not therapy.

NEURODIVERGENCE — Normalize that what parents know about their own brains often doesn't apply to their child's brain. Help them grieve the "expected" and get curious about who their child actually is. Frame the learning curve as meaningful, not as failure.

PATTERNS — Name what you notice, warmly but directly. "It sounds like every time you try to hold that limit, something pulls you back. What do you think that's about?" Don't dance around what's visible.

---

SPECIAL CASES

If parental guilt or regret is present, lead with one consolidated validating sentence that holds their intention, their stumble, and their growth together — before moving into the pattern. One sentence only. Don't stack validations.

When a parent vents, spirals, or uses harsh language about their child or themselves, calmly name the escalation without shaming, model regulated language, and move toward steadiness. Don't mirror the heat. Treat it as part of the pattern and coach through it.

If suicidal ideation, self-harm, child abuse, sexual abuse, physical abuse, neglect, domestic violence, credible threats of harm, or any mandated reporting situation arises, stop immediately and respond only with:

"This involves safety and mandatory reporting concerns. I can't continue this conversation here. Please contact emergency services or the appropriate crisis resource in your area right now. Please bring this directly to your next session with Nate."

No scripts. No follow-up question. Nothing else.

Do not diagnose, recommend medication, offer legal advice, suggest custody strategies, process trauma, or create individualized treatment plans.

Every response — whatever mode it's in — moves toward less accommodation, more parental steadiness, more exposure, clearer limits, and greater consistency.`;

function formatMessage(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i} style={{ color: "#7c4a3a", display: "block", marginTop: "12px", marginBottom: "4px", fontSize: "15px" }}>{part.slice(2, -2)}</strong>;
    }
    return part.split("\n").map((line, j) => (
      <span key={`${i}-${j}`}>{line}{j < part.split("\n").length - 1 && <br />}</span>
    ));
  });
}

  { title: "2. What This Tool Is Not", body: "By using Steady Parent Coach, you acknowledge and agree that this tool:\n\n• Is NOT a substitute for therapy, clinical treatment, or professional mental health care\n• Does NOT create or constitute a therapeutic, clinical, or provider-patient relationship between you and Nate Parish\n• Does NOT provide crisis support, emergency services, psychiatric evaluation, or safety assessment\n• Does NOT generate individualized treatment plans or clinical diagnoses\n• Does NOT prescribe, recommend, or provide information about medication or medical treatment\n• Is NOT intended for use in connection with court-ordered therapy, emotional support animal certification, or any official documentation\n• Is NOT a HIPAA-covered service — see Section 6 for full details\n• May produce responses that are imprecise, incomplete, or not applicable to your specific situation — always use your own judgment\n\nDo not disregard, avoid, or delay seeking in-person care from Nate or another qualified professional because of information or advice you received through this tool." },
  { title: "3. Crisis & Emergency Situations", body: "This tool is not designed for and cannot be used in any crisis or emergency situation. If any of the following apply, you must stop using this app immediately and contact emergency services:\n\n• You or someone else is thinking about suicide or self-harm\n• You or someone else is in danger of harm from another person\n• You are experiencing a psychiatric emergency or acute mental health crisis\n• You are witnessing or aware of abuse, neglect, or danger to a child\n• You have any medical emergency\n\nCall 911 for any immediate danger. Call or text 988 for the Suicide & Crisis Lifeline. Go to your nearest emergency room if needed. If safety concerns arise during your use of this tool, please bring them directly to your next in-person session with Nate." },
  { title: "4. Who May Use This Tool", body: "Steady Parent Coach is intended exclusively for parents and caregivers who are currently active clients of Nate Parish's practice. Unauthorized use by individuals who are not current clients is prohibited.\n\nThis tool is designed for adults (18 years and older). It is not intended for use by minors. This tool may not be shared with a partner, family member, or other individual without Nate's explicit authorization. Each account is for the registered user only.\n\nIf your child or teenager attempts to use this tool, please redirect them and contact Nate directly." },
  { title: "5. You Are Talking to an AI — Not a Human", body: "Steady Parent Coach is powered by an artificial intelligence language model developed by Anthropic (Claude). You are not communicating with Nate Parish or any human when you use this tool.\n\nThe AI does not have access to your therapy records, your treatment plan, or any clinical information about you unless you share it directly in the conversation. The AI is designed to reflect Nate's coaching model and clinical approach, but its responses are generated automatically, have not been reviewed by Nate in real time, and may occasionally be imprecise, incomplete, or not applicable to your specific situation.\n\nAI does not replace human judgment. This tool is intended solely as a support resource between sessions — not as a substitute for professional clinical care.\n\nWhile Anthropic's API processes your messages in order to generate responses, Anthropic does not store your conversations for training purposes via the API and does not use them for advertising." },
  { title: "6. Privacy & Data — Important Limitations", body: "What Nate can and cannot access:\n• Nate does NOT have access to your conversation history or personal profile through this tool\n• His administrative access is limited to account management (account name, username, and consent status only)\n• You may choose to share a conversation transcript with Nate using the 'Send to Nate' button — this is entirely optional and client-initiated\n• If you share a transcript, Nate will be able to read its contents\n\nThird-party services that handle your data:\n• Anthropic (Claude API) — processes your messages to generate AI responses; does not store or train on API conversations by default\n• Supabase — stores your account information, conversation history, and profile data in a secure cloud database hosted on AWS\n• Vercel — hosts the application and serves it to your browser\n• EmailJS — used to send account-related emails\n\nHIPAA Notice: Steady Parent Coach is NOT a HIPAA-compliant platform. Please do not share Protected Health Information (PHI) or other highly sensitive information through this tool. Reserve those disclosures for your direct therapy sessions with Nate." },
  { title: "7. Data Retention & Deletion", body: "Your conversation history, account information, and profile will be retained for as long as you are an active client of Nate Parish's practice. When your clinical relationship with Nate ends, your account and all associated data will be deleted within 30 days.\n\nYou may request deletion of your data at any time by contacting Nate directly. We will make reasonable efforts to complete deletion requests within 30 days of receiving them. Note that some data may be retained if required by applicable law." },
  { title: "8. Mandatory Reporting", body: "Nate Parish is a licensed mental health professional and a mandatory reporter under California law. Although Nate does not monitor your conversations through this tool, if you choose to share a conversation transcript with him using the 'Send to Nate' feature, and that transcript contains information indicating imminent risk of harm to a child or vulnerable adult, Nate is legally required to report that information to the appropriate authorities regardless of the context in which it was shared.\n\nIf you are experiencing a situation involving safety concerns, please bring those concerns directly to your in-person therapy session with Nate rather than through this tool." },
  { title: "9. Acceptable Use", body: "By using Steady Parent Coach, you agree to use it only for lawful, personal, non-commercial purposes in connection with your work as a parent or caregiver. You agree not to:\n\n• Share your account credentials or allow any other person to use your account\n• Use this tool if you are not a current client of Nate Parish's practice\n• Attempt to use this tool during a mental health emergency or crisis situation\n• Submit false, misleading, or inaccurate information about your identity or situation\n• Attempt to reverse engineer, copy, or reproduce the tool or its underlying clinical model\n\nViolation of these terms may result in immediate termination of your access to this tool." },
  { title: "10. Platform Reliability & No Warranty", body: "Steady Parent Coach is provided 'as-is' as a supplemental coaching resource. Nate Parish and his practice make no warranties, express or implied, regarding the accuracy, completeness, reliability, or suitability of the AI's responses for any particular situation.\n\nThe platform depends on various factors including software, hardware, and internet connectivity — factors we do not fully control. We do not guarantee that the platform will be uninterrupted, error-free, or available at any particular time. We are not liable for any interruption, disruption, or unavailability of the service." },
  { title: "11. Limitation of Liability", body: "To the maximum extent permitted by applicable law, you agree to release and hold harmless Nate Parish and his practice from any and all claims, causes of action, or damages of any nature resulting from your use of this tool — including any act, omission, opinion, suggestion, or response generated by the AI.\n\nNate Parish and his practice shall not be liable for any indirect, incidental, consequential, special, or punitive damages arising from your use of this tool. Our aggregate liability for any claims arising from your use of this tool shall not exceed the greater of $200 or the total fees, if any, paid to access this tool in the 12 months prior to the claim.\n\nThis limitation of liability shall survive the termination or expiration of this agreement." },
  { title: "12. Changes to These Terms", body: "These Terms of Use may be updated periodically to reflect changes in law, technology, or practice. We will make reasonable efforts to notify you of material changes. Continued use of the tool following any update constitutes your acceptance of the revised terms." },
  { title: "13. Governing Law", body: "This agreement shall be governed by and interpreted in accordance with the laws of the State of California. Any disputes arising under this agreement shall be subject to the jurisdiction of the courts located in Sonoma County, California." },
];

const PRIVACY_SECTIONS = [
  { title: "1. Introduction", body: "This Privacy Policy explains how Nate Parish, LMFT (\"we,\" \"us,\" or \"our\"), a licensed therapist operating as a sole proprietor, collects, uses, stores, and protects information when you use Steady Parent Coach (the \"App\").\n\nSteady Parent Coach is an AI-powered parenting support tool designed to provide psychoeducational coaching and reflective support for parents. It is not a therapy service. By using the App, you agree to the collection and use of information in accordance with this policy." },
  { title: "2. Who We Are", body: "Nate Parish, LMFT is a licensed marriage and family therapist operating as a sole proprietor in the State of California. He is the sole developer and operator of this App.\n\n• Name: Nate Parish, LMFT\n• Email: nate.parish@gmail.com\n• Website: nateparishtherapy.com" },
  { title: "3. What This App Is — and Is Not", body: "This App is a psychoeducational and coaching support tool. It is not therapy, does not constitute a therapeutic relationship, is not a HIPAA-covered service, and is not a crisis resource. It is not a substitute for working with a licensed mental health professional.\n\nBecause this App is not a covered health service under HIPAA, the information you provide is not treated as Protected Health Information (PHI) under that law. However, we recognize that the information you share may be sensitive, and we are committed to handling it responsibly." },
  { title: "4. Information We Collect", body: "Information You Provide Directly:\n• Name and email address (for account creation and login)\n• Conversation content you submit to the AI coaching tool\n• Any optional profile information you choose to provide\n\nInformation Collected Automatically:\n• Device type and operating system\n• App usage data (e.g., session frequency, features used)\n• IP address and general location (country/state level)\n• Error logs and performance data\n\nInformation We Do Not Collect:\n• Payment or financial information (handled by our payment processor, Stripe)\n• Government ID numbers or Social Security numbers\n• Medical records or insurance information\n\nSensitive Information: By the nature of this App, you may voluntarily share information about your family, your child's behavior, or your emotional experiences. This information is used solely to generate coaching responses and is not shared with third parties for marketing or advertising purposes." },
  { title: "5. How We Use Your Information", body: "We use the information we collect to:\n\n• Provide, operate, and maintain the App\n• Deliver AI-generated coaching responses to your queries\n• Maintain your conversation history across sessions\n• Process subscription payments (via Stripe)\n• Respond to support requests and feedback\n• Improve the App's functionality and content\n• Comply with applicable legal obligations\n\nWe do not use your conversation content to train AI models. We do not sell your personal information to third parties." },
  { title: "6. Third-Party Services and Data Processors", body: "Anthropic (Claude API): AI-generated responses are powered by the Anthropic Claude API. Your conversation inputs are transmitted to Anthropic's servers to generate responses. We do not share personally identifiable account information with Anthropic beyond what is transmitted in the course of generating a response.\n\nSupabase: User account data and conversation history are stored in Supabase, a cloud-hosted database service. Data is stored on servers in the United States.\n\nVercel: The App's serverless functions are hosted on Vercel. Vercel may process request data in the course of routing API calls.\n\nStripe: Subscription payments are processed by Stripe. We do not store credit card or payment information on our servers." },
  { title: "7. Data Retention", body: "We retain your account information and conversation history for as long as your account is active. If you cancel your subscription or request account deletion, we will delete your personal data and conversation history within 30 days, except where we are required to retain it for legal or compliance purposes.\n\nData transmitted to Anthropic via the API is subject to Anthropic's own retention policies. We do not control how long Anthropic retains API request data." },
  { title: "8. Your Privacy Rights", body: "Depending on your state of residence, you may have certain rights regarding your personal information. As a US nationwide service, we recognize rights under applicable state privacy laws including the California Consumer Privacy Act (CCPA) and similar statutes. You may have the right to:\n\n• Access the personal information we hold about you\n• Request correction of inaccurate information\n• Request deletion of your personal information\n• Opt out of the sale of personal information (we do not sell personal information)\n• Non-discrimination for exercising your privacy rights\n\nTo exercise any of these rights, please contact us at nate.parish@gmail.com. We will respond to verifiable requests within 45 days." },
  { title: "9. Children's Privacy", body: "This App is intended for use by adults (18 years of age or older). We do not knowingly collect personal information from children under the age of 13. If you believe a child has provided us with personal information without parental consent, please contact us immediately and we will take steps to delete that information." },
  { title: "10. Data Security", body: "We implement reasonable technical and organizational measures to protect your personal information from unauthorized access, disclosure, or destruction. These include:\n\n• Encrypted data transmission (HTTPS/TLS)\n• Secure cloud storage via Supabase with access controls\n• API key management via environment variables (never exposed to end users)\n• Limited access to user data on a need-to-know basis\n\nNo method of transmission or storage is 100% secure. We cannot guarantee absolute security, but we are committed to protecting your information to the best of our ability." },
  { title: "11. Changes to This Privacy Policy", body: "We may update this Privacy Policy from time to time. When we make material changes, we will notify you by email or through an in-app notice prior to the change taking effect. The updated policy will be indicated by a revised Effective Date. Continued use of the App after changes take effect constitutes your acceptance of the revised policy." },
  { title: "12. Contact Us", body: "If you have questions, concerns, or requests regarding this Privacy Policy or how we handle your data, please contact us at:\n\n• Nate Parish, LMFT\n• Email: nate.parish@gmail.com\n\nWe take privacy concerns seriously and will respond to all inquiries within a reasonable timeframe." },
];

function ConsentScreen({ user, onConsented }) {
  const [activeDoc, setActiveDoc] = useState("terms"); // "terms" | "privacy"
  const [scrolledTerms, setScrolledTerms] = useState(false);
  const [scrolledPrivacy, setScrolledPrivacy] = useState(false);
  const [typedName, setTypedName] = useState("");
  const [agreed, setAgreed] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [emailStatus, setEmailStatus] = useState("");
  const scrollRef = useRef(null);
  const signedAt = new Date().toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" });
  const bothRead = scrolledTerms && scrolledPrivacy;

  function handleScroll(e) {
    const el = e.target;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 40) {
      if (activeDoc === "terms") setScrolledTerms(true);
      else setScrolledPrivacy(true);
    }
  }

  function switchDoc(doc) {
    setActiveDoc(doc);
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }

  function buildConsentText() {
    const terms = TERMS_SECTIONS.map(s => `${s.title}\n\n${s.body}`).join("\n\n---\n\n");
    const privacy = PRIVACY_SECTIONS.map(s => `${s.title}\n\n${s.body}`).join("\n\n---\n\n");
    return `STEADY PARENT COACH — SIGNED CONSENT\n\nClient Name: ${user.name}\nUsername: ${user.username}\nSigned: ${signedAt}\nTyped Signature: ${typedName}\n\n${"=".repeat(60)}\n\nTERMS OF USE — Version 2.0\nNate Parish, LMFT | Effective: March 2026\n\n${terms}\n\n${"=".repeat(60)}\n\nPRIVACY POLICY\nNate Parish, LMFT | Effective: March 20, 2026\n\n${privacy}\n\n${"=".repeat(60)}\n\nACKNOWLEDGMENT\n\nThe client confirmed they have read and agreed to both the Terms of Use (v2.0) and the Privacy Policy — including that this tool is not therapy, is not HIPAA-compliant, and that Nate does not monitor their conversations unless they choose to share them.\n\nSigned by: ${typedName}\nDate/Time: ${signedAt}\nAccount: ${user.username}`;
  }

  async function handleSubmit() {
    setError("");
    if (!typedName.trim()) { setError("Please type your full name to sign."); return; }
    if (typedName.trim().toLowerCase() !== user.name.toLowerCase()) {
      setError(`Please type your full name exactly as registered: "${user.name}"`); return;
    }
    if (!agreed) { setError("Please check the acknowledgment box."); return; }
    setSubmitting(true);

    try {
      const users = await getUsers();
      if (users[user.username]) {
        users[user.username].consentSigned = true;
        users[user.username].consentSignedAt = new Date().toISOString();
        users[user.username].consentTypedName = typedName.trim();
        await saveUsers(users);
      }
    } catch {}

    setEmailStatus("sending");
    try {
      const consentText = buildConsentText();
      await Promise.all([
        sendEmail(`Signed Consent — ${user.name}`, consentText, user.name),
        user.email && sendEmail(
          "Welcome to Steady Parent Coach — Your Signed Documents",
          `Hi ${user.name.split(" ")[0]},\n\nWelcome to Steady Parent Coach! Your account is now active.\n\nBelow is a copy of the Terms of Use and Privacy Policy you signed for your records.\n\n— Steady Parent Coach\n\n${"=".repeat(60)}\n\n${consentText}`,
          user.name,
          user.email
        ),
      ]);
      setEmailStatus("sent");
    } catch {
      setEmailStatus("failed");
    }

    setTimeout(() => onConsented(), 1200);
  }

  const nameMatches = typedName.trim().toLowerCase() === user.name.toLowerCase();
  const sections = activeDoc === "terms" ? TERMS_SECTIONS : PRIVACY_SECTIONS;
  const currentRead = activeDoc === "terms" ? scrolledTerms : scrolledPrivacy;

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(145deg,#fdf6f0 0%,#fce8d8 40%,#f5e6f0 100%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", fontFamily: "Georgia,serif", padding: "24px 16px" }}>
      <div style={{ maxWidth: 680, width: "100%", display: "flex", flexDirection: "column", gap: "16px" }}>

        {/* Header */}
        <div style={{ textAlign: "center", padding: "8px 0 4px" }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "22px", margin: "0 auto 12px" }}>🌿</div>
          <h1 style={{ color: "#4a2820", fontSize: "20px", margin: "0 0 6px", fontWeight: "700" }}>Before You Get Started</h1>
          <p style={{ color: "#9a7060", fontSize: "13px", margin: 0, lineHeight: 1.6 }}>
            Hi {user.name.split(" ")[0]} — please read and sign both documents below before accessing the coaching tool.
          </p>
        </div>

        {/* Progress indicators */}
        <div style={{ display: "flex", gap: "8px" }}>
          {[["terms","📋 Terms of Use", scrolledTerms], ["privacy","🔒 Privacy Policy", scrolledPrivacy]].map(([doc, label, read]) => (
            <button key={doc} onClick={() => switchDoc(doc)} style={{ flex: 1, padding: "10px 12px", borderRadius: "12px", border: `1.5px solid ${activeDoc === doc ? "rgba(200,120,90,0.5)" : "rgba(200,120,90,0.18)"}`, background: activeDoc === doc ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.5)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", fontSize: "13px", fontWeight: "700", color: activeDoc === doc ? "#4a2820" : "#9a7060", fontFamily: "Georgia,serif" }}>
              <span>{label}</span>
              {read ? <span style={{ color: "#3a9a60", fontSize: "14px" }}>✓</span> : <span style={{ color: "#c9a090", fontSize: "11px" }}>unread</span>}
            </button>
          ))}
        </div>

        {/* Scrollable document */}
        <div style={{ background: "rgba(255,255,255,0.92)", borderRadius: "20px", border: "1.5px solid rgba(200,120,90,0.18)", boxShadow: "0 4px 24px rgba(150,80,60,0.1)", overflow: "hidden" }}>
          <div style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", padding: "14px 22px" }}>
            <div style={{ color: "#fff", fontSize: "15px", fontWeight: "700" }}>
              {activeDoc === "terms" ? "Terms of Use — Version 2.0" : "Privacy Policy"}
            </div>
            <div style={{ color: "rgba(255,255,255,0.8)", fontSize: "12px", marginTop: "2px" }}>
              {activeDoc === "terms" ? "Nate Parish, LMFT · Effective: March 2026" : "Nate Parish, LMFT · Effective: March 20, 2026"}
            </div>
          </div>

          {!currentRead && (
            <div style={{ background: "rgba(232,147,122,0.1)", borderBottom: "1px solid rgba(200,120,90,0.15)", padding: "9px 22px", display: "flex", alignItems: "center", gap: "8px" }}>
              <span style={{ fontSize: "14px" }}>👇</span>
              <span style={{ fontSize: "12px", color: "#9a7060" }}>Scroll to the bottom to mark this document as read.</span>
            </div>
          )}
          {currentRead && (
            <div style={{ background: "rgba(100,180,120,0.1)", borderBottom: "1px solid rgba(80,160,100,0.2)", padding: "9px 22px", display: "flex", alignItems: "center", gap: "8px" }}>
              <span style={{ fontSize: "14px" }}>✅</span>
              <span style={{ fontSize: "12px", color: "#3a7a50" }}>
                {bothRead ? "Both documents read. Please sign below." : `Document read. ${activeDoc === "terms" ? "Now read the Privacy Policy →" : "Now read the Terms of Use →"}`}
              </span>
            </div>
          )}

          <div ref={scrollRef} onScroll={handleScroll} style={{ maxHeight: "340px", overflowY: "auto", padding: "20px 24px", display: "flex", flexDirection: "column", gap: "18px" }}>
            {sections.map((s, i) => (
              <div key={i}>
                <div style={{ fontSize: "14px", fontWeight: "700", color: "#4a2820", marginBottom: "6px", paddingBottom: "4px", borderBottom: "1px solid rgba(200,120,90,0.15)" }}>{s.title}</div>
                {s.body.split("\n").map((line, j) => (
                  <p key={j} style={{ fontSize: "13px", color: line.startsWith("•") ? "#5a3020" : "#555", margin: "4px 0", lineHeight: 1.65, paddingLeft: line.startsWith("•") ? "8px" : "0" }}>{line}</p>
                ))}
              </div>
            ))}
            <div style={{ height: "1px" }} onMouseEnter={() => { if (activeDoc === "terms") setScrolledTerms(true); else setScrolledPrivacy(true); }} />
          </div>
        </div>

        {/* Signature block — shown only after both read */}
        {bothRead && (
          <div style={{ background: "rgba(255,255,255,0.92)", borderRadius: "20px", border: "1.5px solid rgba(200,120,90,0.18)", padding: "24px", boxShadow: "0 4px 24px rgba(150,80,60,0.08)" }}>
            <div style={{ fontSize: "15px", fontWeight: "700", color: "#4a2820", marginBottom: "14px" }}>✍️ Sign to Acknowledge Both Documents</div>

            <p style={{ fontSize: "13px", color: "#6a5040", margin: "0 0 16px", lineHeight: 1.65 }}>
              By typing your full name below, you confirm that you have read and agree to both the <strong>Terms of Use (v2.0)</strong> and the <strong>Privacy Policy</strong> — including that this tool is not therapy, is not HIPAA-compliant, and that Nate does not monitor your conversations unless you choose to share them.
            </p>

            <label style={{ fontSize: "13px", color: "#7c4a3a", fontWeight: "600", display: "block", marginBottom: "6px" }}>
              Type your full name to sign <span style={{ color: "#c9697a" }}>*</span>
            </label>
            <input
              value={typedName}
              onChange={e => setTypedName(e.target.value)}
              placeholder={user.name}
              style={{ width: "100%", padding: "12px 16px", borderRadius: "12px", border: `1.5px solid ${nameMatches && typedName ? "rgba(80,160,100,0.5)" : "rgba(200,120,90,0.25)"}`, fontSize: "16px", fontFamily: "Georgia, serif", fontStyle: "italic", color: "#4a2820", outline: "none", boxSizing: "border-box", background: "#fdfaf8", marginBottom: "6px", transition: "border-color 0.2s" }}
            />
            {typedName && !nameMatches && (
              <p style={{ fontSize: "12px", color: "#c9697a", margin: "0 0 12px" }}>Please type your name exactly: "{user.name}"</p>
            )}
            {typedName && nameMatches && (
              <p style={{ fontSize: "12px", color: "#3a9a60", margin: "0 0 12px" }}>✓ Signature accepted</p>
            )}

            <div style={{ fontSize: "12px", color: "#9a8070", marginBottom: "16px", padding: "8px 12px", background: "rgba(200,150,120,0.07)", borderRadius: "8px" }}>
              Date &amp; Time: {signedAt}
            </div>

            <label style={{ display: "flex", alignItems: "flex-start", gap: "10px", cursor: "pointer", marginBottom: "16px" }}>
              <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ marginTop: "2px", width: "16px", height: "16px", accentColor: "#c9697a", flexShrink: 0 }} />
              <span style={{ fontSize: "13px", color: "#5a4030", lineHeight: 1.6 }}>
                I confirm I am an adult (18+), a current client of Nate Parish's practice, and I have read and agree to the Terms of Use (v2.0) and the Privacy Policy — including that this tool is not therapy, is not HIPAA-compliant, and that Nate does not monitor my conversations unless I choose to share them with him.
              </span>
            </label>

            {error && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#c05060", fontSize: "13px", marginBottom: "14px" }}>{error}</div>}
            {emailStatus === "sending" && <div style={{ background: "rgba(100,160,220,0.1)", border: "1px solid rgba(80,140,200,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#3060a0", fontSize: "13px", marginBottom: "14px" }}>📤 Sending signed copy to Nate…</div>}
            {emailStatus === "sent" && <div style={{ background: "rgba(80,180,100,0.1)", border: "1px solid rgba(60,160,80,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#2a7a40", fontSize: "13px", marginBottom: "14px" }}>✅ Signed copy sent to Nate automatically.</div>}
            {emailStatus === "failed" && <div style={{ background: "rgba(220,150,80,0.1)", border: "1px solid rgba(200,130,60,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#805020", fontSize: "13px", marginBottom: "14px" }}>⚠️ Couldn't send automatically — please forward your copy to Nate at your next session.</div>}

            <Btn
              onClick={handleSubmit}
              disabled={submitting || !nameMatches || !agreed || !typedName}
              style={{
                width: "100%", padding: "14px",
                background: (nameMatches && agreed && typedName && !submitting) ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.2)",
                color: (nameMatches && agreed && typedName && !submitting) ? "#fff" : "#9a7060",
                fontSize: "15px", fontWeight: "700",
                boxShadow: (nameMatches && agreed && typedName) ? "0 4px 16px rgba(200,100,100,0.3)" : "none",
                borderRadius: "14px",
              }}
            >
              {submitting ? "Signing & sending to Nate…" : "Sign Both Documents & Continue"}
            </Btn>
          </div>
        )}

        {!bothRead && (
          <p style={{ fontSize: "12px", color: "#b89080", textAlign: "center", margin: "0 0 8px" }}>
            {!scrolledTerms && !scrolledPrivacy ? "Read both documents above to unlock signing" : !scrolledTerms ? "Finish reading the Terms of Use to continue" : "Finish reading the Privacy Policy to continue"}
          </p>
        )}
      </div>
    </div>
  );
}

// ── Auth Screen ────────────────────────────────────────────────────────────────
function AuthScreen({ onLogin, onNeedsConsent, onDemo }) {
  const [mode, setMode] = useState("login"); // "login" | "register" | "recover"
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [recoverSent, setRecoverSent] = useState(false);

  function resetFields() { setName(""); setEmail(""); setUsername(""); setPassword(""); setConfirmPw(""); setError(""); setRecoverSent(false); }

  async function submit() {
    setError(""); setBusy(true);

    if (mode === "recover") {
      if (!email.trim()) { setError("Please enter your email address."); setBusy(false); return; }
      const res = await fetch("/api/recover-account", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email.trim() }) });
      const data = await res.json();
      if (!res.ok) { setError(data.error || "Something went wrong."); setBusy(false); return; }
      setRecoverSent(true);
      setBusy(false);
      return;
    }

    if (mode === "login") {
      if (username.trim().toLowerCase() === ADMIN_USERNAME) {
        const res = await fetch("/api/admin-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username.trim(), password }) });
        const data = await res.json();
        if (data.success) { onLogin({ id: "nate", name: "Nate", role: "admin" }); return; }
        setError("Incorrect username or password."); setBusy(false); return;
      }
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username.trim().toLowerCase(), password }) });
      const data = await res.json();
      if (!res.ok) { setError(data.error || "Incorrect username or password."); setBusy(false); return; }
      const userObj = { id: data.user.id, name: data.user.name, username: data.user.username, email: data.user.email, role: "client" };
      if (!data.user.consentSigned) { onNeedsConsent(userObj); setBusy(false); return; }
      onLogin(userObj);
    } else {
      if (!name.trim()) { setError("Please enter your name."); setBusy(false); return; }
      if (!email.trim() || !email.includes("@")) { setError("Please enter a valid email address."); setBusy(false); return; }
      if (username.trim().length < 3) { setError("Username must be at least 3 characters."); setBusy(false); return; }
      if (password.length < 6) { setError("Password must be at least 6 characters."); setBusy(false); return; }
      if (password !== confirmPw) { setError("Passwords don't match."); setBusy(false); return; }
      if (username.trim().toLowerCase() === ADMIN_USERNAME) { setError("That username is reserved."); setBusy(false); return; }
      const res = await fetch("/api/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name.trim(), email: email.trim(), username: username.trim().toLowerCase(), password }) });
      const data = await res.json();
      if (!res.ok) { setError(data.error || "Registration failed."); setBusy(false); return; }
      sendEmail(`New Client Registration — ${name.trim()}`, `A new client has created an account on Steady Parent Coach.\n\nName: ${name.trim()}\nUsername: ${username.trim().toLowerCase()}\nEmail: ${email.trim()}\nRegistered: ${new Date().toLocaleString()}\n\nThey will be shown the consent form before accessing the tool.`, name.trim());
      onNeedsConsent(data.user);
    }
    setBusy(false);
  }

  function onKey(e) { if (e.key === "Enter") submit(); }

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(145deg,#fdf6f0 0%,#fce8d8 40%,#f5e6f0 100%)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif", padding: "20px" }}>
      <div style={{ background: "rgba(255,255,255,0.88)", backdropFilter: "blur(12px)", borderRadius: "28px", padding: "40px", maxWidth: 420, width: "100%", boxShadow: "0 20px 60px rgba(150,80,60,0.13)", border: "1px solid rgba(200,120,90,0.12)" }}>
        <div style={{ textAlign: "center", marginBottom: "28px" }}>
          <div style={{ width: 58, height: 58, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "26px", margin: "0 auto 14px", boxShadow: "0 4px 16px rgba(200,100,100,0.3)" }}>🌿</div>
          <h1 style={{ color: "#4a2820", fontSize: "22px", margin: "0 0 6px", fontWeight: "700" }}>Steady Parent Coach</h1>
        </div>

        {mode !== "recover" && (
          <div style={{ display: "flex", background: "rgba(200,120,90,0.08)", borderRadius: "12px", padding: "4px", marginBottom: "22px" }}>
            {[["login", "Sign In"], ["register", "Create Account"]].map(([m, label]) => (
              <button key={m} onClick={() => { setMode(m); resetFields(); }} style={{ flex: 1, padding: "9px", borderRadius: "9px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", fontWeight: "600", transition: "all 0.2s", background: mode === m ? "#fff" : "transparent", color: mode === m ? "#c9697a" : "#9a7060", boxShadow: mode === m ? "0 2px 8px rgba(150,80,60,0.12)" : "none" }}>{label}</button>
            ))}
          </div>
        )}

        {mode === "recover" && (
          <div style={{ marginBottom: "20px" }}>
            <button onClick={() => { setMode("login"); resetFields(); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#c9697a", fontSize: "13px", fontFamily: "inherit", fontWeight: "600", padding: "0 0 4px", display: "flex", alignItems: "center", gap: "5px" }}>← Back to Sign In</button>
            <h2 style={{ color: "#4a2820", fontSize: "18px", margin: "12px 0 6px", fontWeight: "700" }}>Account Recovery</h2>
            <p style={{ color: "#9a7060", fontSize: "13px", margin: 0, lineHeight: 1.6 }}>Enter the email address you registered with and we'll send your username and a temporary password.</p>
          </div>
        )}

        {recoverSent ? (
          <div style={{ textAlign: "center", padding: "16px 0" }}>
            <div style={{ fontSize: "36px", marginBottom: "10px" }}>📬</div>
            <div style={{ fontSize: "15px", fontWeight: "700", color: "#4a2820", marginBottom: "8px" }}>Recovery email sent</div>
            <p style={{ fontSize: "13px", color: "#9a7060", lineHeight: 1.65, margin: "0 0 20px" }}>Check your inbox for your username and a temporary password. If it doesn't arrive within a few minutes, check your spam folder.</p>
            <Btn onClick={() => { setMode("login"); resetFields(); }} style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", padding: "12px 28px" }}>Back to Sign In</Btn>
          </div>
        ) : (
          <>
            {mode === "register" && <Input placeholder="Your full name" value={name} onChange={e => setName(e.target.value)} onKeyDown={onKey} />}
            {mode === "register" && <Input type="email" placeholder="Your email address" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={onKey} />}
            {mode === "recover"
              ? <Input type="email" placeholder="Email address you registered with" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={onKey} autoFocus />
              : <Input placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} onKeyDown={onKey} />
            }
            {mode !== "recover" && <Input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={onKey} />}
            {mode === "register" && <Input type="password" placeholder="Confirm password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} onKeyDown={onKey} />}

            {error && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#c05060", fontSize: "13px", marginBottom: "14px" }}>{error}</div>}

            <Btn onClick={submit} disabled={busy} style={{ width: "100%", padding: "14px", background: busy ? "rgba(200,120,90,0.3)" : "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", fontSize: "15px", fontWeight: "700", boxShadow: busy ? "none" : "0 4px 16px rgba(200,100,100,0.3)", borderRadius: "14px" }}>
              {busy ? "Please wait…" : mode === "login" ? "Sign In" : mode === "register" ? "Create Account →" : "Send Recovery Email"}
            </Btn>

            <p style={{ color: "#b89080", fontSize: "11px", textAlign: "center", marginTop: "18px", lineHeight: 1.6 }}>
              {mode === "register" ? "You'll be asked to read and sign a consent form before accessing the tool." : ""}<br />This tool is not a replacement for therapy.
            </p>
            {mode === "login" && (
              <p style={{ color: "#c9a090", fontSize: "12px", textAlign: "center", marginTop: "10px", lineHeight: 1.6 }}>
                <button onClick={() => { setMode("recover"); resetFields(); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#c9697a", fontWeight: "600", fontSize: "12px", fontFamily: "inherit", padding: 0, textDecoration: "underline" }}>
                  Forgot your username or password?
                </button>
              </p>
            )}
            {mode === "login" && (
              <div style={{ marginTop: "18px", paddingTop: "16px", borderTop: "1px solid rgba(200,120,90,0.12)", textAlign: "center" }}>
                <p style={{ color: "#9a7060", fontSize: "12px", margin: "0 0 10px", lineHeight: 1.5 }}>Not sure if this is right for you?</p>
                <button onClick={onDemo} style={{ background: "rgba(232,147,122,0.1)", border: "1.5px solid rgba(200,120,90,0.25)", borderRadius: "12px", padding: "10px 20px", color: "#7c4a3a", fontSize: "13px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit", width: "100%", transition: "background 0.2s" }}>
                  👋 Explore a demo account
                </button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ── Admin Dashboard ────────────────────────────────────────────────────────────
function AdminDashboard({ onLogout }) {
  const [users, setUsers] = useState({});
  const [folders, setFolders] = useState([]);
  const [folderDrafts, setFolderDrafts] = useState({});
  const [folderSaved, setFolderSaved] = useState({});
  const [tab, setTab] = useState("clients");
  const [loading, setLoading] = useState(true);
  const [usageData, setUsageData] = useState([]);
  const [progressData, setProgressData] = useState([]);
  const [feedbackList, setFeedbackList] = useState([]);
  const [feedbackFilter, setFeedbackFilter] = useState("");
  const [folderUploading, setFolderUploading] = useState({});
  const [folderUploadError, setFolderUploadError] = useState({});
  const [testMessages, setTestMessages] = useState([]);
  const [testInput, setTestInput] = useState("");
  const [testLoading, setTestLoading] = useState(false);
  const [testFeedbackIdx, setTestFeedbackIdx] = useState(null);
  const [testFeedbackText, setTestFeedbackText] = useState("");
  const [testFeedbackSaving, setTestFeedbackSaving] = useState(false);
  const [testFeedbackSaved, setTestFeedbackSaved] = useState(null);
  const testBottomRef = useRef(null);

  useEffect(() => {
    async function load() {
      const [u, f, usage, progress, fbList] = await Promise.all([getUsers(), getKBFolders(), getUsageThisMonth(), getProgressSummary(), getFeedbackList()]);
      setUsers(u);
      setFolders(f);
      setFolderDrafts(Object.fromEntries(f.map(fl => [fl.id, { name: fl.name, content: fl.content }])));
      setUsageData(usage);
      setProgressData(progress);
      setFeedbackList(fbList);
      setLoading(false);
    }
    load();
  }, []);

  async function deleteClient(key) {
    if (!confirm(`Delete ${users[key].name} and all their data?`)) return;
    const uid = users[key].id;
    await deleteUser(uid);
    const updated = { ...users };
    delete updated[key];
    setUsers(updated);
  }

  const [resetTarget, setResetTarget] = useState(null);
  const [newPassword, setNewPassword] = useState("");
  const [resetDone, setResetDone] = useState(false);
  const [resetError, setResetError] = useState("");

  function openReset(e, u) {
    e.stopPropagation();
    setResetTarget(u);
    setNewPassword("");
    setResetDone(false);
    setResetError("");
  }

  async function doReset() {
    if (newPassword.length < 6) { setResetError("Password must be at least 6 characters."); return; }
    const res = await fetch("/api/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: resetTarget.id, newPassword }) });
    if (!res.ok) { setResetError("Failed to reset password. Please try again."); return; }
    setResetDone(true);
    setTimeout(() => setResetTarget(null), 1800);
  }

  async function doSaveFolder(id) {
    const draft = folderDrafts[id];
    if (!draft) return;
    await saveKBFolder({ id, name: draft.name, content: draft.content });
    setFolders(prev => prev.map(f => f.id === id ? { ...f, ...draft } : f));
    setFolderSaved(prev => ({ ...prev, [id]: true }));
    setTimeout(() => setFolderSaved(prev => ({ ...prev, [id]: false })), 2000);
  }

  async function doUploadFile(folderId, file, e) {
    if (!file) return;
    e.target.value = "";
    setFolderUploading(prev => ({ ...prev, [folderId]: true }));
    setFolderUploadError(prev => ({ ...prev, [folderId]: "" }));
    try {
      const text = await extractTextFromFile(file);
      const cleaned = text.replace(/\s+/g, " ").trim();
      if (!cleaned) throw new Error("No text could be extracted from this file.");
      setFolderDrafts(prev => {
        const existing = prev[folderId] || { name: "", content: "" };
        const appended = existing.content ? existing.content + "\n\n---\n\n" + cleaned : cleaned;
        return { ...prev, [folderId]: { ...existing, content: appended } };
      });
    } catch (err) {
      setFolderUploadError(prev => ({ ...prev, [folderId]: err.message || "Failed to read file." }));
    }
    setFolderUploading(prev => ({ ...prev, [folderId]: false }));
  }

  async function doCreateFolder() {
    const id = 'folder_' + Date.now().toString(36);
    const newFolder = { id, name: 'New Folder', content: '', updated_at: new Date().toISOString() };
    await saveKBFolder(newFolder);
    setFolders(prev => [...prev, newFolder]);
    setFolderDrafts(prev => ({ ...prev, [id]: { name: 'New Folder', content: '' } }));
  }

  async function doDeleteFolder(id) {
    if (!confirm('Delete this folder and all its content?')) return;
    await deleteKBFolder(id);
    setFolders(prev => prev.filter(f => f.id !== id));
    setFolderDrafts(prev => { const d = { ...prev }; delete d[id]; return d; });
  }

  useEffect(() => { testBottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [testMessages, testLoading]);

  async function sendTestMessage(text) {
    if (!text.trim() || testLoading) return;
    const newMsgs = [...testMessages, { role: 'user', content: text.trim() }];
    setTestMessages(newMsgs);
    setTestInput("");
    setTestLoading(true);
    setTestFeedbackIdx(null);
    try {
      const kb = await getKB();
      const system = SYSTEM_PROMPT + '\n\n[TEST MODE: This conversation is being run by Nate Parish to evaluate the AI. Respond naturally as if talking to a real client parent.]' + (kb ? `\n\n---\n\n## Therapist's Clinical Notes\n\n${kb}` : '');
      const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, messages: newMsgs }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      const reply = data.content?.map(b => b.text || "").join("") || "No response.";
      setTestMessages(prev => [...prev, { role: 'assistant', content: reply }]);
    } catch(e) {
      console.error("Test chat error:", e);
      setTestMessages(prev => [...prev, { role: 'assistant', content: `Error: ${e.message || "Something went wrong."}` }]);
    }
    setTestLoading(false);
  }

  async function saveTestFeedback(msgIdx) {
    if (!testFeedbackText.trim() || testFeedbackSaving) return;
    setTestFeedbackSaving(true);
    const FEEDBACK_ID = 'folder_admin_feedback';
    const aiSnippet = (testMessages[msgIdx]?.content || '').slice(0, 100);
    const hasMore = (testMessages[msgIdx]?.content || '').length > 100;
    const noteEntry = `[${new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}]\nAI response: "${aiSnippet}${hasMore ? '…' : ''}"\nFeedback: ${testFeedbackText.trim()}`;
    const allFolders = await getKBFolders();
    const existing = allFolders.find(f => f.id === FEEDBACK_ID);
    const newContent = existing?.content ? existing.content + '\n\n---\n\n' + noteEntry : noteEntry;
    await saveKBFolder({ id: FEEDBACK_ID, name: '🔬 Admin Feedback', content: newContent });
    setFolders(prev => {
      const exists = prev.find(f => f.id === FEEDBACK_ID);
      if (exists) return prev.map(f => f.id === FEEDBACK_ID ? { ...f, content: newContent } : f);
      return [...prev, { id: FEEDBACK_ID, name: '🔬 Admin Feedback', content: newContent, updated_at: new Date().toISOString() }];
    });
    setFolderDrafts(prev => ({ ...prev, [FEEDBACK_ID]: { name: '🔬 Admin Feedback', content: newContent } }));
    setTestFeedbackSaving(false);
    setTestFeedbackSaved(msgIdx);
    setTestFeedbackText("");
    setTestFeedbackIdx(null);
    setTimeout(() => setTestFeedbackSaved(null), 2500);
  }

  const clientList = Object.values(users);
  const P = { background: "linear-gradient(145deg,#f0f4ff 0%,#e8eeff 50%,#f0e8ff 100%)" };

  return (
    <div style={{ minHeight: "100vh", ...P, fontFamily: "Georgia,serif" }}>
      <div style={{ background: "rgba(255,255,255,0.75)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(100,100,200,0.12)", padding: "15px 22px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: "11px" }}>
          <div style={{ width: 38, height: 38, borderRadius: "50%", background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "16px" }}>🔐</div>
          <div>
            <div style={{ fontSize: "16px", fontWeight: "700", color: "#2a2850" }}>Nate's Admin Dashboard</div>
            <div style={{ fontSize: "12px", color: "#7a70a0" }}>Steady Parent Coach · Account Management</div>
          </div>
        </div>
        <Btn onClick={onLogout} style={{ background: "rgba(150,100,200,0.1)", color: "#7a5aa0", border: "1.5px solid rgba(150,100,200,0.2)" }}>Sign Out</Btn>
      </div>

      <div style={{ maxWidth: 760, margin: "0 auto", padding: "22px 16px" }}>

        {/* Privacy notice */}
        <div style={{ background: "rgba(255,255,255,0.7)", border: "1px solid rgba(122,142,232,0.2)", borderRadius: "14px", padding: "14px 18px", marginBottom: "20px", display: "flex", gap: "12px", alignItems: "flex-start" }}>
          <span style={{ fontSize: "18px", flexShrink: 0 }}>🔒</span>
          <div style={{ fontSize: "13px", color: "#5a5890", lineHeight: 1.65 }}>
            <strong style={{ color: "#2a2850" }}>Client conversations and profiles are private.</strong> You can manage accounts and reset credentials below, but chat histories and profile data are not accessible from here. Clients may choose to share transcripts with you directly via the "Send to Nate" button.
          </div>
        </div>

        <div style={{ display: "flex", gap: "8px", marginBottom: "22px", flexWrap: "wrap" }}>
          {[["clients", `👥 Clients (${clientList.length})`], ["kb", "📋 Knowledge Base"], ["test", "🧪 Test Chat"], ["usage", "📊 Usage"], ["feedback", "📝 Feedback"]].map(([t, label]) => (
            <Btn key={t} onClick={() => setTab(t)} style={{ background: tab === t ? "linear-gradient(135deg,#7a8ee8,#9a6ac9)" : "rgba(255,255,255,0.72)", color: tab === t ? "#fff" : "#7a70a0", boxShadow: tab === t ? "0 4px 14px rgba(120,100,200,0.28)" : "none", border: "none" }}>{label}</Btn>
          ))}
        </div>

        {tab === "clients" && (
          <div>
            {loading ? (
              <div style={{ color: "#9a8ac0", textAlign: "center", padding: "40px 20px" }}>Loading clients…</div>

                <div style={{ fontSize: "36px", marginBottom: "10px" }}>👥</div>
                <div style={{ fontSize: "15px", fontWeight: "600" }}>No clients yet</div>
                <div style={{ fontSize: "13px", marginTop: "6px", lineHeight: 1.5 }}>Clients will appear here once they create an account.</div>

              const uTypeCounts = {}; for (const l of uLogs) uTypeCounts[l.moment_type] = (uTypeCounts[l.moment_type]||0)+1;
              const uTopType = Object.entries(uTypeCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
              const PICONS = { held_firm:"💪", gave_in_caught_myself:"😅", kid_win:"🌟", free_write:"✍️" };
              return (
