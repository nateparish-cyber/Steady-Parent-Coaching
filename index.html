              style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.25)", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", resize: "none", lineHeight: 1.6, boxSizing: "border-box", background: "rgba(255,255,255,0.92)", marginBottom: "16px" }} />
            <Btn onClick={async () => { if (!goalInput.trim() || goalSaving) return; if (user.isDemo) { setShowGoalModal(false); setShowDemoGate(true); return; } setGoalSaving(true); await saveWeeklyGoal(user.id, goalInput.trim()); const p = await getProfile(user.id); setProfile(p); setGoalSaving(false); setShowGoalModal(false); }} disabled={!goalInput.trim() || goalSaving}
              style={{ width: "100%", padding: "13px", background: goalInput.trim() && !goalSaving ? "linear-gradient(135deg,#8a6aaa,#6a4a8a)" : "rgba(200,120,90,0.2)", color: goalInput.trim() && !goalSaving ? "#fff" : "#b89080", border: "none", fontSize: "14px", fontWeight: "700", boxShadow: goalInput.trim() ? "0 4px 14px rgba(120,80,180,0.25)" : "none", transition: "all 0.2s" }}>
              {goalSaving ? "Saving…" : "Set Goal"}
            </Btn>
          </div>
        </div>
      )}

      {showGoalReflect && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)" }}>
          <div style={{ background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", borderRadius: "28px", padding: "28px 24px 24px", maxWidth: 420, width: "92%", boxShadow: "0 24px 60px rgba(150,80,60,0.22)" }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "16px" }}>
              <div>
                <div style={{ fontSize: "18px", fontWeight: "700", color: "#4a2820" }}>🎯 Goal Check-In</div>
                <div style={{ fontSize: "12px", color: "#9a7060", marginTop: "6px", lineHeight: 1.5, fontStyle: "italic" }}>"{profile.weekly_goal?.length > 80 ? profile.weekly_goal.slice(0,80)+'…' : profile.weekly_goal}"</div>
              </div>
              <button onClick={() => { setShowGoalReflect(false); setGoalReflectText(""); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "18px", color: "#b89080", padding: "2px 2px 2px 10px", flexShrink: 0 }}>✕</button>
            </div>
            <div style={{ fontSize: "13px", color: "#7c4a3a", marginBottom: "10px", fontWeight: "600" }}>How are you doing with this goal?</div>
            <textarea value={goalReflectText} onChange={e => setGoalReflectText(e.target.value)} placeholder="Reflect on your progress, what's working, what's been hard…" rows={4}
              style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.25)", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", resize: "none", lineHeight: 1.6, boxSizing: "border-box", background: "rgba(255,255,255,0.92)", marginBottom: "16px" }} />
            <Btn onClick={async () => { if (!goalReflectText.trim() || goalSaving) return; if (user.isDemo) { setShowGoalReflect(false); setShowDemoGate(true); return; } setGoalSaving(true); try { await logProgress(user.id, user.username, `Goal: ${profile.weekly_goal}`, 'goal_check_in', goalReflectText.trim()); const logs = await getProgress(user.id); setProgressLogs(logs); setShowGoalReflect(false); setGoalReflectText(""); } catch(e) { console.error(e); } setGoalSaving(false); }} disabled={!goalReflectText.trim() || goalSaving}
              style={{ width: "100%", padding: "13px", background: goalReflectText.trim() && !goalSaving ? "linear-gradient(135deg,#8a6aaa,#6a4a8a)" : "rgba(200,120,90,0.2)", color: goalReflectText.trim() && !goalSaving ? "#fff" : "#b89080", border: "none", fontSize: "14px", fontWeight: "700", boxShadow: goalReflectText.trim() ? "0 4px 14px rgba(120,80,180,0.25)" : "none", transition: "all 0.2s" }}>
              {goalSaving ? "Saving…" : "Save Reflection"}
            </Btn>
          </div>
        </div>
      )}

      {showDemoGate && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)" }} onClick={() => setShowDemoGate(false)}>
          <div style={{ background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", borderRadius: "24px", padding: "36px 32px", maxWidth: 380, width: "92%", boxShadow: "0 20px 60px rgba(150,80,60,0.25)", textAlign: "center" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: "38px", marginBottom: "12px" }}>🔒</div>
            <h3 style={{ color: "#4a2820", margin: "0 0 12px", fontSize: "19px", fontWeight: "700" }}>You're exploring a demo</h3>
            <p style={{ color: "#7c4a3a", fontSize: "14px", lineHeight: 1.7, margin: "0 0 24px" }}>
              This feature is available in a real account. Create a free account to start your own coaching conversations, set goals, and track your progress.
            </p>
            <Btn onClick={onLogout} style={{ width: "100%", padding: "13px", background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", fontSize: "15px", fontWeight: "700", boxShadow: "0 4px 16px rgba(200,100,100,0.3)", marginBottom: "10px" }}>
              Create a Free Account →
            </Btn>
            <button onClick={() => setShowDemoGate(false)} style={{ background: "none", border: "none", color: "#b89080", fontSize: "13px", cursor: "pointer", fontFamily: "inherit", padding: "4px" }}>
              Keep exploring demo
            </button>
          </div>
        </div>
      )}

      {showDeleteConfirm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" }} onClick={() => setShowDeleteConfirm(false)}>
          <div style={{ background: "#fff8f5", borderRadius: "24px", padding: "32px", maxWidth: 380, width: "92%", boxShadow: "0 20px 60px rgba(150,80,60,0.2)", textAlign: "center" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: "32px", marginBottom: "10px" }}>⚠️</div>
            <h3 style={{ color: "#4a2820", margin: "0 0 10px", fontSize: "18px" }}>Delete Account?</h3>
            <p style={{ color: "#7c4a3a", fontSize: "13px", lineHeight: 1.65, margin: "0 0 24px" }}>
              This will permanently delete your account, all chat history, and your profile. This cannot be undone.
            </p>
            <div style={{ display: "flex", gap: "10px" }}>
              <Btn onClick={() => setShowDeleteConfirm(false)} style={{ flex: 1, background: "rgba(200,120,90,0.08)", color: "#9a7060", border: "1.5px solid rgba(200,120,90,0.2)" }}>Cancel</Btn>
              <Btn onClick={handleDeleteAccount} disabled={deleting} style={{ flex: 1, background: deleting ? "rgba(220,80,80,0.3)" : "linear-gradient(135deg,#e05060,#c03050)", color: "#fff", border: "none", boxShadow: "0 4px 14px rgba(200,60,80,0.25)" }}>
                {deleting ? "Deleting…" : "Yes, Delete"}
              </Btn>
            </div>
          </div>
        </div>
      )}

      <div style={{ background: "rgba(255,255,255,0.72)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(180,120,90,0.15)", padding: "13px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
          <button onClick={() => { setActiveConvId(null); setMessages([]); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#9a7060", fontSize: "13px", fontWeight: "600", fontFamily: "inherit", padding: "4px 8px 4px 0", display: "flex", alignItems: "center", gap: "3px" }}>← All Chats</button>
          <div style={{ width: 36, height: 36, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "16px" }}>🌿</div>
          <div>
            <div style={{ fontSize: "16px", fontWeight: "700", color: "#4a2820" }}>Steady Parent Coach</div>
            <div style={{ fontSize: "12px", color: "#9a7060" }}>Welcome back, {user.name.split(" ")[0]}</div>
          </div>
        </div>
        <div ref={menuRef} style={{ position: "relative" }}>
          <button onClick={() => setShowMenu(v => !v)} style={{ background: "rgba(200,120,90,0.08)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "10px", padding: "7px 13px", fontSize: "20px", cursor: "pointer", color: "#7c4a3a", display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1, position: "relative" }}>
            ☰
            {(!profileFilled || logSaved) && <span style={{ position: "absolute", top: -3, right: -3, width: 8, height: 8, borderRadius: "50%", background: logSaved ? "#3aaa6a" : "#e8937a", border: "1.5px solid #fdf6f0" }} />}
          </button>
          {showMenu && (
            <div style={{ position: "absolute", top: "calc(100% + 8px)", right: 0, background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "14px", boxShadow: "0 8px 28px rgba(150,80,60,0.15)", minWidth: 190, zIndex: 50, overflow: "hidden" }}>
              <button onClick={() => { setShowProfile(true); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: "none", border: "none", borderBottom: "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: profileFilled ? "#7c4a3a" : "#c05060", cursor: "pointer", fontFamily: "inherit", fontWeight: "600", position: "relative" }}>
                👤 {profileFilled ? "My Profile" : "Add Profile"}
                {!profileFilled && <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#e8937a", flexShrink: 0 }} />}
              </button>
              <button onClick={() => { setChatView(v => v === "progress" ? "chat" : "progress"); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: chatView === "progress" ? "rgba(232,147,122,0.12)" : "none", border: "none", borderBottom: "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: "#7c4a3a", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>
                📈 Progress
                {logSaved && <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#3aaa6a", flexShrink: 0 }} />}
              </button>
              <button onClick={() => { setChatView(v => v === "learn" ? "chat" : "learn"); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: chatView === "learn" ? "rgba(232,147,122,0.12)" : "none", border: "none", borderBottom: "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: "#7c4a3a", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>
                📖 Learn
              </button>
              {hasMessages && chatView === "chat" && !user.isDemo && <>
                <button onClick={() => { exportChat(); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: "none", border: "none", borderBottom: "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: "#7c4a3a", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>
                  💾 Export
                </button>
                <button onClick={() => { sendToNate(); setShowMenu(false); }} disabled={nateSending || nateSent} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: nateSent ? "rgba(80,180,100,0.1)" : "none", border: "none", borderBottom: "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: nateSent ? "#2a7a40" : "#7c4a3a", cursor: nateSending || nateSent ? "default" : "pointer", fontFamily: "inherit", fontWeight: "600", transition: "all 0.3s" }}>
                  {nateSending ? "⏳ Sending…" : nateSent ? "✓ Sent to Nate" : "📨 Send to Nate"}
                </button>
              </>}
              <button onClick={() => { onLogout(); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: "none", border: "none", borderBottom: user.isDemo ? "none" : "1px solid rgba(200,120,90,0.1)", padding: "12px 16px", fontSize: "14px", color: "#9a7060", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>
                {user.isDemo ? "← Exit Demo" : "Sign Out"}
              </button>
              {!user.isDemo && <button onClick={() => { setShowDeleteConfirm(true); setShowMenu(false); }} style={{ display: "flex", alignItems: "center", gap: "10px", width: "100%", background: "none", border: "none", padding: "12px 16px", fontSize: "14px", color: "#c05060", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>
                🗑 Delete Account
              </button>}
            </div>
          )}
        </div>
      </div>

      {user.isDemo && (
        <div style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", padding: "9px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", flexWrap: "wrap" }}>
          <span style={{ color: "#fff", fontSize: "13px", fontWeight: "600", lineHeight: 1.45 }}>
            👋 <strong>Demo mode</strong> — exploring as Sarah. Nothing is saved.
          </span>
          <button onClick={onLogout} style={{ background: "rgba(255,255,255,0.22)", border: "1px solid rgba(255,255,255,0.4)", borderRadius: "8px", padding: "5px 12px", color: "#fff", fontSize: "12px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>
            Create a free account →
          </button>
        </div>
      )}

      {chatView === "progress" && (() => {
        const MOMENT_LABELS = {
          held_firm: { label: "Held firm", icon: "💪", color: "#3a7a50", bg: "rgba(80,160,100,0.15)" },
          gave_in_caught_myself: { label: "Gave in — caught myself", icon: "😅", color: "#8a6020", bg: "rgba(220,180,60,0.15)" },
          kid_win: { label: "Kid had a win", icon: "🌟", color: "#7a4a8a", bg: "rgba(180,100,220,0.12)" },
          free_write: { label: "Free write", icon: "✍️", color: "#4a6080", bg: "rgba(100,140,200,0.12)" },
          goal_check_in: { label: "Goal check-in", icon: "🎯", color: "#5a4a80", bg: "rgba(140,100,200,0.12)" },
        };
        const thisWeek = progressLogs.filter(l => Date.now() - new Date(l.created_at) < 7*24*60*60*1000).length;
        const typeCounts = {}; for (const l of progressLogs) typeCounts[l.moment_type] = (typeCounts[l.moment_type]||0)+1;
        const topType = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
        // Group by week
        const weekMap = {};
        for (const log of progressLogs) {
          const d = new Date(log.created_at);
          const ws = new Date(d); ws.setDate(d.getDate()-d.getDay()); ws.setHours(0,0,0,0);
          const key = ws.toISOString();
          if (!weekMap[key]) weekMap[key] = { start: ws, logs: [] };
          weekMap[key].logs.push(log);
        }
        const weeks = Object.values(weekMap).sort((a,b) => b.start - a.start);
        const now = new Date();
        const thisWS = new Date(now); thisWS.setDate(now.getDate()-now.getDay()); thisWS.setHours(0,0,0,0);
        const lastWS = new Date(thisWS); lastWS.setDate(thisWS.getDate()-7);
        return (
          <div style={{ flex: 1, maxWidth: 720, width: "100%", margin: "0 auto", padding: "22px 15px", display: "flex", flexDirection: "column", gap: "18px" }}>
            {profile.weekly_goal ? (
              <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "18px", padding: "18px 20px", border: "1.5px solid rgba(140,100,200,0.2)" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "8px" }}>
                  <div style={{ fontSize: "12px", fontWeight: "700", color: "#5a4a80", textTransform: "uppercase", letterSpacing: "0.05em" }}>🎯 This Week's Goal</div>
                  <button onClick={() => { setGoalInput(profile.weekly_goal); setShowGoalModal(true); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "12px", color: "#b89080", fontFamily: "inherit", padding: "2px 4px" }}>Edit</button>
                </div>
                <div style={{ fontSize: "15px", color: "#4a2820", lineHeight: 1.55, marginBottom: "6px" }}>{profile.weekly_goal}</div>
                {profile.weekly_goal_set_at && <div style={{ fontSize: "11px", color: "#b89080", marginBottom: "14px" }}>Set {new Date(profile.weekly_goal_set_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div>}
                <div style={{ display: "flex", gap: "8px" }}>
                  <Btn onClick={() => { setGoalReflectText(""); setShowGoalReflect(true); }} style={{ flex: 1, padding: "10px", background: "linear-gradient(135deg,#8a6aaa,#6a4a8a)", color: "#fff", border: "none", fontSize: "13px", fontWeight: "700", boxShadow: "0 3px 12px rgba(120,80,180,0.2)" }}>Reflect on Goal</Btn>
                  <button onClick={async () => { await saveWeeklyGoal(user.id, ''); const p = await getProfile(user.id); setProfile(p); }} style={{ padding: "10px 14px", background: "rgba(200,120,90,0.08)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "12px", fontSize: "12px", color: "#9a7060", cursor: "pointer", fontFamily: "inherit", fontWeight: "600" }}>Clear</button>
                </div>
              </div>
            ) : (
              <button onClick={() => { setGoalInput(""); setShowGoalModal(true); }} style={{ width: "100%", padding: "14px", background: "rgba(255,255,255,0.82)", border: "1.5px dashed rgba(140,100,200,0.4)", borderRadius: "14px", fontSize: "14px", color: "#5a4a80", cursor: "pointer", fontFamily: "inherit", fontWeight: "600", textAlign: "center", transition: "all 0.15s" }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(240,230,255,0.9)"}
                onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.82)"}
              >🎯 Set a Weekly Goal</button>
            )}
            <Btn onClick={() => { setShowLogCard(true); }} style={{ width: "100%", padding: "13px", background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", fontSize: "14px", fontWeight: "700", boxShadow: "0 4px 16px rgba(200,100,100,0.25)", borderRadius: "14px" }}>
              + Log a Moment
            </Btn>
            <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "18px", padding: "20px 24px", border: "1.5px solid rgba(200,120,90,0.15)", display: "flex", gap: "0", alignItems: "stretch" }}>
              {[
                { value: progressLogs.length, label: "moments logged" },
                { value: thisWeek, label: "this week" },
                { value: topType ? (MOMENT_LABELS[topType]?.icon || "📝") : "—", label: "top moment", raw: true },
              ].map((s, i) => (
                <div key={i} style={{ flex: 1, textAlign: "center", padding: "0 8px", borderLeft: i > 0 ? "1px solid rgba(200,120,90,0.15)" : "none" }}>
                  <div style={{ fontSize: s.raw ? "26px" : "28px", fontWeight: s.raw ? "400" : "700", color: "#4a2820", lineHeight: 1.1 }}>{s.value}</div>
                  <div style={{ fontSize: "11px", color: "#9a7060", marginTop: "5px" }}>{s.label}</div>
                </div>
              ))}
            </div>
            {progressLogs.length === 0 ? (
              <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "18px", padding: "40px 24px", textAlign: "center", border: "1.5px solid rgba(200,120,90,0.15)" }}>
                <div style={{ fontSize: "34px", marginBottom: "12px" }}>🌱</div>
                <div style={{ fontSize: "15px", fontWeight: "600", color: "#4a2820", marginBottom: "8px" }}>No moments logged yet</div>
                <div style={{ fontSize: "13px", color: "#9a7060", lineHeight: 1.65 }}>After 3 back-and-forths with the coach, you'll see a prompt to log how the moment went.</div>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: "22px" }}>
                {weeks.map(week => {
                  const wLabel = week.start >= thisWS ? "This week" : week.start >= lastWS ? "Last week" : week.start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
                  return (
                    <div key={week.start.toISOString()}>
                      <div style={{ fontSize: "12px", fontWeight: "700", color: "#9a7060", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "10px" }}>{wLabel}</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                        {week.logs.map(log => {
                          const m = MOMENT_LABELS[log.moment_type] || { label: log.moment_type, icon: "📝", color: "#6a5040", bg: "rgba(200,150,100,0.1)" };
                          return (
                            <div key={log.id} style={{ background: "rgba(255,255,255,0.88)", border: `1.5px solid ${m.bg}`, borderRadius: "14px", padding: "13px 16px", display: "flex", gap: "12px", alignItems: "flex-start" }}>
                              <div style={{ fontSize: "22px", flexShrink: 0, marginTop: "1px" }}>{m.icon}</div>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: "14px", fontWeight: "600", color: m.color, marginBottom: "3px" }}>{m.label}</div>
                                {log.chat_summary && <div style={{ fontSize: "12px", color: "#9a7060", lineHeight: 1.5, marginBottom: log.note ? "5px" : 0, fontStyle: "italic" }}>"{log.chat_summary.length > 80 ? log.chat_summary.slice(0,80)+"…" : log.chat_summary}"</div>}
                                {log.note && <div style={{ fontSize: "13px", color: "#4a2820", lineHeight: 1.55 }}>{log.note}</div>}
                              </div>
                              <div style={{ fontSize: "11px", color: "#b89080", flexShrink: 0 }}>{new Date(log.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}

      {chatView === "learn" && <LearnTab />}

      {chatView === "chat" && <div style={{ flex: 1, maxWidth: 720, width: "100%", margin: "0 auto", padding: "22px 15px", display: "flex", flexDirection: "column", gap: "18px" }}>
        {!hasMessages && (
          <div style={{ textAlign: "center", paddingTop: "10px" }}>
            <div style={{ fontSize: "26px", marginBottom: "6px" }}>🌿</div>
            <h2 style={{ color: "#4a2820", fontSize: "21px", margin: "0 0 6px", fontWeight: "700" }}>What's happening right now?</h2>
            <p style={{ color: "#9a7060", fontSize: "14px", margin: "0 0 20px", lineHeight: 1.6 }}>Describe what's going on, or tap a common situation below.</p>
            {!profileFilled && (
              <div onClick={() => setShowProfile(true)} style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: "rgba(232,147,122,0.1)", border: "1.5px dashed rgba(200,120,90,0.35)", borderRadius: "12px", padding: "10px 18px", marginBottom: "18px", cursor: "pointer", transition: "all 0.2s" }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(232,147,122,0.18)"}
                onMouseLeave={e => e.currentTarget.style.background = "rgba(232,147,122,0.1)"}
              >
                <span style={{ fontSize: "16px" }}>👤</span>
                <span style={{ fontSize: "13px", color: "#7c4a3a", fontWeight: "600" }}>Add your profile to personalize the coaching</span>
                <span style={{ fontSize: "12px", color: "#c9697a" }}>→</span>
              </div>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(185px,1fr))", gap: "9px" }}>
              {SCENARIOS.map(s => (
                <button key={s.label} onClick={() => sendMessage(s.prompt)} style={{ background: "rgba(255,255,255,0.82)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "14px", padding: "13px 14px", fontSize: "13px", color: "#7c4a3a", cursor: "pointer", textAlign: "left", fontFamily: "inherit", lineHeight: 1.4, transition: "all 0.15s" }}
                  onMouseEnter={e => { e.currentTarget.style.background = "rgba(255,240,230,0.95)"; e.currentTarget.style.borderColor = "#e8937a"; }}
                  onMouseLeave={e => { e.currentTarget.style.background = "rgba(255,255,255,0.82)"; e.currentTarget.style.borderColor = "rgba(200,120,90,0.2)"; }}
                >{s.label}</button>
              ))}
            </div>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: "13px" }}>
          {messages.map((m, i) => (
            <div key={i}>
              <div style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                {m.role === "assistant" && <div style={{ width: 30, height: 30, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "13px", marginRight: "8px", flexShrink: 0, marginTop: 2 }}>🌿</div>}
                <div style={{ maxWidth: "82%", padding: "12px 15px", borderRadius: m.role === "user" ? "17px 17px 4px 17px" : "4px 17px 17px 17px", background: m.role === "user" ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.88)", color: m.role === "user" ? "#fff" : "#4a2820", fontSize: "14px", lineHeight: 1.65, boxShadow: m.role === "user" ? "0 3px 12px rgba(200,100,100,0.2)" : "0 2px 10px rgba(150,80,60,0.08)", border: m.role === "assistant" ? "1px solid rgba(200,120,90,0.1)" : "none" }}>
                  {m.role === "assistant" ? formatMessage(m.content) : m.content}
                </div>
              </div>
              {m.role === "assistant" && (
                <div style={{ paddingLeft: "38px", marginTop: "4px" }}>
                  {feedbackSubmitted[i] ? (
                    <span style={{ fontSize: "11px", color: "#a07060" }}>Thanks for your feedback!</span>
                  ) : feedbackOpen === i ? (
                    <div style={{ background: "rgba(255,255,255,0.88)", border: "1px solid rgba(200,120,90,0.18)", borderRadius: "12px", padding: "10px 12px", display: "flex", flexDirection: "column", gap: "8px", maxWidth: "360px" }}>
                      <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
                        <button onClick={() => setFeedbackRating(feedbackRating === "helpful" ? null : "helpful")} style={{ background: feedbackRating === "helpful" ? "rgba(80,160,100,0.15)" : "none", border: feedbackRating === "helpful" ? "1.5px solid rgba(60,140,80,0.4)" : "1px solid rgba(180,130,110,0.3)", borderRadius: "8px", padding: "4px 10px", cursor: "pointer", fontSize: "14px", color: feedbackRating === "helpful" ? "#3a7a50" : "#b89080" }}>👍</button>
                        <button onClick={() => setFeedbackRating(feedbackRating === "not_helpful" ? null : "not_helpful")} style={{ background: feedbackRating === "not_helpful" ? "rgba(200,80,80,0.1)" : "none", border: feedbackRating === "not_helpful" ? "1.5px solid rgba(180,60,60,0.35)" : "1px solid rgba(180,130,110,0.3)", borderRadius: "8px", padding: "4px 10px", cursor: "pointer", fontSize: "14px", color: feedbackRating === "not_helpful" ? "#a04040" : "#b89080" }}>👎</button>
                        <span style={{ fontSize: "11px", color: "#b89080", marginLeft: "2px" }}>How was this response?</span>
                        <button onClick={() => { setFeedbackOpen(null); setFeedbackRating(null); setFeedbackCategory(""); setFeedbackText(""); }} style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: "#b89080", fontSize: "14px", padding: "0 2px" }}>✕</button>
                      </div>
                      <select value={feedbackCategory} onChange={e => setFeedbackCategory(e.target.value)} style={{ fontSize: "12px", borderRadius: "7px", border: "1px solid rgba(180,130,110,0.3)", padding: "5px 8px", background: "rgba(255,255,255,0.9)", color: "#7c4a3a", fontFamily: "inherit" }}>
                        <option value="">Report an issue (optional)</option>
                        <option value="inaccurate">Inaccurate</option>
                        <option value="inappropriate">Inappropriate</option>
                        <option value="didnt_answer">Didn't answer my question</option>
                        <option value="other">Other</option>
                      </select>
                      <textarea value={feedbackText} onChange={e => setFeedbackText(e.target.value)} placeholder="Additional comments (optional)" rows={2} style={{ fontSize: "12px", borderRadius: "7px", border: "1px solid rgba(180,130,110,0.3)", padding: "6px 8px", resize: "none", fontFamily: "inherit", color: "#4a2820", background: "rgba(255,255,255,0.9)" }} />
                      <button onClick={() => submitFeedback(i)} disabled={!feedbackRating && !feedbackCategory || feedbackSubmitting} style={{ alignSelf: "flex-end", background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", borderRadius: "8px", padding: "6px 14px", fontSize: "12px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", opacity: (!feedbackRating && !feedbackCategory) || feedbackSubmitting ? 0.5 : 1 }}>Submit</button>
                    </div>
                  ) : (
                    <button onClick={() => { setFeedbackOpen(i); setFeedbackRating(null); setFeedbackCategory(""); setFeedbackText(""); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#c8a090", fontSize: "13px", padding: "0", opacity: 0.6 }} title="Give feedback">👍👎</button>
                  )}
                </div>
              )}
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              <div style={{ width: 30, height: 30, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "13px" }}>🌿</div>
              <div style={{ background: "rgba(255,255,255,0.88)", padding: "12px 16px", borderRadius: "4px 17px 17px 17px", boxShadow: "0 2px 10px rgba(150,80,60,0.08)", border: "1px solid rgba(200,120,90,0.1)" }}>
                <div style={{ display: "flex", gap: "4px" }}>{[0,1,2].map(j => <div key={j} style={{ width: 6, height: 6, borderRadius: "50%", background: "#e8937a", animation: "pulse 1.2s ease-in-out infinite", animationDelay: `${j*0.2}s` }} />)}</div>
              </div>
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {showLogPrompt && !showLogCard && (
          <div style={{ display: "flex", alignItems: "center", gap: "10px", background: "rgba(255,255,255,0.88)", border: "1.5px solid rgba(200,120,90,0.22)", borderRadius: "14px", padding: "11px 15px", marginTop: "-6px" }}>
            <span style={{ fontSize: "18px" }}>📝</span>
            <div style={{ flex: 1, fontSize: "13px", color: "#7c4a3a", fontWeight: "500" }}>Want to log how this moment went?</div>
            <button onClick={() => { setShowLogCard(true); setShowLogPrompt(false); }} style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", borderRadius: "10px", padding: "7px 14px", fontSize: "13px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>Log it →</button>
            <button onClick={() => { setShowLogPrompt(false); setLogPromptDismissed(true); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#b89080", fontSize: "16px", padding: "2px" }}>✕</button>
          </div>
        )}

        {logSaved && (
          <div style={{ display: "flex", alignItems: "center", gap: "9px", background: "rgba(80,160,100,0.12)", border: "1.5px solid rgba(60,140,80,0.25)", borderRadius: "14px", padding: "11px 15px" }}>
            <span style={{ fontSize: "16px" }}>✅</span>
            <div style={{ fontSize: "13px", color: "#3a7a50", fontWeight: "500" }}>Moment logged! View it in the Progress tab.</div>
          </div>
        )}

        {hasMessages && (
          <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
            {SCENARIOS.map(s => (
              <button key={s.label} onClick={() => sendMessage(s.prompt)} style={{ background: "rgba(255,255,255,0.7)", border: "1px solid rgba(200,120,90,0.17)", borderRadius: "20px", padding: "5px 12px", fontSize: "12px", color: "#7c4a3a", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(255,240,230,0.95)"}
                onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.7)"}
              >{s.label}</button>
            ))}
          </div>
        )}
      </div>}

      {chatView === "chat" && <div style={{ position: "sticky", bottom: 0, background: "rgba(253,246,240,0.93)", backdropFilter: "blur(16px)", borderTop: "1px solid rgba(180,120,90,0.11)", padding: "13px 15px" }}>
        <div style={{ maxWidth: 720, margin: "0 auto", display: "flex", gap: "9px", alignItems: "flex-end" }}>
          <textarea value={input} onChange={e => { if (user.isDemo) { setShowDemoGate(true); return; } setInput(e.target.value); }} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input); } }} placeholder="Describe what's happening right now…" rows={1}
            style={{ flex: 1, padding: "11px 15px", borderRadius: "18px", border: "1.5px solid rgba(200,120,90,0.2)", background: "rgba(255,255,255,0.92)", fontSize: "14px", fontFamily: "inherit", color: "#4a2820", resize: "none", outline: "none", lineHeight: 1.5, maxHeight: "110px", overflow: "auto", transition: "border-color 0.15s" }}
            onFocus={e => e.target.style.borderColor = "#e8937a"} onBlur={e => e.target.style.borderColor = "rgba(200,120,90,0.2)"} />
          <button onClick={() => sendMessage(input)} disabled={!input.trim() || loading} style={{ width: 42, height: 42, borderRadius: "50%", background: input.trim() && !loading ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.17)", border: "none", cursor: input.trim() && !loading ? "pointer" : "default", fontSize: "17px", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s", flexShrink: 0 }}>➤</button>
        </div>
        <div style={{ maxWidth: 720, margin: "6px auto 0", textAlign: "center", fontSize: "11px", color: "#b89080" }}>Not a replacement for therapy · For crisis support, contact emergency services</div>
      </div>}

      <style>{`
        @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
        @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
        *{box-sizing:border-box}
        textarea::placeholder{color:#c4a090}
      `}</style>
    </div>
  );
}

// ── Root ───────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [pendingConsent, setPendingConsent] = useState(null);

  if (pendingConsent) {
    return <ConsentScreen user={pendingConsent} onConsented={() => { setUser(pendingConsent); setPendingConsent(null); }} />;
  }
  if (!user) return <AuthScreen onLogin={setUser} onNeedsConsent={setPendingConsent} onDemo={() => setUser(DEMO_USER)} />;
  if (user.role === "admin") return <AdminDashboard onLogout={() => setUser(null)} />;
  return <ClientChat user={user} onLogout={() => setUser(null)} />;
}

// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
