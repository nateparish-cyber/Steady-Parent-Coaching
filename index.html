                          <pre style={{ fontSize: "11px", color: "#7a6090", background: "rgba(150,120,200,0.06)", borderRadius: "8px", padding: "8px 10px", marginTop: "6px", whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "inherit", lineHeight: 1.5 }}>{f.conversation_excerpt}</pre>
                        </details>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
      </div>

      {/* Reset Password Modal */}
      {resetTarget && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,40,80,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" }} onClick={() => setResetTarget(null)}>
          <div style={{ background: "#f8f7ff", borderRadius: "24px", padding: "32px", maxWidth: 400, width: "92%", boxShadow: "0 20px 60px rgba(80,60,180,0.2)" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: "26px", textAlign: "center", marginBottom: "8px" }}>🔑</div>
            <h3 style={{ color: "#2a2850", textAlign: "center", margin: "0 0 6px", fontSize: "18px" }}>Reset Password</h3>
            <p style={{ color: "#7a70a0", fontSize: "13px", textAlign: "center", margin: "0 0 14px", lineHeight: 1.5 }}>
              Setting a new password for <strong>{resetTarget.name}</strong>
            </p>
            <div style={{ background: "rgba(122,142,232,0.1)", border: "1px solid rgba(122,142,232,0.25)", borderRadius: "10px", padding: "10px 14px", marginBottom: "18px", textAlign: "center" }}>
              <div style={{ fontSize: "11px", color: "#7a70a0", marginBottom: "3px" }}>Their username (share this if they've forgotten)</div>
              <div style={{ fontSize: "17px", fontWeight: "700", color: "#2a2850", letterSpacing: "0.03em" }}>@{resetTarget.username}</div>
            </div>
            {!resetDone ? (
              <>
                <label style={{ fontSize: "13px", color: "#5a5890", fontWeight: "600", display: "block", marginBottom: "6px" }}>New password</label>
                <input type="text" value={newPassword} onChange={e => { setNewPassword(e.target.value); setResetError(""); }} onKeyDown={e => e.key === "Enter" && doReset()} placeholder="Enter new password (min. 6 characters)" autoFocus
                  style={{ width: "100%", padding: "12px 16px", borderRadius: "12px", border: `1.5px solid ${resetError ? "rgba(220,80,80,0.4)" : "rgba(122,142,232,0.3)"}`, fontSize: "14px", fontFamily: "inherit", color: "#2a2850", outline: "none", boxSizing: "border-box", background: "#fff", marginBottom: "6px" }} />
                <p style={{ fontSize: "11px", color: "#9a8ac0", margin: "0 0 14px", lineHeight: 1.5 }}>Shown in plain text so you can read it to the client or send it securely.</p>
                {resetError && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "9px 13px", color: "#c05060", fontSize: "13px", marginBottom: "12px" }}>{resetError}</div>}
                <div style={{ display: "flex", gap: "10px" }}>
                  <Btn onClick={() => setResetTarget(null)} style={{ flex: 1, background: "rgba(150,120,200,0.08)", color: "#7a5aa0", border: "1.5px solid rgba(150,120,200,0.2)" }}>Cancel</Btn>
                  <Btn onClick={doReset} style={{ flex: 1, background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", color: "#fff", border: "none", boxShadow: "0 4px 14px rgba(120,100,200,0.25)" }}>Set Password</Btn>
                </div>
              </>
            ) : (
              <div style={{ textAlign: "center", padding: "8px 0" }}>
                <div style={{ fontSize: "32px", marginBottom: "10px" }}>✅</div>
                <div style={{ fontSize: "15px", fontWeight: "600", color: "#2a2850", marginBottom: "6px" }}>Password updated</div>
                <div style={{ fontSize: "13px", color: "#7a70a0" }}>Share the new credentials with {resetTarget.name.split(" ")[0]} securely.</div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
function ProfileDrawer({ user, onClose, isDemo, onDemoGate, demoProfile }) {
  const EMPTY = { working_on: "", triggers: "", accommodations: "", notes: "", child_gender: "", child_age: "", focus_areas: "" };
  const [draft, setDraft] = useState(EMPTY);
  const [saved, setSaved] = useState(false);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (isDemo) { setDraft({ ...EMPTY, ...(demoProfile || {}) }); setLoading(false); return; }
    getProfile(user.id).then(p => { setDraft({ ...EMPTY, ...p }); setLoading(false); });
  }, [user.id]);

  async function save() {
    if (isDemo) { onDemoGate && onDemoGate(); onClose(); return; }
    await saveProfile(user.id, draft);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const fields = [
    { key: "working_on", label: "🎯 What we're working on in therapy", placeholder: "e.g. reducing bedtime check-ins, getting to school independently, tolerating uncertainty without reassurance…" },
    { key: "triggers", label: "⚡ Specific triggers or patterns", placeholder: "e.g. transitions, separation at school drop-off, asking 'what if' questions repeatedly, stomach aches before events…" },
    { key: "accommodations", label: "🔄 Accommodation habits I'm trying to break", placeholder: "e.g. letting them sleep in our bed, answering the same question multiple times, staying until they fall asleep, checking under the bed…" },
    { key: "notes", label: "📝 Anything else that's helpful to know", placeholder: "e.g. child's age, temperament, what's been working, what hasn't, family context, recent changes…" },
  ];

  return (
    <>
      {/* Backdrop */}
      <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.3)", zIndex: 40, backdropFilter: "blur(2px)" }} />

      {/* Drawer */}
      <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(420px, 100vw)", background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", boxShadow: "-8px 0 40px rgba(150,80,60,0.15)", zIndex: 50, display: "flex", flexDirection: "column", fontFamily: "Georgia,serif", animation: "slideIn 0.25s ease" }}>

        {/* Header */}
        <div style={{ padding: "18px 20px 14px", borderBottom: "1px solid rgba(200,120,90,0.15)", display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,255,255,0.6)", backdropFilter: "blur(8px)", flexShrink: 0 }}>
          <div>
            <div style={{ fontSize: "16px", fontWeight: "700", color: "#4a2820" }}>My Profile</div>
            <div style={{ fontSize: "12px", color: "#9a7060", marginTop: "2px" }}>This helps the coach understand your situation</div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "20px", color: "#9a7060", padding: "4px", lineHeight: 1 }}>✕</button>
        </div>

        {/* Fields */}
        <div style={{ flex: 1, overflowY: "auto", padding: "18px 20px", display: "flex", flexDirection: "column", gap: "18px" }}>
          {loading ? (
            <div style={{ color: "#c9697a", fontSize: "14px", textAlign: "center", padding: "40px 0" }}>Loading…</div>
          ) : (
            <>
              <div style={{ background: "rgba(232,147,122,0.1)", border: "1px solid rgba(200,120,90,0.2)", borderRadius: "12px", padding: "12px 14px", fontSize: "12px", color: "#7c4a3a", lineHeight: 1.6 }}>
                💡 The more you share here, the more personal and relevant the coaching will feel. Only you and Nate can see this.
              </div>

              {/* ── Quick-select fields ── */}
              <div style={{ display: "flex", flexDirection: "column", gap: "14px", background: "rgba(255,255,255,0.7)", borderRadius: "14px", padding: "16px", border: "1.5px solid rgba(200,120,90,0.15)" }}>

                {/* Child's Gender */}
                <div>
                  <label style={{ fontSize: "13px", fontWeight: "700", color: "#4a2820", display: "block", marginBottom: "8px" }}>👦👧 Child's gender</label>
                  <div style={{ display: "flex", gap: "7px", flexWrap: "wrap", alignItems: "center" }}>
                    {["M", "F"].map(g => (
                      <button key={g} onClick={() => setDraft(d => ({ ...d, child_gender: d.child_gender === g ? "" : g }))}
                        style={{ padding: "6px 16px", borderRadius: "20px", border: `1.5px solid ${draft.child_gender === g ? "#e8937a" : "rgba(200,120,90,0.25)"}`, background: draft.child_gender === g ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.9)", color: draft.child_gender === g ? "#fff" : "#7c4a3a", fontSize: "13px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                        {g}
                      </button>
                    ))}
                    <input
                      value={["M","F"].includes(draft.child_gender) ? "" : draft.child_gender}
                      onChange={e => setDraft(d => ({ ...d, child_gender: e.target.value }))}
                      placeholder="Write in…"
                      style={{ flex: 1, minWidth: 80, padding: "6px 12px", borderRadius: "20px", border: `1.5px solid ${draft.child_gender && !["M","F"].includes(draft.child_gender) ? "#e8937a" : "rgba(200,120,90,0.25)"}`, fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", background: draft.child_gender && !["M","F"].includes(draft.child_gender) ? "rgba(232,147,122,0.1)" : "rgba(255,255,255,0.9)" }}
                    />
                  </div>
                </div>

                {/* Child's Age */}
                <div>
                  <label style={{ fontSize: "13px", fontWeight: "700", color: "#4a2820", display: "block", marginBottom: "8px" }}>🎂 Child's age range</label>
                  <div style={{ display: "flex", gap: "7px", flexWrap: "wrap" }}>
                    {["1–4", "5–13", "14–18"].map(a => (
                      <button key={a} onClick={() => setDraft(d => ({ ...d, child_age: d.child_age === a ? "" : a }))}
                        style={{ padding: "6px 16px", borderRadius: "20px", border: `1.5px solid ${draft.child_age === a ? "#e8937a" : "rgba(200,120,90,0.25)"}`, background: draft.child_age === a ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.9)", color: draft.child_age === a ? "#fff" : "#7c4a3a", fontSize: "13px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                        {a}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Focus Area */}
                <div>
                  <label style={{ fontSize: "13px", fontWeight: "700", color: "#4a2820", display: "block", marginBottom: "8px" }}>🎯 Focus area <span style={{ fontSize: "11px", fontWeight: "400", color: "#9a7060" }}>(select all that apply)</span></label>
                  <div style={{ display: "flex", gap: "7px", flexWrap: "wrap" }}>
                    {["Anxiety", "Depression", "ADHD", "Parental regulation"].map(f => {
                      const selected = (draft.focus_areas || "").split(",").map(s => s.trim()).filter(Boolean).includes(f);
                      return (
                        <button key={f} onClick={() => {
                          const current = (draft.focus_areas || "").split(",").map(s => s.trim()).filter(Boolean);
                          const updated = selected ? current.filter(x => x !== f) : [...current, f];
                          setDraft(d => ({ ...d, focus_areas: updated.join(", ") }));
                        }}
                          style={{ padding: "6px 14px", borderRadius: "20px", border: `1.5px solid ${selected ? "#e8937a" : "rgba(200,120,90,0.25)"}`, background: selected ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.9)", color: selected ? "#fff" : "#7c4a3a", fontSize: "13px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                          {f}
                        </button>
                      );
                    })}
                  </div>
                </div>

              </div>

              {fields.map(f => (
                <div key={f.key}>
                  <label style={{ fontSize: "13px", fontWeight: "700", color: "#4a2820", display: "block", marginBottom: "7px" }}>{f.label}</label>
                  <textarea
                    value={draft[f.key]}
                    onChange={e => setDraft(d => ({ ...d, [f.key]: e.target.value }))}
                    placeholder={f.placeholder}
                    rows={3}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.22)", background: "rgba(255,255,255,0.88)", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", resize: "vertical", lineHeight: 1.6, boxSizing: "border-box", transition: "border-color 0.15s" }}
                    onFocus={e => e.target.style.borderColor = "#e8937a"}
                    onBlur={e => e.target.style.borderColor = "rgba(200,120,90,0.22)"}
                  />
                </div>
              ))}

              {/* Profile completeness indicator */}
              {(() => {
                const filled = fields.filter(f => draft[f.key]?.trim()).length;
                const pct = Math.round((filled / fields.length) * 100);
                return filled > 0 ? (
                  <div style={{ padding: "10px 14px", background: "rgba(80,160,100,0.08)", border: "1px solid rgba(60,140,80,0.2)", borderRadius: "10px" }}>
                    <div style={{ fontSize: "12px", color: "#3a7a50", marginBottom: "6px", fontWeight: "600" }}>Profile {pct}% complete</div>
                    <div style={{ height: "5px", background: "rgba(80,160,100,0.15)", borderRadius: "3px", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: "linear-gradient(90deg,#6ac98e,#3aaa6a)", borderRadius: "3px", transition: "width 0.3s" }} />
                    </div>
                  </div>
                ) : null;
              })()}
            </>
          )}
        </div>

        {/* Footer */}
        <div style={{ padding: "14px 20px", borderTop: "1px solid rgba(200,120,90,0.12)", background: "rgba(255,255,255,0.6)", flexShrink: 0 }}>
          <Btn onClick={save} style={{ width: "100%", padding: "13px", background: saved ? "linear-gradient(135deg,#6ac98e,#3aaa6a)" : "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", fontSize: "14px", fontWeight: "700", boxShadow: "0 4px 14px rgba(200,100,100,0.25)", transition: "background 0.3s" }}>
            {saved ? "✓ Saved!" : "Save Profile"}
          </Btn>
          <p style={{ fontSize: "11px", color: "#b89080", textAlign: "center", margin: "8px 0 0", lineHeight: 1.5 }}>Changes take effect in your next message</p>
        </div>
      </div>

      <style>{`@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}`}</style>
    </>
  );
}

// ── Learn Tab ──────────────────────────────────────────────────────────────────
const LearnTab = () => {
  const [current, setCurrent] = React.useState(0);
  const [modal, setModal] = React.useState(null);
  const total = 4;
  const isMobile = window.innerWidth < 600;

  const content = {
    'child-anxiety': {tag:'The anxiety cycle', tagColor:'#FAECE7', tagText:'#993C1D', title:'What child anxiety actually looks like', body:`Child anxiety lives in the body first — and words come second, if at all.\n\nIn younger children it's physical: rigid body, won't move, won't let go. Crying that feels bottomless — not a tantrum, something more desperate. Clinging to a leg, a doorframe, a routine. Saying "I feel sick" and meaning it completely even when nothing is medically wrong.\n\nIn older children it looks different. Irritability from nowhere. Shutdown that reads as attitude but is actually overwhelm. Elaborate negotiation — "just this once," "just five more minutes." Avoidance that looks like defiance. Rage that looks like disrespect.\n\nWhat's happening underneath: the brain's threat detector has flagged something as dangerous. It doesn't matter whether the threat is real — the body responds identically to a bear and a birthday party. Heart rate up. Stomach tight. Breathing shallow. The reasoning brain partially goes offline, which is why logic doesn't work in the moment.\n\nThe child isn't being irrational. They're being human.`},
    'distress-signal': {tag:'The anxiety cycle', tagColor:'#FAEEDA', tagText:'#854F0B', title:'How children signal distress', body:`Children's distress signals are designed — not manipulatively, but biologically — to activate a caregiver's rescue response. They are powerful precisely because they work.\n\nThe obvious signals: crying, screaming, clinging, refusing to move, saying "I can't," physical complaints before triggering situations, begging and bargaining.\n\nThe less obvious ones: shutdown and withdrawal — going quiet, going flat. Rage and aggression — which is often fear wearing an angry costume. Somatic symptoms that are completely real: the stomach genuinely hurts, the head genuinely aches, because the nervous system doesn't separate perceived danger from real danger.\n\nThe ones that fool parents most: the child who becomes suddenly very reasonable — "just explain it one more time." The child who escalates just enough to tip the parent into accommodating. The child who waits until the last possible moment because proximity to the trigger makes the signal most powerful.`},
    'parent-urgency': {tag:'The anxiety cycle', tagColor:'#E6F1FB', tagText:'#185FA5', title:'Why parents feel such urgency', body:`The parental urge to relieve a child's distress is not a character flaw. It is evolution doing exactly what it was designed to do.\n\nWhen a child signals danger — crying, clinging, in pain — a parent's nervous system activates in response. This is attachment working correctly. The problem isn't the urge. The problem is that in the context of anxiety, following the urge makes things worse over time.\n\nMany parents also carry their own history with distress. If big feelings were scary, unseen, or punished in their own childhood, their child's meltdown activates something old — not just parental concern, but something more personal and urgent.\n\nUnderstanding why the urgency is so powerful is the first step to responding differently. It's not about feeling less. It's about choosing a different response to what you feel.`},
    'accommodation': {tag:'The anxiety cycle', tagColor:'#FBEAF0', tagText:'#993556', title:'What accommodation is — and why it feels right', body:`Accommodation is anything a parent does to prevent or reduce a child's contact with anxiety-provoking situations or feelings. It feels like love. It feels like good parenting. It feels like the right thing to do in the moment — because it works immediately.\n\nCommon examples: staying until a child falls asleep, answering "what if" questions repeatedly, allowing a child to miss school or social events, changing family routines to avoid triggers, speaking for a child in social situations, or giving in when a child escalates.\n\nThe problem isn't the behavior — it's what the brain learns from it. Every time accommodation removes the discomfort, the brain records: this was dangerous, and we needed to escape. The anxiety is confirmed rather than challenged.\n\nWarmth is never accommodation. A parent can be completely warm, loving, and present — and still hold firm. In fact, that combination — warmth plus steadiness — is exactly what builds real courage.`},
    'brief-relief': {tag:'The anxiety cycle', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'Why brief relief is so misleading', body:`When a parent accommodates and the child's distress stops — the crying settles, the meltdown ends, the refusal dissolves — it feels like success. The child is okay. The parent is okay. The crisis passed.\n\nThis is the trap. The relief is real, and it's immediate. But it comes at a cost that isn't visible until later: the anxiety is still there, unchanged, waiting for the next trigger. And the brain has just been told — again — that escape was the right move.\n\nBrief relief also reinforces the parent's behavior. Parents get relief too when accommodation works. This creates a two-way loop: both the child and the parent are being reinforced for a pattern that keeps anxiety alive.\n\nThe discomfort of holding firm is front-loaded. The benefit — real, lasting reduction in anxiety — takes days or weeks to show up. This timing mismatch is one of the hardest things about this work.`},
    'anxiety-grows': {tag:'The anxiety cycle', tagColor:'#FAECE7', tagText:'#993C1D', title:'Why anxiety grows with accommodation', body:`Anxiety is maintained by avoidance. Every time a child avoids something that feels scary — and nothing bad happens — the brain draws the wrong conclusion: it was good that we avoided. The threat was real. We should avoid again next time.\n\nOver time, the list of things that feel threatening expands. The threshold for anxiety lowers. Things that felt manageable six months ago now feel impossible. The world feels smaller.\n\nThis is not the child's fault, and it's not the parent's fault. It's the predictable result of a nervous system doing what nervous systems do: learning from experience. The experience it's been given, repeatedly, is that avoidance is safety.\n\nThe reversal requires contact with the fear, tolerated, with a regulated adult present. That's what exposure is. That's what holding steady makes possible.`},
    'staying-bedtime': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Staying until they fall asleep', body:`This is one of the most common and most understandable accommodations. A child is distressed at bedtime — scared, anxious, unable to settle — and a parent stays until they fall asleep. It works. The child settles. Everyone gets some rest.\n\nWhat the brain learns: I cannot fall asleep without my parent present. Sleep itself becomes associated with a need for rescue. Over time the child's ability to self-settle — which is a learnable, buildable skill — never develops.\n\nThe fade approach for bedtime: start with parent present but not engaging, move the chair gradually toward the door over several nights, eventually to outside the door. Slow, steady, with warmth. Each step teaches the brain: I can do this with a little less help than yesterday.\n\nScript: "I know it's hard to fall asleep. I'm going to sit quietly while you practice. I'm right outside when you're ready for morning."`},
    'answering-again': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Answering repeated what-if questions', body:`"What if something bad happens?" "What if I get sick?" "What if you don't come back?" The questions feel like they need answers. And answering feels kind — it feels like you're helping the child feel safe.\n\nBut reassurance is a form of accommodation. Each answer provides temporary relief — and teaches the brain to seek reassurance again next time anxiety spikes. The questions multiply rather than decrease.\n\nWhat to say instead: acknowledge the feeling without answering the content. "I can see you're really worried about that. That's a hard feeling to sit with. You don't need to know the answer right now — your brain is just trying to find certainty, and that's not something I can give you. But I know you can handle not knowing."\n\nThis feels like withholding. It isn't — it's building the child's capacity to tolerate uncertainty, which is one of the most important skills anxiety treatment can develop.`},
    'allowing-avoidance': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Allowing avoidance of school, parties, activities', body:`When a child refuses school, a party, a sports practice — and it's allowed — the immediate relief is real. The morning battle ends. Everyone gets some peace. But the next morning is harder. And the one after that.\n\nAvoidance is the engine of anxiety. The only thing that actually reduces anxiety is contact with the feared situation, survived. Every day of avoidance is a day the brain doesn't get to learn that the feared thing is survivable.\n\nThis doesn't mean forcing. It means not removing the expectation. "I know this feels really scary. You're still going. I'll be right here when you get home and you can tell me everything." Warm, clear, non-negotiating.\n\nThe first few days of returning to something avoided are the hardest. Anxiety spikes before it drops. That spike is not a sign it isn't working — it's a sign the brain is being asked to update its threat assessment. Stay the course.`},
    'changing-routines': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Changing routines to avoid triggers', body:`Families reorganize themselves around a child's anxiety in ways that feel completely normal until someone points them out. Different foods prepared. Different routes driven. Particular seats, particular rituals, particular sequences that must happen exactly right or the whole system breaks down.\n\nEach accommodation feels small in isolation. Together, they add up to a family life shaped by anxiety — where the child's fear has quietly become the organizing principle of the household.\n\nThe goal isn't to eliminate all accommodation overnight. It's to begin, gradually and warmly, to reintroduce flexibility. "Tonight we're going to try it a slightly different way. I know that might feel hard — that's okay. We'll get through it together."\n\nEven small acts of flexibility — a different cup, a slightly different routine — are meaningful exposures that teach the brain: change is survivable.`},
    'speaking-for-them': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Speaking for a child in social situations', body:`A parent speaks for their child at the restaurant, at the doctor's office, at the playdate. The child is capable of speaking — but anxiety freezes them, and the parent steps in before the silence becomes unbearable.\n\nIt feels helpful. It saves the child from embarrassment. It keeps things moving. But it also communicates, over and over: you can't handle this without me. Social situations are too hard for you alone.\n\nThe alternative: pause a beat longer than feels comfortable. Let the silence sit. If the child needs prompting: "Do you want to tell them, or should I wait while you think about it?" Give them the chance to find their words before stepping in.\n\nThis is about tolerating your own discomfort — the awkward pause, the social moment hovering — long enough for the child to discover they can actually do it.`},
    'giving-in': {tag:'Accommodation', tagColor:'#FAECE7', tagText:'#993C1D', title:'Giving in to meltdowns', body:`The meltdown escalates. The child screams, cries, refuses, sometimes becomes physically disruptive. The parent holds firm — and holds firm — and then, at some point, gives in. The meltdown stops. Peace returns.\n\nWhat just happened, from the brain's perspective: the child learned that escalating further produces results. The behavior that got rewarded was the most intense behavior. Next time, the escalation will come sooner and harder.\n\nThis is one of the most painful cycles to be in as a parent because holding firm through an escalating meltdown requires tolerating your own distress — your child's pain, your own guilt, the noise, the chaos — without acting on the urge to make it stop.\n\nScript: "I can see you're really overwhelmed. I'm not going anywhere, and I'm not changing my answer. We're going to get through this together." Then go quiet. Presence without words.`},
    'brain-with': {tag:'What the brain learns', tagColor:'#FAECE7', tagText:'#993C1D', title:'The accommodation sequence', body:`When anxiety is accommodated, a predictable sequence plays out — not just in the moment, but as a pattern the brain is actively learning from.\n\nAnxiety triggers. The child signals distress. The parent responds by removing or reducing the threat. The discomfort disappears.\n\nFrom the outside, this looks like resolution. From the brain's perspective, it's education. The brain has just run an experiment and received a result: when this situation arose, escape was the response, and escape worked. File that away. Do it again next time.\n\nThe problem is that the experiment never gets to run its full course. The child never finds out what would have happened if they stayed with the discomfort — because the discomfort was removed before that data could be collected.`},
    'brain-records-bad': {tag:'What the brain learns', tagColor:'#FAECE7', tagText:'#993C1D', title:'What gets recorded: avoid = relief', body:`The amygdala — the brain's threat detection system — learns through association. When avoidance produces relief, repeatedly, the association becomes deeply encoded: this situation is dangerous, and escape is the correct response.\n\nThis is not conscious or deliberate. The child isn't choosing to be anxious. Their brain has learned a pattern that feels true because it has been repeatedly confirmed by experience.\n\nThe confirmation of the threat is the most important part. Each accommodation doesn't just provide relief — it validates the fear. It says, implicitly: yes, that was dangerous, and yes, you needed to be rescued.\n\nReversing this requires new data. The brain needs repeated experiences of: this felt dangerous, I stayed with it, and I survived. That's what exposure creates. That's what parental steadiness makes possible.`},
    'threshold-lowers': {tag:'What the brain learns', tagColor:'#FCEBEB', tagText:'#A32D2D', title:'The anxiety threshold lowers over time', body:`One of the most important — and least visible — effects of sustained accommodation is that the anxiety threshold lowers. Things that were manageable six months ago now feel impossible. The world gets smaller.\n\nThis happens because the brain is a calibration system. It adjusts its threat assessment based on available data. If the data it keeps receiving is: these situations require escape and rescue, then more situations get classified as requiring escape and rescue.\n\nParents often describe a bewildering expansion of what their child finds impossible. It started with one thing. Now it's everything. This isn't a character shift. It's a nervous system that has been trained, through experience, to expect danger broadly.\n\nThe good news: the calibration works in both directions. With enough experiences of: this was hard and I survived, the threshold rises again. It takes time. It requires tolerating a lot of distress along the way. But the recalibration happens.`},
    'brain-without': {tag:'What the brain learns', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'The exposure sequence', body:`When a parent holds steady — warmly present but not accommodating — a different sequence plays out.\n\nAnxiety triggers. The child signals distress. The parent acknowledges the feeling without removing the trigger: "I can see this is really hard. I'm right here. We're going to get through this." The child stays with the discomfort.\n\nThis is an exposure. The child is in contact with the feared situation, with a regulated adult present, not being rescued. The brain is running the experiment all the way to completion.\n\nWhat the brain discovers: this felt dangerous, I stayed with it, my parent didn't panic, and I survived. That data point is valuable. One is not enough — repetition is what creates learning. But each exposure adds to a growing body of evidence that the feared thing is survivable.`},
    'brain-records-good': {tag:'What the brain learns', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'What gets recorded: I got through it', body:`When a child tolerates discomfort and gets through a hard moment, the brain records something completely different: this situation arose, I stayed, it was hard, and I survived.\n\nThis is the foundation of real confidence — not the reassurance that nothing bad will happen, but the accumulated evidence that hard things can be survived. That kind of confidence is earned through experience, not given through words.\n\nOver repeated exposures, the brain's threat assessment of the situation changes. Not because the situation changed — but because the evidence changed. The feared thing is no longer associated only with danger and escape. It's now associated with difficulty, endurance, and survival.\n\nThis is why exposure works. Not because it eliminates anxiety — but because it teaches a different relationship to it.`},
    'threshold-rises': {tag:'What the brain learns', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'The anxiety threshold rises', body:`As exposures accumulate — as the child survives more and more hard moments — the anxiety threshold gradually rises. Things that once felt impossible begin to feel manageable. The world gets larger.\n\nThis doesn't happen in a straight line. There will be hard days and regression. A child who has been doing well will sometimes hit a wall. That's normal, expected, and not a sign that the work isn't working.\n\nThe trajectory, over weeks and months, is toward more capacity — more situations the child can enter, more discomfort they can tolerate, more moments they can move through without needing rescue.\n\nFor parents, one of the most meaningful signs of progress is not that their child stops feeling anxious. It's that their child feels anxious — and goes anyway.`},
    'child-steady': {tag:'The growth cycle', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'The same child, a different cycle', body:`The child is the same child. The anxiety is real. The distress signals are genuine. What changes in the growth cycle is not the child's internal experience — at least not at first — but the parent's response to it.\n\nAnxiety doesn't disappear because a parent holds steady. The child still feels scared. The meltdown still happens. The refusal is still real. What changes is what those experiences teach.\n\nOver time, as the child accumulates experiences of getting through hard things, the anxiety does reduce. The cycle becomes self-reinforcing in the right direction: more tolerance leads to more exposure, which leads to more evidence of survivability, which leads to more tolerance.\n\nBut it starts with the parent. The child's nervous system co-regulates with the parent's. A regulated parent — warm, steady, not alarmed — is the most powerful tool available.`},
    'distress-steady': {tag:'The growth cycle', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'Reading the distress signal differently', body:`In the growth cycle, the distress signal is the same — but the parent reads it differently.\n\nNot as: my child is in danger and needs rescue. But as: my child's nervous system has activated, and this is an opportunity for them to practice getting through something hard.\n\nThis reframe doesn't make the parent cold or indifferent. It makes them purposeful. The warmth is still completely present. The presence is still completely there. What changes is the goal — from eliminating the distress to accompanying the child through it.\n\n"I see you. This is hard. I'm right here. And we're going to get through this together." That sentence is not accommodation. It's the most loving thing a parent can offer in that moment.`},
    'parent-steady': {tag:'The growth cycle', tagColor:'#E1F5EE', tagText:'#0F6E56', title:'What staying steady actually looks like', body:`Staying steady doesn't mean being cold or pretending nothing is happening. It means being a regulated, present anchor while not removing the discomfort.\n\nPhysically: you stay nearby. You don't flee the emotion, but you don't rush in to fix it either. You might sit down, lower your body, slow your breathing. Your nervous system is saying "I'm not alarmed by this" — even when internally you are.\n\nVerbally: short, calm, present. "I can see this feels really hard." "You're really upset, and that makes sense." "I'm right here." Not a lecture. Not a negotiation. Just a few words that say I see you and I'm not going anywhere.\n\nThe internal move is the hardest part. Staying steady on the outside requires tolerating your own distress inside. Steadiness is you managing your urge to fix — and choosing presence over rescue instead.\n\nScript: "You look really overwhelmed right now, and that makes complete sense. I'm right here with you, and I'm not going anywhere until we get through this together."`},
    'child-tolerates': {tag:'The growth cycle', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'What it looks like when a child tolerates distress', body:`Tolerating distress doesn't look triumphant. It often looks messy, tearful, resistant — and then, slowly, it settles. The child doesn't get through it because they stopped feeling scared. They get through it because they kept going while scared.\n\nSometimes it's a few minutes of crying that gradually subsides. Sometimes it's getting to the school door, staying for five minutes, then ten. Sometimes it's tolerating a changed routine without the meltdown lasting as long as it used to.\n\nParents often miss these moments because they're looking for the wrong thing — a child who seems fine, who appears to have "gotten over it." What to look for instead: a child who felt the fear and stayed anyway. That's the moment to name and honor.\n\n"I noticed how hard that was for you, and you did it anyway. That's real courage."`},
    'builds-capacity': {tag:'The growth cycle', tagColor:'#E1F5EE', tagText:'#0F6E56', title:'What real capacity looks like', body:`Real capacity — the kind that lasts — isn't the absence of anxiety. It's the presence of a self that knows it can handle anxiety.\n\nChildren who have been through the growth cycle develop something that reassurance can never provide: evidence. Not a belief that nothing bad will happen, but a lived knowledge that hard things can be gotten through.\n\nThis shows up in specific ways: attempting things that used to be impossible. Returning to situations they once avoided. Feeling scared and going anyway. Saying, unprompted, "I was nervous but I did it."\n\nIt also shows up in the relationship with the parent. A child whose parent has held steady — warmly, consistently, over time — often develops a deeper trust. Not because the parent made everything easy. Because the parent believed in them enough not to rescue them from their own growth.`},
    'anxiety-reduces': {tag:'The growth cycle', tagColor:'#EAF3DE', tagText:'#3B6D11', title:'How long does it take for anxiety to reduce?', body:`This is the question every parent asks, and the honest answer is: it depends, and it's slower than anyone wants it to be.\n\nResearch on SPACE — the model this approach is based on — shows meaningful reduction in child anxiety within 12 weeks of parents consistently reducing accommodation. Some families see shifts in weeks. Others take longer.\n\nWhat predicts faster progress: parental consistency (the more consistent the reduction in accommodation, the faster the brain recalibrates), the child's age (younger children tend to respond more quickly), and how long the accommodation patterns have been in place.\n\nWhat to expect along the way: things often get harder before they get easier. When accommodation is reduced, anxiety spikes — because the brain is being asked to update a deeply learned pattern. That spike is not failure. It's the process working.\n\nThe most important thing a parent can track is not whether their child seems less anxious day to day — it's whether their child is doing more things despite feeling anxious. That's the real metric.`}
  };

    if (p.accommodations?.trim()) profileLines.push(`Accommodation habits they are actively trying to break: ${p.accommodations.trim()}`);
    if (p.notes?.trim())         profileLines.push(`Additional context from the client: ${p.notes.trim()}`);

    if (profileLines.length > 0) {

  async function sendMessage(text) {
    if (!text.trim() || loading) return;
    if (user.isDemo) { setShowDemoGate(true); return; }
    const newMsgs = [...messages, { role: "user", content: text }];
    setMessages(newMsgs); setInput(""); setLoading(true);
    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system: buildSystemPrompt(), messages: newMsgs }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
      const reply = data.content?.map(b => b.text || "").join("") || "Something went wrong. Please try again.";
      const updated = [...newMsgs, { role: "assistant", content: reply }];
      setMessages(updated);
      const preview = newMsgs[0]?.content?.slice(0, 80) || '';
      const lastMessageAt = new Date().toISOString();

        <Btn onClick={onLogout} style={{ background: "rgba(200,120,90,0.08)", color: "#9a7060", border: "1.5px solid rgba(200,120,90,0.15)", padding: "7px 13px", fontSize: "13px" }}>{user.isDemo ? "← Exit Demo" : "Sign Out"}</Btn>
      </div>

      {user.isDemo && (
        <div style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", padding: "9px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", flexWrap: "wrap" }}>
          <span style={{ color: "#fff", fontSize: "13px", fontWeight: "600", lineHeight: 1.45 }}>
            👋 <strong>Demo mode</strong> — exploring as Sarah. Nothing is saved.

          <button onClick={onLogout} style={{ background: "rgba(255,255,255,0.22)", border: "1px solid rgba(255,255,255,0.4)", borderRadius: "8px", padding: "5px 12px", color: "#fff", fontSize: "12px", fontWeight: "700", cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>

          </button>
        </div>

      <div style={{ maxWidth: 680, margin: "0 auto", padding: "28px 16px" }}>
        <Btn onClick={startNewConversation} style={{ width: "100%", padding: "14px", background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", fontSize: "15px", fontWeight: "700", boxShadow: "0 4px 16px rgba(200,100,100,0.25)", borderRadius: "14px", marginBottom: "24px" }}>
          + Start New Conversation
        </Btn>

        {conversations.length > 0 && (
          <div>
            <button onClick={() => setShowPrevConvs(v => !v)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,255,255,0.6)", border: "1.5px solid rgba(200,120,90,0.18)", borderRadius: showPrevConvs ? "14px 14px 0 0" : "14px", padding: "12px 16px", cursor: "pointer", marginBottom: 0 }}>
              <span style={{ fontSize: "13px", fontWeight: "700", color: "#9a7060", textTransform: "uppercase", letterSpacing: "0.05em" }}>Previous Chats ({conversations.length})</span>
              <span style={{ fontSize: "12px", color: "#b89080", transition: "transform 0.2s", display: "inline-block", transform: showPrevConvs ? "rotate(180deg)" : "rotate(0deg)" }}>▾</span>
            </button>
            {showPrevConvs && (
              <div style={{ border: "1.5px solid rgba(200,120,90,0.18)", borderTop: "none", borderRadius: "0 0 14px 14px", overflow: "hidden", marginBottom: "10px" }}>
                {conversations.map((conv, i) => (
                  <div key={conv.id} style={{ background: i % 2 === 0 ? "rgba(255,255,255,0.88)" : "rgba(253,246,240,0.9)", borderTop: i > 0 ? "1px solid rgba(200,120,90,0.1)" : "none", padding: "14px 16px" }}>
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "10px" }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: "11px", color: "#b89080", marginBottom: "4px" }}>
                          {new Date(conv.last_message_at).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" })}
                        </div>
                        <div style={{ fontSize: "13px", color: conv.preview ? "#4a2820" : "#b89080", lineHeight: 1.5, fontStyle: conv.preview ? "normal" : "italic", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {conv.preview ? `"${conv.preview}"` : "No messages yet"}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: "6px", flexShrink: 0 }}>
                        <Btn onClick={() => setActiveConvId(conv.id)} style={{ background: "rgba(232,147,122,0.12)", color: "#7c4a3a", border: "1.5px solid rgba(200,120,90,0.2)", padding: "5px 12px", fontSize: "12px", fontWeight: "600" }}>
                          Open →
                        </Btn>
                        {deletingConvId === conv.id ? (
                          <>
                            <Btn onClick={async () => {
                              await db.from('conversations').delete().eq('id', conv.id);
                              setConversations(prev => prev.filter(c => c.id !== conv.id));
                              setDeletingConvId(null);
                            }} style={{ background: "rgba(220,60,60,0.12)", color: "#c0392b", border: "1.5px solid rgba(220,60,60,0.25)", padding: "5px 10px", fontSize: "12px", fontWeight: "700" }}>
                              Delete
                            </Btn>
                            <Btn onClick={() => setDeletingConvId(null)} style={{ background: "rgba(200,120,90,0.08)", color: "#9a7060", border: "1.5px solid rgba(200,120,90,0.15)", padding: "5px 10px", fontSize: "12px" }}>
                              Cancel
                            </Btn>
                          </>
                        ) : (
                          <Btn onClick={() => setDeletingConvId(conv.id)} style={{ background: "transparent", color: "#c9a090", border: "1.5px solid rgba(200,120,90,0.15)", padding: "5px 10px", fontSize: "12px" }}>
                            🗑
                          </Btn>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );

  // ── Chat View ───────────────────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100vh", background: BG, fontFamily: "Georgia,serif", display: "flex", flexDirection: "column" }}>
      {showProfile && <ProfileDrawer user={user} onClose={handleProfileClose} isDemo={user.isDemo} onDemoGate={() => { setShowDemoGate(true); }} demoProfile={profile} />}

      {showTutorial && (() => {
        const step = TUTORIAL_STEPS[tutorialStep];
        const isLast = tutorialStep === TUTORIAL_STEPS.length - 1;
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)" }}>
            <div style={{ background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", borderRadius: "28px", padding: "36px 32px 28px", maxWidth: 420, width: "92%", boxShadow: "0 24px 60px rgba(150,80,60,0.22)", textAlign: "center" }}>
              <div style={{ fontSize: "42px", marginBottom: "14px" }}>{step.icon}</div>
              <h2 style={{ color: "#4a2820", fontSize: "19px", margin: "0 0 12px", fontWeight: "700" }}>{step.title}</h2>
              <p style={{ color: "#7c4a3a", fontSize: "14px", lineHeight: 1.7, margin: "0 0 28px" }}>{step.body}</p>

              {/* Step dots */}
              <div style={{ display: "flex", justifyContent: "center", gap: "6px", marginBottom: "22px" }}>
                {TUTORIAL_STEPS.map((_, i) => (
                  <div key={i} style={{ width: i === tutorialStep ? 18 : 7, height: 7, borderRadius: "4px", background: i === tutorialStep ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.2)", transition: "all 0.25s" }} />
                ))}
              </div>

              <div style={{ display: "flex", gap: "10px" }}>
                {tutorialStep > 0 && (
                  <Btn onClick={() => setTutorialStep(s => s - 1)} style={{ flex: 1, background: "rgba(200,120,90,0.08)", color: "#9a7060", border: "1.5px solid rgba(200,120,90,0.2)" }}>← Back</Btn>
                )}
                <Btn onClick={() => { if (isLast) { setShowTutorial(false); } else { setTutorialStep(s => s + 1); } }}
                  style={{ flex: 1, background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", border: "none", boxShadow: "0 4px 14px rgba(200,100,100,0.3)", fontWeight: "700" }}>
                  {isLast ? "Got it, let's go →" : "Next →"}
                </Btn>
              </div>
              <button onClick={() => setShowTutorial(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#b89080", fontSize: "12px", marginTop: "14px", fontFamily: "inherit" }}>Skip tutorial</button>
            </div>
          </div>
        );
      })()}

      {showLogCard && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)" }}>
          <div style={{ background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", borderRadius: "28px", padding: "28px 24px 24px", maxWidth: 420, width: "92%", boxShadow: "0 24px 60px rgba(150,80,60,0.22)" }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "16px" }}>
              <div>
                <div style={{ fontSize: "18px", fontWeight: "700", color: "#4a2820" }}>Log this moment</div>
                {messages.find(m => m.role === 'user') && (
                  <div style={{ fontSize: "12px", color: "#9a7060", marginTop: "5px", fontStyle: "italic", lineHeight: 1.5 }}>
                    "{messages.find(m => m.role === 'user').content.slice(0, 80)}{messages.find(m => m.role === 'user').content.length > 80 ? '…' : ''}"
                  </div>
                )}
              </div>
              <button onClick={() => { setShowLogCard(false); setLogPromptDismissed(true); setSelectedMoment(null); setFreeWriteNote(''); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "18px", color: "#b89080", padding: "2px 2px 2px 10px", flexShrink: 0 }}>✕</button>
            </div>
            <div style={{ fontSize: "13px", color: "#7c4a3a", marginBottom: "12px", fontWeight: "600" }}>How did it go?</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "9px", marginBottom: "14px" }}>
              {[
                { type: "held_firm", icon: "💪", label: "I held firm" },
                { type: "gave_in_caught_myself", icon: "😅", label: "Gave in, caught myself" },
                { type: "kid_win", icon: "🌟", label: "Kid had a win" },
                { type: "free_write", icon: "✍️", label: "Free write" },
              ].map(opt => (
                <button key={opt.type} onClick={() => setSelectedMoment(selectedMoment === opt.type ? null : opt.type)}
                  style={{ background: selectedMoment === opt.type ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.88)", color: selectedMoment === opt.type ? "#fff" : "#7c4a3a", border: `1.5px solid ${selectedMoment === opt.type ? "transparent" : "rgba(200,120,90,0.2)"}`, borderRadius: "14px", padding: "14px 10px", fontSize: "13px", fontWeight: "600", cursor: "pointer", fontFamily: "inherit", textAlign: "center", transition: "all 0.15s", display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
                  <span style={{ fontSize: "22px" }}>{opt.icon}</span>
                  <span>{opt.label}</span>
                </button>
              ))}
            </div>
            {selectedMoment === 'free_write' && (
              <textarea value={freeWriteNote} onChange={e => setFreeWriteNote(e.target.value)}
                placeholder="Write a sentence or two about what happened…" rows={3}
                style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.25)", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", resize: "none", lineHeight: 1.6, boxSizing: "border-box", background: "rgba(255,255,255,0.92)", marginBottom: "12px" }} />
            )}
            {logSaveError && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "9px 13px", color: "#c05060", fontSize: "12px", marginBottom: "10px", lineHeight: 1.5 }}>{logSaveError}</div>}
            <Btn onClick={saveProgressLog} disabled={!selectedMoment || logSaving}
              style={{ width: "100%", padding: "13px", background: selectedMoment && !logSaving ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.2)", color: selectedMoment && !logSaving ? "#fff" : "#b89080", border: "none", fontSize: "14px", fontWeight: "700", boxShadow: selectedMoment ? "0 4px 14px rgba(200,100,100,0.25)" : "none", transition: "all 0.2s" }}>
              {logSaving ? "Saving…" : "Save"}
            </Btn>
          </div>
        </div>
      )}

      {showGoalModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)" }}>
          <div style={{ background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", borderRadius: "28px", padding: "28px 24px 24px", maxWidth: 420, width: "92%", boxShadow: "0 24px 60px rgba(150,80,60,0.22)" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "16px" }}>
              <div style={{ fontSize: "18px", fontWeight: "700", color: "#4a2820" }}>🎯 Weekly Goal</div>

            </div>
            <div style={{ fontSize: "13px", color: "#7c4a3a", marginBottom: "12px", lineHeight: 1.55 }}>What's one parenting goal you want to focus on this week?</div>
