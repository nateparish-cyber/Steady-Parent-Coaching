// ── Client Chat ───────────────────────────────────────────────────────────────
function ClientChat({ user, onLogout }) {
  const [conversations, setConversations] = useState([]);
  const [activeConvId, setActiveConvId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [initializing, setInitializing] = useState(true);
  const [kb, setKb] = useState("");
  const [profile, setProfile] = useState({});
  const [showProfile, setShowProfile] = useState(false);
  const [showProgress, setShowProgress] = useState(false);
  const [showLearn, setShowLearn] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [showSidebar, setShowSidebar] = useState(false);
  const [showConvPicker, setShowConvPicker] = useState(false);
  const [responseLength, setResponseLength] = useState("long"); // "long" | "short"
  const [feedbackModal, setFeedbackModal] = useState(null); // { msgIndex, excerpt }
  const [msgFeedback, setMsgFeedback] = useState({}); // msgIndex → "up"|"down"
  const [showTutorial, setShowTutorial] = useState(false);
  const [logPromptExchanges, setLogPromptExchanges] = useState(0);
  const [showLogPrompt, setShowLogPrompt] = useState(false);
  const [showCancelModal, setShowCancelModal] = useState(false);
  const [cancelState, setCancelState] = useState("idle"); // "idle"|"confirming"|"loading"|"done"|"error"
  const [cancelAt, setCancelAt] = useState(null);
  const [cancelError, setCancelError] = useState("");
  const bottomRef = useRef(null);

  useEffect(() => {
    async function init() {
      if (!user.tutorialDone) setShowTutorial(true);
      const [kbData, profileData] = await Promise.all([getKB(), getProfile(user.id)]);
      setKb(kbData); setProfile(profileData);
      let convs = await getConversations(user.id);
      let skipPicker = false;
      if (convs.length === 0) {
        // Check for legacy messages
        const { data: legacy } = await db.from('messages').select('id').eq('user_id', user.id).limit(1);
        if (legacy?.length > 0) {
          const convId = await createConversation(user.id, "Previous conversations");
          await db.from('messages').update({ conversation_id: convId }).eq('user_id', user.id).is('conversation_id', null);
          convs = [{ id: convId, preview: "Previous conversations", created_at: new Date().toISOString(), last_message_at: new Date().toISOString() }];
        } else {
          // Brand new user — seed their first conversation with a welcome message
          const convId = await createConversation(user.id, "Welcome");
          const welcomeMsg = { role: "assistant", content: WELCOME_MESSAGE };
          await appendMessages(user.id, convId, [welcomeMsg]);
          convs = [{ id: convId, preview: "Welcome", created_at: new Date().toISOString(), last_message_at: new Date().toISOString() }];
          setActiveConvId(convId);
          setMessages([welcomeMsg]);
          skipPicker = true;
        }
      }
      setConversations(convs);
      if (convs.length > 0 && !skipPicker) {
        // Show picker so user chooses to continue or start fresh
        setShowConvPicker(true);
      }
      setInitializing(false);
    }
    init();
  }, [user.id]);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, loading]);

  async function handleProfileClose() {
    setShowProfile(false);
    const p = await getProfile(user.id);
    setProfile(p);
  }

  async function startNewConversation() {
    setShowMenu(false); setShowSidebar(false); setShowConvPicker(false);
    const convId = await createConversation(user.id);

    const genericPreviews = new Set(["new conversation", "welcome", "previous conversations"]);
    const lastPreview = conversations[0]?.preview?.trim();
    const hasContext = lastPreview && !genericPreviews.has(lastPreview.toLowerCase());

    const openingContent = hasContext
      ? `Last time you were working through: **"${lastPreview}${lastPreview.length >= 58 ? "…" : ""}"**\n\nWould you like to pick up from there, or is there something new on your mind?`
      : `Do you know where you'd like to start today, or would you like some help getting started?\n\nYou can describe what's coming up, jump into one of the scenarios below, or explore the Learn tab first and come back with questions.`;

    const openingMsg = { role: "assistant", content: openingContent };
    await appendMessages(user.id, convId, [openingMsg]);

    const newConv = { id: convId, preview: "New conversation", created_at: new Date().toISOString(), last_message_at: new Date().toISOString() };
    setConversations(cs => [newConv, ...cs]);
    setActiveConvId(convId);
    setMessages([openingMsg]);
    setLogPromptExchanges(0); setShowLogPrompt(false);
  }

  async function switchConversation(convId) {
    setShowSidebar(false); setShowMenu(false); setShowConvPicker(false);
    setActiveConvId(convId);
    const msgs = await getMessages(user.id, convId);
    setMessages(msgs);
    setLogPromptExchanges(0); setShowLogPrompt(false);
  }

  function buildSystemPrompt() {
    let base = `${SYSTEM_PROMPT}\n\nThe parent's name is ${user.name}. Address them by first name occasionally where it feels natural.`;
    const p = profile;
    const lines = [];
    if (p.child_gender) lines.push(`Child's gender: ${p.child_gender}`);
    if (p.child_age) lines.push(`Child's age range: ${p.child_age}`);
    if (p.focus_areas) lines.push(`Focus areas: ${p.focus_areas}`);
    if (p.working_on?.trim()) lines.push(`What they are currently working on in therapy: ${p.working_on.trim()}`);
    if (p.triggers?.trim()) lines.push(`Specific triggers or patterns: ${p.triggers.trim()}`);
    if (p.accommodations?.trim()) lines.push(`Accommodation habits they are trying to break: ${p.accommodations.trim()}`);
    if (p.notes?.trim()) lines.push(`Additional context: ${p.notes.trim()}`);
    if (p.weekly_goal?.trim()) lines.push(`Their goal this week: ${p.weekly_goal.trim()}`);
    if (lines.length > 0) base += `\n\n---\n\n## Client Profile\n\n${lines.join("\n\n")}`;
    if (kb.trim()) base += `\n\n---\n\n## Therapist's Clinical Notes\n\n${kb}`;
    if (responseLength === "short") base += `\n\n---\n\nRESPONSE LENGTH: The parent has requested short responses. Keep your reply concise — no more than 3–4 short paragraphs. Get to the heart of it quickly. You can still include a Script section if it's an action-mode response, but keep everything tight.`;
    return base;
  }

  async function sendMessage(text) {
    if (!text.trim() || loading) return;
    const userMsg = { role: "user", content: text };
    const newMsgs = [...messages, userMsg];
    setMessages(newMsgs); setInput(""); setLoading(true);

    // Ensure conversation exists
    let convId = activeConvId;
    if (!convId) {
      convId = await createConversation(user.id, text);
      const newConv = { id: convId, preview: text.slice(0, 60), created_at: new Date().toISOString(), last_message_at: new Date().toISOString() };
      setConversations(cs => [newConv, ...cs]);
      setActiveConvId(convId);
    }

    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system: buildSystemPrompt(), messages: newMsgs }),
      });
      const data = await res.json();
      const reply = data.content?.map(b => b.text || "").join("") || "Something went wrong. Please try again.";
      const assistantMsg = { role: "assistant", content: reply };
      const finalMsgs = [...newMsgs, assistantMsg];
      setMessages(finalMsgs);
      await appendMessages(user.id, convId, [userMsg, assistantMsg]);

      // Update conversation preview
      if (messages.length === 0) await updateConvPreview(convId, text);

      // Usage tracking
      const tokensEst = Math.round((buildSystemPrompt().length + newMsgs.reduce((s, m) => s + m.content.length, 0) + reply.length) / 4);
      logUsage(user.id, user.username, tokensEst);

      // Log prompt
      const exchanges = Math.floor(finalMsgs.length / 2);
      setLogPromptExchanges(exchanges);
      if (exchanges === 3 && !showLogPrompt) setShowLogPrompt(true);
    } catch { setMessages([...newMsgs, { role: "assistant", content: "Connection error. Please try again." }]); }
    setLoading(false);
  }

  function exportChat() {
    const text = `Steady Parent Coach \u2014 ${user.name}\nExported: ${new Date().toLocaleString()}\n\n` + messages.map(m => `${m.role === "user" ? user.name : "Coach"}: ${m.content}`).join("\n\n");
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: `coaching-${Date.now()}.txt` });
    a.click();
  }

  async function confirmCancelSubscription() {
    setCancelState("loading");
    try {
      const res = await fetch("/api/cancel-subscription", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id, sessionToken: user.sessionToken }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to cancel.");
      setCancelAt(data.cancelAt);
      setCancelState("done");
    } catch(e) {
      setCancelError(e.message || "Something went wrong. Please try again or email nate.parish@gmail.com.");
      setCancelState("error");
    }
  }

  async function handleFeedbackUp(msgIndex) {
    setMsgFeedback(f => ({ ...f, [msgIndex]: "up" }));
    const excerpt = messages.slice(Math.max(0, msgIndex - 2), msgIndex + 1).map(m => `${m.role}: ${m.content.slice(0, 200)}`).join("\n");
    saveFeedback(user.id, "up", null, null, excerpt);
  }

  function handleFeedbackDown(msgIndex) {
    const excerpt = messages.slice(Math.max(0, msgIndex - 2), msgIndex + 1).map(m => `${m.role}: ${m.content.slice(0, 200)}`).join("\n");
    setFeedbackModal({ msgIndex, excerpt });
  }

  async function submitFeedback(category, freeText) {
    if (!feedbackModal) return;
    setMsgFeedback(f => ({ ...f, [feedbackModal.msgIndex]: "down" }));
    saveFeedback(user.id, "down", category, freeText, feedbackModal.excerpt);
    setFeedbackModal(null);
  }

  const hasMessages = messages.length > 0;
  const profileFilled = Object.values(profile).some(v => v?.trim());
  const BG = "linear-gradient(145deg,#fdf6f0 0%,#fce8d8 40%,#f5e6f0 100%)";

  if (showProgress) return <ProgressTab user={user} onClose={() => setShowProgress(false)} />;
  if (showLearn) return <LearnTab onClose={() => setShowLearn(false)} />;

  // Conversation picker — shown on login when past conversations exist
  if (showConvPicker) return (
    <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif", padding: "20px" }}>
      <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", gap: "12px" }}>
        <div style={{ textAlign: "center", marginBottom: "8px" }}>
          <div style={{ width: 52, height: 52, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "22px", margin: "0 auto 14px", boxShadow: "0 4px 16px rgba(200,100,100,0.25)" }}>🌿</div>
          <h2 style={{ color: "#4a2820", fontSize: "20px", fontWeight: "700", margin: "0 0 6px" }}>Welcome back, {user.name.split(" ")[0]}</h2>
          <p style={{ color: "#9a7060", fontSize: "14px", margin: 0, lineHeight: 1.6 }}>Pick up where you left off, or start fresh.</p>
        </div>

        <button onClick={startNewConversation} style={{ width: "100%", padding: "16px 18px", borderRadius: "16px", border: "1.5px dashed rgba(200,120,90,0.4)", background: "rgba(255,255,255,0.7)", cursor: "pointer", fontFamily: "inherit", textAlign: "left", transition: "all 0.15s" }}
          onMouseEnter={e => e.currentTarget.style.background = "rgba(255,240,230,0.95)"}
          onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.7)"}>
          <div style={{ fontSize: "15px", fontWeight: "700", color: "#c9697a", marginBottom: "3px" }}>+ Start a new conversation</div>
          <div style={{ fontSize: "13px", color: "#9a7060" }}>Fresh start — blank slate</div>
        </button>

        {conversations.length > 0 && (
          <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "16px", border: "1.5px solid rgba(200,120,90,0.15)", overflow: "hidden" }}>
            <div style={{ padding: "12px 16px 8px", fontSize: "12px", fontWeight: "700", color: "#9a7060", letterSpacing: "0.05em" }}>RECENT CONVERSATIONS</div>
            {conversations.slice(0, 6).map((conv, i) => (
              <button key={conv.id} onClick={() => switchConversation(conv.id)} style={{ width: "100%", padding: "12px 16px", border: "none", borderTop: i > 0 ? "1px solid rgba(200,120,90,0.08)" : "none", background: "transparent", cursor: "pointer", fontFamily: "inherit", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center", transition: "background 0.12s" }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(232,147,122,0.08)"}
                onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                <div style={{ fontSize: "13px", color: "#4a2820", fontWeight: "500", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, marginRight: "12px" }}>{conv.preview || "Conversation"}</div>
                <div style={{ fontSize: "11px", color: "#b89080", flexShrink: 0 }}>{new Date(conv.last_message_at || conv.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  if (initializing) return (
    <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif" }}>
      <div style={{ color: "#c9697a", fontSize: "14px" }}>Loading your conversations…</div>
    </div>
  );

  const MenuItems = () => (
    <div style={{ display: "flex", flexDirection: "column", gap: "2px" }}>
      {[
        ["👤 My Profile", () => { setShowProfile(true); setShowMenu(false); }],
        ["📈 Progress", () => { setShowProgress(true); setShowMenu(false); }],
        ["📚 Learn", () => { setShowLearn(true); setShowMenu(false); }],
        hasMessages ? ["💾 Export Chat", () => { exportChat(); setShowMenu(false); }] : null,
        ["Cancel Subscription", () => { setShowCancelModal(true); setCancelState("confirming"); setCancelError(""); setShowMenu(false); }],
        ["Sign Out", () => { setShowMenu(false); onLogout(); }],
      ].filter(Boolean).map(([label, action]) => (
        <button key={label} onClick={action} style={{ padding: "12px 16px", borderRadius: "10px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", color: "#4a2820", background: "transparent", textAlign: "left", fontWeight: "500", transition: "background 0.15s" }}
          onMouseEnter={e => e.currentTarget.style.background = "rgba(232,147,122,0.1)"}
          onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{label}</button>
      ))}
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: BG, fontFamily: "Georgia,serif", display: "flex", flexDirection: "column" }}>
      {showTutorial && <Tutorial userId={user.id} sessionToken={user.sessionToken} onComplete={() => setShowTutorial(false)} />}
      {showProfile && <ProfileDrawer user={user} onClose={handleProfileClose} />}
      {feedbackModal && <FeedbackModal excerpt={feedbackModal.excerpt} onSubmit={submitFeedback} onClose={() => setFeedbackModal(null)} />}

      {showCancelModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)", padding: "20px" }}>
          <div style={{ background: "#fdf8f4", borderRadius: "24px", padding: "32px", maxWidth: 400, width: "100%", boxShadow: "0 24px 60px rgba(150,80,60,0.22)", fontFamily: "Georgia,serif" }}>
            {cancelState === "confirming" && (
              <>
                <div style={{ fontSize: "28px", textAlign: "center", marginBottom: "12px" }}>⚠️</div>
                <h3 style={{ color: "#4a2820", textAlign: "center", margin: "0 0 10px", fontSize: "18px", fontWeight: "700" }}>Cancel your subscription?</h3>
                <p style={{ color: "#7c5040", fontSize: "13px", lineHeight: 1.7, margin: "0 0 10px", textAlign: "center" }}>
                  Your access will continue until the end of your current billing period. You won't be charged again after that.
                </p>
                <p style={{ color: "#b89080", fontSize: "12px", lineHeight: 1.6, margin: "0 0 24px", textAlign: "center" }}>
                  To reactivate later, you'll need to start a new subscription. Your conversation history will be kept for 30 days after cancellation.
                </p>
                <div style={{ display: "flex", gap: "10px" }}>
                  <button onClick={() => setShowCancelModal(false)} style={{ flex: 1, padding: "12px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.25)", background: "transparent", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", color: "#7c5040", fontWeight: "600" }}>Keep my subscription</button>
                  <button onClick={confirmCancelSubscription} style={{ flex: 1, padding: "12px", borderRadius: "12px", border: "none", background: "rgba(220,80,80,0.12)", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", color: "#c03040", fontWeight: "700" }}>Yes, cancel</button>
                </div>
              </>
            )}
            {cancelState === "loading" && (
              <div style={{ textAlign: "center", padding: "16px 0" }}>
                <div style={{ display: "flex", gap: "5px", justifyContent: "center", marginBottom: "14px" }}>{[0,1,2].map(j => <div key={j} style={{ width: 8, height: 8, borderRadius: "50%", background: "#e8937a", animation: "pulse 1.2s ease-in-out infinite", animationDelay: `${j*0.2}s` }} />)}</div>
                <div style={{ color: "#9a7060", fontSize: "14px" }}>Cancelling subscription…</div>
              </div>
            )}
            {cancelState === "done" && (
              <>
                <div style={{ fontSize: "32px", textAlign: "center", marginBottom: "12px" }}>✅</div>
                <h3 style={{ color: "#4a2820", textAlign: "center", margin: "0 0 10px", fontSize: "18px", fontWeight: "700" }}>Subscription cancelled</h3>
                <p style={{ color: "#7c5040", fontSize: "13px", lineHeight: 1.7, margin: "0 0 6px", textAlign: "center" }}>
                  Your access continues until <strong>{cancelAt ? new Date(cancelAt).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "the end of your billing period"}</strong>.
                </p>
                <p style={{ color: "#b89080", fontSize: "12px", lineHeight: 1.6, margin: "0 0 22px", textAlign: "center" }}>
                  Questions? Email nate.parish@gmail.com
                </p>
                <button onClick={() => setShowCancelModal(false)} style={{ width: "100%", padding: "12px", borderRadius: "12px", border: "none", background: "linear-gradient(135deg,#e8937a,#c9697a)", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", color: "#fff", fontWeight: "700" }}>Close</button>
              </>
            )}
            {cancelState === "error" && (
              <>
                <div style={{ fontSize: "28px", textAlign: "center", marginBottom: "12px" }}>⚠️</div>
                <h3 style={{ color: "#4a2820", textAlign: "center", margin: "0 0 10px", fontSize: "18px" }}>Something went wrong</h3>
                <p style={{ color: "#7c5040", fontSize: "13px", lineHeight: 1.7, margin: "0 0 20px", textAlign: "center" }}>{cancelError}</p>
                <div style={{ display: "flex", gap: "10px" }}>
                  <button onClick={() => setShowCancelModal(false)} style={{ flex: 1, padding: "11px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.25)", background: "transparent", cursor: "pointer", fontFamily: "inherit", fontSize: "13px", color: "#7c5040" }}>Close</button>
                  <button onClick={() => { setCancelState("confirming"); setCancelError(""); }} style={{ flex: 1, padding: "11px", borderRadius: "12px", border: "none", background: "rgba(220,80,80,0.1)", cursor: "pointer", fontFamily: "inherit", fontSize: "13px", color: "#c03040", fontWeight: "600" }}>Try again</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* Conversation sidebar */}
      {showSidebar && (
        <>
          <div onClick={() => setShowSidebar(false)} style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.3)", zIndex: 40 }} />
          <div style={{ position: "fixed", top: 0, left: 0, bottom: 0, width: "min(320px,85vw)", background: "#fdf8f4", boxShadow: "4px 0 30px rgba(150,80,60,0.15)", zIndex: 50, display: "flex", flexDirection: "column", fontFamily: "Georgia,serif" }}>
            <div style={{ padding: "18px 16px 14px", borderBottom: "1px solid rgba(200,120,90,0.15)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ fontSize: "15px", fontWeight: "700", color: "#4a2820" }}>Conversations</div>
              <button onClick={() => setShowSidebar(false)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "18px", color: "#9a7060" }}>✕</button>
            </div>
            <div style={{ padding: "10px 10px", borderBottom: "1px solid rgba(200,120,90,0.1)" }}>
              <button onClick={startNewConversation} style={{ width: "100%", padding: "10px 14px", borderRadius: "12px", border: "1.5px dashed rgba(200,120,90,0.35)", background: "transparent", cursor: "pointer", fontFamily: "inherit", fontSize: "13px", color: "#c9697a", fontWeight: "600" }}>+ New Conversation</button>
            </div>
            <div style={{ flex: 1, overflowY: "auto", padding: "8px" }}>
              {conversations.map(conv => (
                <button key={conv.id} onClick={() => switchConversation(conv.id)} style={{ width: "100%", padding: "12px 14px", borderRadius: "12px", border: "none", cursor: "pointer", fontFamily: "inherit", textAlign: "left", background: conv.id === activeConvId ? "rgba(232,147,122,0.15)" : "transparent", marginBottom: "2px", transition: "background 0.15s" }}
                  onMouseEnter={e => { if (conv.id !== activeConvId) e.currentTarget.style.background = "rgba(232,147,122,0.08)"; }}
                  onMouseLeave={e => { if (conv.id !== activeConvId) e.currentTarget.style.background = "transparent"; }}>
                  <div style={{ fontSize: "13px", color: "#4a2820", fontWeight: conv.id === activeConvId ? "700" : "500", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{conv.preview || "Conversation"}</div>
                  <div style={{ fontSize: "11px", color: "#b89080", marginTop: "3px" }}>{new Date(conv.last_message_at || conv.created_at).toLocaleDateString()}</div>
                </button>
              ))}
            </div>
          </div>
        </>
      )}

      {/* Header */}
      <div style={{ background: "rgba(255,255,255,0.72)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(180,120,90,0.15)", padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 10, gap: "10px" }}>
        {/* Left: conversation sidebar arrow */}
        <button onClick={() => setShowSidebar(s => !s)} title="Conversations" style={{ width: 36, height: 36, borderRadius: "50%", border: "1.5px solid rgba(200,120,90,0.22)", background: showSidebar ? "rgba(232,147,122,0.15)" : "rgba(255,255,255,0.7)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "17px", color: "#c9697a", flexShrink: 0 }}>‹›</button>

        {/* Center: logo + name */}
        <div style={{ display: "flex", alignItems: "center", gap: "8px", flex: 1 }}>
          <div style={{ width: 30, height: 30, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "13px", flexShrink: 0 }}>🌿</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: "14px", fontWeight: "700", color: "#4a2820", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Steady Parent Coach</div>
            <div style={{ fontSize: "11px", color: "#9a7060" }}>Welcome back, {user.name.split(" ")[0]}</div>
          </div>
        </div>

        {/* Right: response length toggle + hamburger */}
        <div style={{ display: "flex", gap: "6px", alignItems: "center", flexShrink: 0 }}>
          {/* Response length toggle */}
          <div style={{ display: "flex", background: "rgba(200,120,90,0.08)", borderRadius: "10px", padding: "3px" }}>
            {[["short", "Short"], ["long", "Long"]].map(([val, label]) => (
              <button key={val} onClick={() => setResponseLength(val)} style={{ padding: "5px 10px", borderRadius: "8px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: "12px", fontWeight: "600", background: responseLength === val ? "#fff" : "transparent", color: responseLength === val ? "#c9697a" : "#b89080", boxShadow: responseLength === val ? "0 1px 4px rgba(150,80,60,0.12)" : "none", transition: "all 0.15s" }}>{label}</button>
            ))}
          </div>
          {/* Hamburger */}
          <div style={{ position: "relative" }}>
            <button onClick={() => setShowMenu(m => !m)} style={{ padding: "6px 8px", borderRadius: "10px", border: "1.5px solid rgba(200,120,90,0.2)", background: showMenu ? "rgba(232,147,122,0.15)" : "rgba(255,255,255,0.7)", cursor: "pointer", color: "#7c4a3a", display: "flex", flexDirection: "column", gap: "4px", alignItems: "center", justifyContent: "center", width: 36, height: 34 }}>
              {[0,1,2].map(i => <div key={i} style={{ width: 15, height: 1.5, background: "#7c4a3a", borderRadius: 1 }} />)}
            </button>
            {showMenu && (
              <>
                <div onClick={() => setShowMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 29 }} />
                <div style={{ position: "absolute", right: 0, top: "calc(100% + 8px)", background: "#fdf8f4", borderRadius: "16px", boxShadow: "0 8px 30px rgba(150,80,60,0.18)", padding: "8px", minWidth: 200, zIndex: 30, border: "1px solid rgba(200,120,90,0.12)", animation: "fadeUp 0.15s ease" }}>
                  <MenuItems />
                </div>
              </>
            )}
          </div>
        </div>
      </div>

      {/* Chat area */}
      <div style={{ flex: 1, maxWidth: 720, width: "100%", margin: "0 auto", padding: "20px 14px", display: "flex", flexDirection: "column", gap: "16px" }}>
        {!hasMessages && (
          <div style={{ textAlign: "center", paddingTop: "8px" }}>
            <div style={{ fontSize: "24px", marginBottom: "6px" }}>🌿</div>
            <h2 style={{ color: "#4a2820", fontSize: "20px", margin: "0 0 6px", fontWeight: "700" }}>What's happening right now?</h2>
            <p style={{ color: "#9a7060", fontSize: "14px", margin: "0 0 18px", lineHeight: 1.6 }}>Describe what's going on, or tap a common situation below.</p>
            {!profileFilled && (
              <div onClick={() => setShowProfile(true)} style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: "rgba(232,147,122,0.1)", border: "1.5px dashed rgba(200,120,90,0.35)", borderRadius: "12px", padding: "10px 18px", marginBottom: "18px", cursor: "pointer" }}>
                <span style={{ fontSize: "14px" }}>👤</span>
                <span style={{ fontSize: "13px", color: "#7c4a3a", fontWeight: "600" }}>Add your profile to personalize the coaching</span>
                <span style={{ fontSize: "12px", color: "#c9697a" }}>→</span>
              </div>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(170px,1fr))", gap: "8px" }}>
              {SCENARIOS.map(s => (
                <button key={s.label} onClick={() => sendMessage(s.prompt)} style={{ background: "rgba(255,255,255,0.82)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "14px", padding: "12px 14px", fontSize: "13px", color: "#7c4a3a", cursor: "pointer", textAlign: "left", fontFamily: "inherit", lineHeight: 1.4, fontWeight: "500", transition: "all 0.15s" }}
                  onMouseEnter={e => { e.currentTarget.style.background = "rgba(255,240,230,0.95)"; e.currentTarget.style.borderColor = "#e8937a"; }}
                  onMouseLeave={e => { e.currentTarget.style.background = "rgba(255,255,255,0.82)"; e.currentTarget.style.borderColor = "rgba(200,120,90,0.2)"; }}>{s.label}</button>
              ))}
            </div>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
          {messages.map((m, i) => (
            <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
              {m.role === "assistant" && <div style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "12px", marginRight: "8px", flexShrink: 0, marginTop: 3 }}>🌿</div>}
              <div style={{ maxWidth: "82%" }}>
                <div style={{ padding: "11px 14px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "4px 16px 16px 16px", background: m.role === "user" ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(255,255,255,0.88)", color: m.role === "user" ? "#fff" : "#4a2820", fontSize: "14px", lineHeight: 1.65, boxShadow: m.role === "user" ? "0 3px 12px rgba(200,100,100,0.2)" : "0 2px 10px rgba(150,80,60,0.08)", border: m.role === "assistant" ? "1px solid rgba(200,120,90,0.1)" : "none" }}>
                  {m.role === "assistant" ? formatMessage(m.content) : m.content}
                </div>
                {m.role === "assistant" && (
                  <div style={{ display: "flex", gap: "4px", marginTop: "5px", paddingLeft: "2px" }}>
                    {[["👍", "up", handleFeedbackUp], ["👎", "down", handleFeedbackDown]].map(([icon, dir, handler]) => (
                      <button key={dir} onClick={() => handler(i)} style={{ padding: "3px 7px", borderRadius: "8px", border: `1px solid ${msgFeedback[i] === dir ? (dir === "up" ? "rgba(80,180,100,0.4)" : "rgba(220,80,80,0.3)") : "rgba(200,120,90,0.15)"}`, background: msgFeedback[i] === dir ? (dir === "up" ? "rgba(80,180,100,0.1)" : "rgba(220,80,80,0.08)") : "transparent", cursor: msgFeedback[i] ? "default" : "pointer", fontSize: "11px", opacity: msgFeedback[i] && msgFeedback[i] !== dir ? 0.3 : 1 }}>{icon}</button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              <div style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "12px" }}>🌿</div>
              <div style={{ background: "rgba(255,255,255,0.88)", padding: "11px 15px", borderRadius: "4px 16px 16px 16px", boxShadow: "0 2px 10px rgba(150,80,60,0.08)", border: "1px solid rgba(200,120,90,0.1)" }}>
                <div style={{ display: "flex", gap: "4px" }}>{[0,1,2].map(j => <div key={j} style={{ width: 6, height: 6, borderRadius: "50%", background: "#e8937a", animation: "pulse 1.2s ease-in-out infinite", animationDelay: `${j*0.2}s` }} />)}</div>
              </div>
            </div>
          )}

          {/* Log prompt after 3 exchanges */}
          {showLogPrompt && !loading && hasMessages && (
            <div style={{ background: "rgba(255,255,255,0.82)", border: "1.5px solid rgba(200,120,90,0.18)", borderRadius: "16px", padding: "14px 16px", animation: "fadeUp 0.3s ease" }}>
              <div style={{ fontSize: "13px", color: "#7c4a3a", fontWeight: "600", marginBottom: "10px" }}>Want to log this moment?</div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                {[["held-firm", "Held firm"], ["gave-in-caught", "Gave in — caught myself"], ["kid-win", "Kid had a win"], ["free-write", "Free write"]].map(([type, label]) => (
                  <button key={type} onClick={async () => { await addProgressLog(user.id, user.username, type, ""); setShowLogPrompt(false); }} style={{ padding: "7px 12px", borderRadius: "18px", border: "1.5px solid rgba(200,120,90,0.25)", background: "rgba(255,255,255,0.8)", cursor: "pointer", fontFamily: "inherit", fontSize: "12px", color: "#7c4a3a", fontWeight: "600" }}>{label}</button>
                ))}
                <button onClick={() => setShowLogPrompt(false)} style={{ padding: "7px 12px", borderRadius: "18px", border: "none", background: "transparent", cursor: "pointer", fontFamily: "inherit", fontSize: "12px", color: "#b89080" }}>Skip</button>
              </div>
            </div>
          )}

          <div ref={bottomRef} />
        </div>

        {hasMessages && (
          <div style={{ display: "flex", gap: "5px", flexWrap: "wrap" }}>
            {SCENARIOS.map(s => (
              <button key={s.label} onClick={() => sendMessage(s.prompt)} style={{ background: "rgba(255,255,255,0.7)", border: "1px solid rgba(200,120,90,0.17)", borderRadius: "18px", padding: "5px 11px", fontSize: "12px", color: "#7c4a3a", cursor: "pointer", fontFamily: "inherit" }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(255,240,230,0.95)"}
                onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.7)"}>{s.label}</button>
            ))}
          </div>
        )}
      </div>

      {/* Input bar */}
      <div style={{ position: "sticky", bottom: 0, background: "rgba(253,246,240,0.93)", backdropFilter: "blur(16px)", borderTop: "1px solid rgba(180,120,90,0.11)", padding: "12px 14px" }}>
        <div style={{ maxWidth: 720, margin: "0 auto", display: "flex", gap: "8px", alignItems: "flex-end" }}>
          <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input); } }}
            placeholder="Describe what's happening right now\u2026" rows={1}
            style={{ flex: 1, padding: "11px 14px", borderRadius: "18px", border: "1.5px solid rgba(200,120,90,0.2)", background: "rgba(255,255,255,0.92)", fontSize: "14px", fontFamily: "inherit", color: "#4a2820", resize: "none", outline: "none", lineHeight: 1.5, maxHeight: "110px", overflow: "auto" }}
            onFocus={e => e.target.style.borderColor = "#e8937a"} onBlur={e => e.target.style.borderColor = "rgba(200,120,90,0.2)"} />
          <button onClick={() => sendMessage(input)} disabled={!input.trim() || loading} style={{ width: 40, height: 40, borderRadius: "50%", background: input.trim() && !loading ? "linear-gradient(135deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.17)", border: "none", cursor: input.trim() && !loading ? "pointer" : "default", fontSize: "16px", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>➤</button>
        </div>
        <div style={{ maxWidth: 720, margin: "5px auto 0", textAlign: "center", fontSize: "11px", color: "#b89080" }}>Not a replacement for therapy · For crisis support, call 911 or 988</div>
      </div>

      <style>{`@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}*{box-sizing:border-box}textarea::placeholder{color:#c4a090}`}</style>
    </div>
  );
}

// ── Admin Dashboard ───────────────────────────────────────────────────────────
function AdminDashboard({ user, onLogout }) {
  const [tab, setTab] = useState("clients");
  const [users, setUsers] = useState({});
  const [kbFolders, setKbFolders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [resetTarget, setResetTarget] = useState(null);
  const [newPassword, setNewPassword] = useState("");
  const [resetDone, setResetDone] = useState(false);
  const [resetError, setResetError] = useState("");
  const [usageData, setUsageData] = useState([]);
  const [feedbackData, setFeedbackData] = useState([]);
  const [testMessages, setTestMessages] = useState([]);
  const [testInput, setTestInput] = useState("");
  const [testLoading, setTestLoading] = useState(false);
  const [feedbackFilter, setFeedbackFilter] = useState("all");

  const P = { background: "linear-gradient(145deg,#f0f4ff 0%,#e8eeff 50%,#f0e8ff 100%)" };

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const [u, folders] = await Promise.all([getUsers(user.adminKey), getKbFolders()]);
    setUsers(u); setKbFolders(folders); setLoading(false);
  }

  useEffect(() => {
    if (tab === "usage" && usageData.length === 0) getAdminUsage().then(setUsageData);
    if (tab === "feedback" && feedbackData.length === 0) getAdminFeedback().then(setFeedbackData);
  }, [tab]);

  async function deleteClient(username) {
    const u = users[username];
    if (!confirm(`Delete ${u.name} and all their data?`)) return;
    try {
      await fetch("/api/admin", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "users", userId: u.id, adminKey: user.adminKey }) });
      const updated = { ...users }; delete updated[username]; setUsers(updated);
    } catch { alert("Failed to delete user."); }
  }

  async function doReset() {
    if (newPassword.length < 6) { setResetError("Password must be at least 6 characters."); return; }
    try {
      await apiPost("/api/account", { action: "reset", userId: resetTarget.id, newPassword });
      setResetDone(true); setTimeout(() => setResetTarget(null), 1800);
    } catch { setResetError("Failed to reset password."); }
  }

  async function addFolder() {
    const folder = { id: crypto.randomUUID(), name: "New folder", content: "", updated_at: new Date().toISOString() };
    await saveKbFolder(folder);
    setKbFolders(fs => [folder, ...fs]);
  }

  async function updateFolder(id, changes) {
    setKbFolders(fs => fs.map(f => f.id === id ? { ...f, ...changes } : f));
  }

  async function commitFolder(folder) {
    await saveKbFolder(folder);
  }

  async function removeFolder(id) {
    if (!confirm("Delete this folder?")) return;
    await deleteKbFolder(id);
    setKbFolders(fs => fs.filter(f => f.id !== id));
  }

  async function sendTestMessage(text) {
    if (!text.trim() || testLoading) return;
    const userMsg = { role: "user", content: text };
    const newMsgs = [...testMessages, userMsg];
    setTestMessages(newMsgs); setTestInput(""); setTestLoading(true);
    try {
      const allKb = kbFolders.map(f => f.content).filter(Boolean).join("\n\n---\n\n");
      const system = `${SYSTEM_PROMPT}${allKb ? `\n\n---\n\n## Therapist's Clinical Notes\n\n${allKb}` : ""}`;
      const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, messages: newMsgs }) });
      const data = await res.json();
      const reply = data.content?.map(b => b.text || "").join("") || "Error";
      setTestMessages([...newMsgs, { role: "assistant", content: reply }]);
    } catch { setTestMessages([...newMsgs, { role: "assistant", content: "Connection error." }]); }
    setTestLoading(false);
  }

  const clientList = Object.values(users);
  const tabs = [["clients", `Clients (${clientList.length})`], ["kb", "Knowledge Base"], ["test", "Test Chat"], ["usage", "Usage"], ["feedback", "Feedback"]];

  // Usage summary
  const totalTokens = usageData.reduce((s, r) => s + (r.tokens_estimated || 0), 0);
  const estCost = ((totalTokens / 1000) * 0.003).toFixed(2);
  const userUsage = usageData.reduce((acc, r) => {
    if (!acc[r.username]) acc[r.username] = { tokens: 0, count: 0 };
    acc[r.username].tokens += r.tokens_estimated || 0;
    acc[r.username].count++;
    return acc;
  }, {});

  const filteredFeedback = feedbackFilter === "all" ? feedbackData : feedbackData.filter(f => f.rating === feedbackFilter);
  const thumbsUp = feedbackData.filter(f => f.rating === "up").length;
  const thumbsDown = feedbackData.filter(f => f.rating === "down").length;

  return (
    <div style={{ minHeight: "100vh", ...P, fontFamily: "Georgia,serif" }}>
      <div style={{ background: "rgba(255,255,255,0.75)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(100,100,200,0.12)", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
          <div style={{ width: 36, height: 36, borderRadius: "50%", background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "15px" }}>🔐</div>
          <div><div style={{ fontSize: "15px", fontWeight: "700", color: "#2a2850" }}>Admin Dashboard</div><div style={{ fontSize: "11px", color: "#7a70a0" }}>Steady Parent Coach</div></div>
        </div>
        <Btn onClick={onLogout} style={{ background: "rgba(150,100,200,0.1)", color: "#7a5aa0", border: "1.5px solid rgba(150,100,200,0.2)", padding: "7px 14px", fontSize: "13px" }}>Sign Out</Btn>
      </div>

      <div style={{ maxWidth: 800, margin: "0 auto", padding: "20px 16px" }}>
        <div style={{ background: "rgba(255,255,255,0.7)", border: "1px solid rgba(122,142,232,0.2)", borderRadius: "14px", padding: "12px 16px", marginBottom: "18px", fontSize: "13px", color: "#5a5890", lineHeight: 1.65 }}>
          🔒 <strong style={{ color: "#2a2850" }}>Client conversations and profiles are private.</strong> You can manage accounts and the knowledge base below, but chat histories are not accessible from here.
        </div>

        {/* Tab bar */}
        <div style={{ display: "flex", gap: "6px", marginBottom: "20px", overflowX: "auto", paddingBottom: "4px" }}>
          {tabs.map(([t, label]) => (
            <button key={t} onClick={() => setTab(t)} style={{ padding: "8px 14px", borderRadius: "20px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: "12px", fontWeight: "700", background: tab === t ? "linear-gradient(135deg,#7a8ee8,#9a6ac9)" : "rgba(255,255,255,0.72)", color: tab === t ? "#fff" : "#7a70a0", whiteSpace: "nowrap", boxShadow: tab === t ? "0 4px 12px rgba(120,100,200,0.28)" : "none" }}>{label}</button>
          ))}
        </div>

        {/* Clients Tab */}
        {tab === "clients" && (
          <div>
            {loading ? <div style={{ color: "#9a8ac0", textAlign: "center", padding: "40px" }}>Loading clients…</div>
            : clientList.length === 0 ? (
              <div style={{ background: "rgba(255,255,255,0.72)", borderRadius: "18px", padding: "36px", textAlign: "center", color: "#9a8ac0" }}>
                <div style={{ fontSize: "32px", marginBottom: "10px" }}>👥</div>
                <div style={{ fontSize: "15px", fontWeight: "600" }}>No clients yet</div>
              </div>
            ) : clientList.map(u => (
              <div key={u.id} style={{ background: "rgba(255,255,255,0.82)", border: "1.5px solid rgba(150,120,200,0.12)", borderRadius: "14px", padding: "14px 16px", marginBottom: "8px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <div style={{ width: 38, height: 38, borderRadius: "50%", background: "linear-gradient(135deg,#b8c8f0,#d0a8e8)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "15px", fontWeight: "700", color: "#4a4880", flexShrink: 0 }}>{u.name[0].toUpperCase()}</div>
                  <div>
                    <div style={{ fontSize: "14px", fontWeight: "600", color: "#2a2850" }}>{u.name}</div>
                    <div style={{ fontSize: "11px", color: "#9a8ac0", display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
                      <span>@{u.username}</span><span>·</span><span>{new Date(u.createdAt).toLocaleDateString()}</span>
                      {u.email && <><span>·</span><span>{u.email}</span></>}
                      <span style={{ padding: "1px 7px", borderRadius: "8px", fontSize: "11px", fontWeight: "600", background: u.consentSigned ? "rgba(80,160,100,0.12)" : "rgba(220,150,80,0.15)", color: u.consentSigned ? "#3a7a50" : "#a06020" }}>{u.consentSigned ? "✓ Consent" : "⚠ Pending"}</span>
                    </div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: "5px" }}>
                  <button onClick={() => { setResetTarget(u); setNewPassword(""); setResetDone(false); setResetError(""); }} title="Reset password" style={{ background: "none", border: "none", cursor: "pointer", fontSize: "14px", opacity: 0.4, padding: "4px" }} onMouseEnter={e => e.currentTarget.style.opacity = 1} onMouseLeave={e => e.currentTarget.style.opacity = 0.4}>🔑</button>
                  <button onClick={() => deleteClient(u.username)} title="Delete" style={{ background: "none", border: "none", cursor: "pointer", fontSize: "14px", opacity: 0.4, padding: "4px" }} onMouseEnter={e => e.currentTarget.style.opacity = 1} onMouseLeave={e => e.currentTarget.style.opacity = 0.4}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* KB Tab */}
        {tab === "kb" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
              <div style={{ fontSize: "14px", color: "#5a5890", lineHeight: 1.5 }}>Each folder is silently included in every client's AI context.</div>
              <Btn onClick={addFolder} style={{ background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", color: "#fff", border: "none", padding: "8px 16px", fontSize: "13px" }}>+ New Folder</Btn>
            </div>
            {kbFolders.length === 0 ? (
              <div style={{ background: "rgba(255,255,255,0.7)", borderRadius: "16px", padding: "28px", textAlign: "center", color: "#9a8ac0", fontSize: "14px" }}>No folders yet. Click "+ New Folder" to start.</div>
            ) : kbFolders.map(folder => (
              <div key={folder.id} style={{ background: "rgba(255,255,255,0.82)", border: "1px solid rgba(150,120,200,0.15)", borderRadius: "16px", padding: "16px 18px", marginBottom: "12px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
                  <input value={folder.name} onChange={e => updateFolder(folder.id, { name: e.target.value })} onBlur={() => commitFolder(folder)}
                    style={{ border: "none", outline: "none", fontSize: "14px", fontWeight: "700", color: "#2a2850", background: "transparent", fontFamily: "inherit", flex: 1 }} />
                  <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                    {folder.updated_at && <span style={{ fontSize: "11px", color: "#9a8ac0" }}>{new Date(folder.updated_at).toLocaleDateString()}</span>}
                    <button onClick={() => removeFolder(folder.id)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "13px", opacity: 0.4, padding: "2px 4px" }} onMouseEnter={e => e.currentTarget.style.opacity = 1} onMouseLeave={e => e.currentTarget.style.opacity = 0.4}>🗑</button>
                  </div>
                </div>
                <textarea value={folder.content || ""} onChange={e => updateFolder(folder.id, { content: e.target.value })} onBlur={() => commitFolder(folder)}
                  rows={5} placeholder="Paste clinical notes, frameworks, or protocols here…"
                  style={{ width: "100%", padding: "12px 14px", borderRadius: "10px", border: "1.5px solid rgba(150,120,200,0.2)", fontSize: "13px", fontFamily: "inherit", color: "#2a2850", outline: "none", resize: "vertical", lineHeight: 1.65, boxSizing: "border-box", background: "#fdfcff" }} />
                {folder.content && <div style={{ fontSize: "11px", color: "#7a70a0", marginTop: "6px" }}>{folder.content.split(" ").filter(Boolean).length} words</div>}
              </div>
            ))}
          </div>
        )}

        {/* Test Chat Tab */}
        {tab === "test" && (
          <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "18px", padding: "18px", border: "1px solid rgba(150,120,200,0.12)" }}>
            <div style={{ fontSize: "13px", color: "#7a70a0", marginBottom: "14px" }}>Test how the AI responds with your current knowledge base loaded.</div>
            <div style={{ maxHeight: "400px", overflowY: "auto", display: "flex", flexDirection: "column", gap: "10px", marginBottom: "14px", padding: "4px" }}>
              {testMessages.length === 0 && <div style={{ color: "#9a8ac0", textAlign: "center", padding: "20px", fontSize: "13px" }}>Send a message to test the AI response…</div>}
              {testMessages.map((m, i) => (
                <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                  <div style={{ maxWidth: "85%", padding: "10px 13px", borderRadius: m.role === "user" ? "14px 14px 4px 14px" : "4px 14px 14px 14px", background: m.role === "user" ? "linear-gradient(135deg,#7a8ee8,#9a6ac9)" : "rgba(240,238,255,0.9)", color: m.role === "user" ? "#fff" : "#2a2850", fontSize: "13px", lineHeight: 1.6 }}>
                    {m.role === "assistant" ? formatMessage(m.content) : m.content}
                  </div>
                </div>
              ))}
              {testLoading && <div style={{ color: "#9a8ac0", fontSize: "13px", padding: "8px" }}>Thinking…</div>}
            </div>
            <div style={{ display: "flex", gap: "8px" }}>
              <input value={testInput} onChange={e => setTestInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendTestMessage(testInput)}
                placeholder="Type a test message…"
                style={{ flex: 1, padding: "10px 14px", borderRadius: "12px", border: "1.5px solid rgba(150,120,200,0.25)", fontSize: "13px", fontFamily: "inherit", color: "#2a2850", outline: "none", background: "#fdfcff" }} />
              <Btn onClick={() => sendTestMessage(testInput)} disabled={!testInput.trim() || testLoading} style={{ background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", color: "#fff", border: "none", padding: "10px 16px", fontSize: "13px" }}>Send</Btn>
            </div>
            {testMessages.length > 0 && <button onClick={() => setTestMessages([])} style={{ marginTop: "10px", background: "none", border: "none", cursor: "pointer", color: "#9a8ac0", fontSize: "12px", fontFamily: "inherit" }}>Clear conversation</button>}
          </div>
        )}

        {/* Usage Tab */}
        {tab === "usage" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "10px", marginBottom: "18px" }}>
              {[["Total messages", usageData.length, "#7a8ee8"], ["Est. tokens", totalTokens.toLocaleString(), "#9a6ac9"], [`Est. cost`, `$${estCost}`, "#5a9ac9"]].map(([label, val, color]) => (
                <div key={label} style={{ background: "rgba(255,255,255,0.82)", borderRadius: "14px", padding: "14px", textAlign: "center", border: "1px solid rgba(150,120,200,0.12)" }}>
                  <div style={{ fontSize: "22px", fontWeight: "700", color }}>{val}</div>
                  <div style={{ fontSize: "11px", color: "#9a8ac0", marginTop: "3px" }}>{label}</div>
                </div>
              ))}
            </div>
            <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "16px", padding: "16px", border: "1px solid rgba(150,120,200,0.12)" }}>
              <div style={{ fontSize: "13px", fontWeight: "700", color: "#2a2850", marginBottom: "12px" }}>Per-user breakdown</div>
              {Object.entries(userUsage).sort((a, b) => b[1].tokens - a[1].tokens).map(([uname, data]) => (
                <div key={uname} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid rgba(150,120,200,0.08)", fontSize: "13px" }}>
                  <span style={{ color: "#2a2850" }}>@{uname}</span>
                  <span style={{ color: "#7a70a0" }}>{data.count} msgs · {data.tokens.toLocaleString()} tokens · ${((data.tokens / 1000) * 0.003).toFixed(2)}</span>
                </div>
              ))}
              {Object.keys(userUsage).length === 0 && <div style={{ color: "#9a8ac0", textAlign: "center", padding: "16px", fontSize: "13px" }}>No usage data yet.</div>}
            </div>
          </div>
        )}

        {/* Feedback Tab */}
        {tab === "feedback" && (
          <div>
            <div style={{ display: "flex", gap: "10px", marginBottom: "16px" }}>
              {[["all", `All (${feedbackData.length})`], ["up", `👍 ${thumbsUp}`], ["down", `👎 ${thumbsDown}`]].map(([f, label]) => (
                <button key={f} onClick={() => setFeedbackFilter(f)} style={{ padding: "7px 14px", borderRadius: "18px", border: `1.5px solid ${feedbackFilter === f ? "#7a8ee8" : "rgba(150,120,200,0.2)"}`, background: feedbackFilter === f ? "#7a8ee8" : "rgba(255,255,255,0.7)", color: feedbackFilter === f ? "#fff" : "#7a70a0", cursor: "pointer", fontFamily: "inherit", fontSize: "12px", fontWeight: "700" }}>{label}</button>
              ))}
            </div>
            {filteredFeedback.length === 0 ? (
              <div style={{ background: "rgba(255,255,255,0.7)", borderRadius: "16px", padding: "28px", textAlign: "center", color: "#9a8ac0", fontSize: "13px" }}>No feedback yet.</div>
            ) : filteredFeedback.map((f, i) => (
              <div key={f.id || i} style={{ background: "rgba(255,255,255,0.82)", borderRadius: "14px", padding: "14px 16px", marginBottom: "8px", border: "1px solid rgba(150,120,200,0.12)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "6px" }}>
                  <span style={{ fontSize: "16px" }}>{f.rating === "up" ? "👍" : "👎"}</span>
                  <span style={{ fontSize: "11px", color: "#9a8ac0" }}>{f.report_category && <span style={{ background: "rgba(150,120,200,0.1)", padding: "2px 8px", borderRadius: "8px", marginRight: "6px" }}>{f.report_category}</span>}{new Date(f.created_at).toLocaleDateString()}</span>
                </div>
                {f.free_text && <div style={{ fontSize: "13px", color: "#5a5890", lineHeight: 1.5, marginBottom: "6px" }}>{f.free_text}</div>}
                {f.conversation_excerpt && <div style={{ fontSize: "11px", color: "#9a8ac0", background: "rgba(150,120,200,0.05)", borderRadius: "8px", padding: "8px 10px", lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{f.conversation_excerpt.slice(0, 300)}{f.conversation_excerpt.length > 300 ? "…" : ""}</div>}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Reset Password Modal */}
      {resetTarget && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,40,80,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" }} onClick={() => setResetTarget(null)}>
          <div style={{ background: "#f8f7ff", borderRadius: "22px", padding: "28px", maxWidth: 380, width: "90%", boxShadow: "0 20px 60px rgba(80,60,180,0.2)" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: "24px", textAlign: "center", marginBottom: "8px" }}>🔑</div>
            <h3 style={{ color: "#2a2850", textAlign: "center", margin: "0 0 6px", fontSize: "17px" }}>Reset Password</h3>
            <p style={{ color: "#7a70a0", fontSize: "13px", textAlign: "center", margin: "0 0 16px" }}>Setting a new password for <strong>{resetTarget.name}</strong></p>
            <div style={{ background: "rgba(122,142,232,0.1)", borderRadius: "10px", padding: "10px 14px", marginBottom: "16px", textAlign: "center" }}>
              <div style={{ fontSize: "11px", color: "#7a70a0", marginBottom: "3px" }}>Username</div>
              <div style={{ fontSize: "17px", fontWeight: "700", color: "#2a2850" }}>@{resetTarget.username}</div>
            </div>
            {!resetDone ? (
              <>
                <input type="text" value={newPassword} onChange={e => { setNewPassword(e.target.value); setResetError(""); }} onKeyDown={e => e.key === "Enter" && doReset()} placeholder="New password (min. 6 chars)" autoFocus
                  style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: `1.5px solid ${resetError ? "rgba(220,80,80,0.4)" : "rgba(122,142,232,0.3)"}`, fontSize: "14px", fontFamily: "inherit", color: "#2a2850", outline: "none", boxSizing: "border-box", background: "#fff", marginBottom: "6px" }} />
                <p style={{ fontSize: "11px", color: "#9a8ac0", margin: "0 0 12px" }}>Shown in plain text so you can read it to the client.</p>
                {resetError && <div style={{ background: "rgba(220,80,80,0.08)", borderRadius: "10px", padding: "8px 12px", color: "#c05060", fontSize: "13px", marginBottom: "10px" }}>{resetError}</div>}
                <div style={{ display: "flex", gap: "8px" }}>
                  <Btn onClick={() => setResetTarget(null)} style={{ flex: 1, background: "rgba(150,120,200,0.08)", color: "#7a5aa0", border: "1.5px solid rgba(150,120,200,0.2)" }}>Cancel</Btn>
                  <Btn onClick={doReset} style={{ flex: 1, background: "linear-gradient(135deg,#7a8ee8,#9a6ac9)", color: "#fff", border: "none" }}>Set Password</Btn>
                </div>
              </>
            ) : (
              <div style={{ textAlign: "center", padding: "8px 0" }}>
                <div style={{ fontSize: "30px", marginBottom: "8px" }}>✅</div>
                <div style={{ fontSize: "14px", fontWeight: "600", color: "#2a2850" }}>Password updated</div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Subscription Gate ─────────────────────────────────────────────────────────
function SubscriptionGate({ user, onActivated, onLogout }) {
  const [loading, setLoading] = useState(true);
  const [redirecting, setRedirecting] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    async function check() {
      try {
        const res = await fetch("/api/subscription-status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: user.id, sessionToken: user.sessionToken }) });
        const data = await res.json();
        if (data.active) { onActivated(); return; }
        setLoading(false);
      } catch { setError("Couldn't check subscription status. Please try again."); setLoading(false); }
    }
    check();
  }, [user.id]);

  async function startCheckout() {
    setRedirecting(true);
    try {
      const res = await fetch("/api/create-checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: user.id, email: user.email, name: user.name }) });
      const data = await res.json();
      if (data.grandfathered || data.alreadyActive) { onActivated(); return; }
      if (data.url) { window.location.href = data.url; return; }
      setError(data.error || "Couldn't start checkout.");
    } catch { setError("Couldn't reach the server. Please try again."); }
    setRedirecting(false);
  }

  const BG = "linear-gradient(145deg,#fdf6f0 0%,#fce8d8 40%,#f5e6f0 100%)";
  if (loading) return <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif" }}><div style={{ color: "#c9697a", fontSize: "14px" }}>Checking your account…</div></div>;

  return (
    <div style={{ minHeight: "100vh", background: BG, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif", padding: "20px" }}>
      <div style={{ background: "rgba(255,255,255,0.92)", borderRadius: "28px", padding: "38px 34px", maxWidth: 440, width: "100%", boxShadow: "0 20px 60px rgba(150,80,60,0.13)", textAlign: "center" }}>
        <div style={{ width: 56, height: 56, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "24px", margin: "0 auto 16px", boxShadow: "0 4px 16px rgba(200,100,100,0.3)" }}>🌿</div>
        <h2 style={{ color: "#4a2820", fontSize: "22px", margin: "0 0 10px", fontWeight: "700" }}>Start Your Free Trial</h2>
        <p style={{ color: "#7c4a3a", fontSize: "14px", lineHeight: 1.7, margin: "0 0 8px" }}><strong>7 days free</strong>, then $19.99/month. Cancel anytime.</p>
        <p style={{ color: "#9a7060", fontSize: "13px", lineHeight: 1.6, margin: "0 0 26px" }}>Unlimited coaching · Progress tracking · Interactive learning · Evidence-based parenting support</p>
        {error && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#c05060", fontSize: "13px", marginBottom: "14px" }}>{error}</div>}
        <Btn onClick={startCheckout} disabled={redirecting} style={{ width: "100%", padding: "14px", background: redirecting ? "rgba(200,120,90,0.3)" : "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", fontSize: "15px", fontWeight: "700", borderRadius: "14px", marginBottom: "10px" }}>
          {redirecting ? "Opening checkout…" : "Start 7-Day Free Trial →"}
        </Btn>
        <p style={{ color: "#b89080", fontSize: "11px", margin: "0 0 14px" }}>No charge during trial · Secure payment via Stripe · Cancel anytime</p>
        <button onClick={onLogout} style={{ background: "none", border: "none", cursor: "pointer", color: "#b89080", fontSize: "12px", fontFamily: "inherit" }}>Sign out</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const SESSION_KEY = "spc_session_v1";
function loadSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function saveSession(u) {
  try { if (u) localStorage.setItem(SESSION_KEY, JSON.stringify(u)); else localStorage.removeItem(SESSION_KEY); } catch {}
}

function App() {
  const [user, setUserState] = useState(null);
  const [pendingConsent, setPendingConsent] = useState(null);
  const [needsSubscription, setNeedsSubscription] = useState(false);
  const [hydrated, setHydrated] = useState(false);

  function setUser(u) { setUserState(u); saveSession(u); }
  function logout() { setUserState(null); setNeedsSubscription(false); saveSession(null); }

  useEffect(() => {
    const stored = loadSession();
    if (stored) {
      setUserState(stored);
      if (stored.role !== "admin") setNeedsSubscription(true);
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get("checkout") === "success" || params.get("checkout") === "cancelled") {
      window.history.replaceState({}, "", window.location.pathname);
    }
    setHydrated(true);
  }, []);

  if (!hydrated) return null;
  if (pendingConsent) return <ConsentScreen user={pendingConsent} onConsented={() => { setPendingConsent(null); setNeedsSubscription(true); setUser({ ...pendingConsent, consentSigned: true }); }} />;
  if (!user) return <AuthScreen onLogin={u => { setUser(u); if (u.role !== "admin") setNeedsSubscription(true); }} onNeedsConsent={setPendingConsent} />;
  if (needsSubscription && user.role !== "admin") return <SubscriptionGate user={user} onActivated={() => setNeedsSubscription(false)} onLogout={logout} />;
  if (user.role === "admin") return <AdminDashboard user={user} onLogout={logout} />;
  return <ClientChat user={user} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
