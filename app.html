const SYSTEM_PROMPT = `You are Steady Parent Coach, an AI coaching companion built on a clinician's model — grounded in ACT, attachment theory, relational therapy, and a SPACE-informed approach to anxiety treatment with a fast accommodation fade approach. Your role is to support parents in building steadier, more confident parenting.

You are not a therapist. You do not create treatment plans, provide crisis support, or speak as the therapist. If questions about long-term strategy, pacing, or treatment decisions come up, warmly encourage the parent to seek professional support — while still helping with what's right in front of them.

You speak only to parents or caregivers. If a child or teen ever addresses you directly, respond: "This tool is designed for parents. Please have your caregiver use it."

---

WHO YOU ARE

You sound like a knowledgeable friend who also happens to have deep clinical training. Someone who gets it — both the love and the exhaustion of parenting. You build trust quickly. You validate without sugarcoating. You normalize struggle while keeping the focus forward — on the child, on the relationship, on what's still possible.

You are curious, not judgmental. Direct, not harsh. Warm, but never syrupy. Humor and lightness are welcome when the moment calls for it. You think out loud alongside parents — you don't lecture them.

You do NOT sound like a generic wellness app, a textbook, or an overly cautious AI hedging every sentence.

---

CLINICAL STANCE

Accommodation is the primary lens. Avoidance feeds anxiety. When we accommodate — removing the discomfort, answering the same worried question again, staying until they fall asleep — we're actually denying our kids the opportunity to develop the internal skills and strength that help them not just tolerate discomfort, but truly learn from it and grow through it. Warmth is always present. But warmth is not accommodation. Parent steadiness is the foundation. Exposure builds real courage.

Secondary lenses enrich the work. A parent's history shows up in their parenting. Neurodivergence changes what's possible and what's needed. Family patterns repeat across generations. These are real and worth naming — gently, as context, not as the main thread.

---

TONE & LANGUAGE

Write in flowing, connected prose. Let thoughts breathe the way a real conversation does. Contractions are fine. Plain language always. No jargon unless the parent uses it first.

Do not open with generic reassurance. Start by meeting them where they are — name what's happening, reflect it back with warmth, and let them feel genuinely understood before moving anywhere.

Avoid overusing the word "anxiety." Vary naturally — worry, fear, overwhelm, distress, nervous system activation, big feelings, stress, panic. Match their words when you can.

Use "we" and "our" when normalizing — parents are not alone in this. Short questions land hard — use them deliberately.

---

READING THE MOMENT — TWO MODES

Before responding, read what the parent actually needs right now.

MODE 1 — PROCESSING MODE (parent is venting, overwhelmed, or exploring why)
Sit with them first. Validate. Get curious. Ask the question that connects the present moment to something deeper. Help them see the thread without making it heavy. Favor flowing prose, curiosity, and one good question at the end.

Example questions:
"What comes up for you when your child melts down like that?"
"Where did you learn to respond to big feelings that way?"
"Sometimes our kids trigger something old in us — does any of that feel familiar?"

MODE 2 — ACTION MODE (parent needs to know what to do, right now or soon)
When a parent needs direction, move through the full structure. Give them something concrete to hold. Responses move through these layers as connected prose:

1. VALIDATION — Reflect back what they're carrying with genuine warmth. Name the difficulty specifically.

2. REFRAME — Help them understand what's underneath the behavior and why accommodation, while understandable, is working against what they want for their child. "When we keep stepping in, we're actually taking away the chance for them to find those internal resources — the ones that help them not just get through hard moments, but actually learn from them."

3. DIRECTION — Clear, grounded guidance on what to hold or let go of. One or two sentences. Firm but not cold.

4. SCRIPT — Always present this with the header **Script** bolded and on its own line. One or two short scripts the parent can actually say — warm, regulated, exposure-oriented, non-negotiating. Two sentences max per script.

5. NORMALIZE — One sentence acknowledging that escalation or pushback is expected and is not a sign they're doing it wrong.

6. CLOSING — End with either a single warm curious question, OR a genuine fork: "Are you finding yourself wanting to understand more about what's driving this, or would it feel more useful to keep working on the practical steps?"

---

SECONDARY LENSES

FAMILY OF ORIGIN — When a parent's reaction seems bigger than the moment warrants, name it gently. "Sometimes our kids trigger something old in us — that reaction might not just be about today." Then move forward.

NEURODIVERGENCE — Normalize that what parents know about their own brains often doesn't apply to their child's brain. Help them grieve the "expected" and get curious about who their child actually is.

PATTERNS — Name what you notice, warmly but directly. Don't dance around what's visible.

---

ADHD LENS

When ADHD is relevant — either because the parent names it or the pattern clearly suggests it — apply this lens. Don't force it where it doesn't fit.

ADHD is not a focus problem. It is a regulation deficit in the prefrontal cortex, which manages planning, task initiation, impulse control, attention shifting, and emotional regulation. The ADHD child isn't choosing to struggle. They're running a different operating system.

The interest-based nervous system activates through interest, novelty, challenge, urgency, and passion — not importance, rewards, or consequences alone. When a child hyperfocuses on Lego but cannot start homework, that isn't selfishness — it's neurological activation. The task matters to the parent. It doesn't activate the brain. These are different things.

Working memory and the knowing-doing gap. Children with ADHD know the rule, know the consequence — and in the moment, that knowledge is genuinely unavailable to them. Not defiance. A real and consistent gap between knowing and doing. External cues at the point of performance help. Reminding, lecturing, and repeating do not.

Emotional dysregulation. The same regulatory system that disrupts attention also disrupts emotion. The window between baseline and full meltdown is narrow. Disappointment feels devastating. Criticism lands hard and stays long. Co-regulation matters more here, not less.

Demand avoidance. The sense of external control can trigger an automatic threat response. The demand itself — regardless of content — registers as an imposition on autonomy. What looks like defiance is often reflex-like. Genuine choices, advance notice, and connecting before asking help. Demand avoidance doesn't mean abandoning expectations — it means delivering them in forms the nervous system can receive.

Accommodation in ADHD looks different but works the same way: removing friction, difficulty, and demand to avoid the explosion. Doing tasks for the child they could do with support. Abandoning expectations at first resistance. Unlimited screens as a dopamine substitute. Each is understandable. Each communicates over time that hard things are too hard — the opposite of what builds real capacity.

What steadiness looks like with ADHD: warmer, more co-regulatory, more patient with pace. But still consistently expectant. Progress looks messier, slower, with more regression. Real progress looks like: the child naming their state, developing their own recharging strategies, tolerating increasing frustration before needing rescue, failing without falling completely apart.

Scripts with ADHD children tend to need more presence and fewer words. Lead with regulation, not reason. "I'm right here" lands better than a three-step explanation.

---

SPECIAL CASES

If parental guilt or regret is present, lead with one consolidated validating sentence that holds their intention, their stumble, and their growth together — before moving into the pattern. One sentence only.

When a parent vents, spirals, or uses harsh language about their child or themselves, calmly name the escalation without shaming, model regulated language, and move toward steadiness.

If suicidal ideation, self-harm, child abuse, sexual abuse, physical abuse, neglect, domestic violence, credible threats of harm, or any mandated reporting situation arises, stop immediately and respond only with:

"This involves safety concerns that I'm not able to support through this tool. Please contact emergency services (911) or the Suicide & Crisis Lifeline (988) right now. If your child is in danger, reach out to a licensed clinician or emergency services immediately."

No scripts. No follow-up question. Nothing else.

Do not diagnose, recommend medication, offer legal advice, suggest custody strategies, process trauma, or create individualized treatment plans.

Every response — whatever mode it's in — moves toward less accommodation, more parental steadiness, more exposure, clearer limits, and greater consistency.`;

      { title: "Structure as support, not control", body: "ADHD children need more structure, not less — but structure delivered as support, not constraint. Routine, visual schedules, timers, and consistent sequences act as external regulatory systems, prosthetics for the executive function system that isn't yet working reliably. Structure delivered as control triggers demand avoidance. Structure delivered as support — predictable, non-punitive, consistent — is received differently. **Script:** 'I know transitions are hard for your brain. Here's what's coming next so you can start getting ready.'" },
      { title: "What real capacity looks like for ADHD", body: "The goal is not a child who no longer has ADHD. The goal is a child who develops self-knowledge, coping strategies, and a real relationship with their own brain. This takes longer, looks messier, involves more regression, more hard days, more loss of skills that were working. Real progress looks like: the child naming what state they're in, developing their own recharging strategies, tolerating increasing frustration before needing rescue, and failing — and not falling completely apart. That last one is the one that matters most." },
      { title: "What staying steady means", body: "Staying steady with an ADHD child means holding the relationship while they're flooded, demand-avoidant, frozen, or explosive — without rigidity, punitiveness, or your own depletion. It means being curious rather than attributional: 'what's happening for them' rather than 'why are they doing this to me.' It means repairing quickly after ruptures — ADHD relationships have more ruptures, which means repair matters more, not less. **Script:** 'I know that felt like too much. I'm not going anywhere. When you're ready, I'm here.'" },
    ]
  },
];

// ── Utilities ─────────────────────────────────────────────────────────────────
function formatMessage(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i} style={{ color: "#7c4a3a", display: "block", marginTop: "12px", marginBottom: "4px", fontSize: "15px" }}>{part.slice(2, -2)}</strong>;
    }
    return part.split("\n").map((line, j) => (
      <span key={`${i}-${j}`}>{line}{j < part.split("\n").length - 1 && <br />}</span>
    ));
  });
}

function Btn({ onClick, children, style = {}, disabled = false }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{

}

  );
}

// ── Server API helpers (auth + admin) ─────────────────────────────────────────
async function apiGet(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `API ${res.status}`); }
  return res.json();
}

// ── Supabase data helpers ─────────────────────────────────────────────────────
async function getConversations(uid) {
  const { data } = await db.from('conversations').select('*').eq('user_id', uid).order('last_message_at', { ascending: false });
  return data || [];
}
async function createConversation(uid, preview) {
  const id = crypto.randomUUID();
  const now = new Date().toISOString();
  await db.from('conversations').insert({ id, user_id: uid, preview: preview || 'New conversation', created_at: now, last_message_at: now });
  return id;
}
async function updateConvPreview(convId, preview) {
  await db.from('conversations').update({ preview: preview.slice(0, 60), last_message_at: new Date().toISOString() }).eq('id', convId);
}
async function getMessages(uid, convId) {
  const query = db.from('messages').select('role,content').eq('user_id', uid).order('id', { ascending: true });
  if (convId) query.eq('conversation_id', convId);
  const { data } = await query;
  return data || [];
}
async function appendMessages(uid, convId, msgs) {
  const rows = msgs.map(m => ({ user_id: uid, conversation_id: convId, role: m.role, content: m.content, created_at: new Date().toISOString() }));
  await db.from('messages').insert(rows);
}
async function getProfile(uid) {
  const { data } = await db.from('profiles').select('*').eq('user_id', uid).maybeSingle();
  return data || {};
}
async function saveProfile(uid, p) {
  await db.from('profiles').upsert({ user_id: uid, ...p, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
}
async function getKB() {
  try { const d = await apiGet("/api/admin?action=kb"); return d.content || ""; } catch { return ""; }
}
async function getKbFolders() {
  const { data } = await db.from('kb_folders').select('*').order('updated_at', { ascending: false });
  return data || [];
}
async function saveKbFolder(folder) {
  const now = new Date().toISOString();
  await db.from('kb_folders').upsert({ ...folder, updated_at: now }, { onConflict: 'id' });
}
async function deleteKbFolder(id) {
  await db.from('kb_folders').delete().eq('id', id);
}
async function getUsers(adminKey) {
  try {
    const data = await apiGet(`/api/admin?action=users&adminKey=${encodeURIComponent(adminKey)}`);
    const dict = {};
    for (const u of data.users || []) dict[u.username] = { id: u.id, name: u.name, username: u.username, email: u.email, createdAt: u.created_at, consentSigned: u.consent_signed };
    return dict;
  } catch { return {}; }
}
async function getProgressLogs(uid) {
  const { data } = await db.from('progress_logs').select('*').eq('user_id', uid).order('created_at', { ascending: false });
  return data || [];
}
async function addProgressLog(uid, username, momentType, note) {
  await db.from('progress_logs').insert({ user_id: uid, username, moment_type: momentType, note, created_at: new Date().toISOString() });
}
async function logUsage(uid, username, tokensEst) {
  await db.from('usage').insert({ user_id: uid, username, tokens_estimated: tokensEst, created_at: new Date().toISOString() }).catch(() => {});
}
async function saveFeedback(uid, rating, category, freeText, excerpt) {
  await db.from('feedback').insert({ id: crypto.randomUUID(), user_id: uid, rating, report_category: category || null, free_text: freeText || null, conversation_excerpt: excerpt || null, created_at: new Date().toISOString() }).catch(() => {});
}
async function getAdminFeedback() {
  const { data } = await db.from('feedback').select('*').order('created_at', { ascending: false }).limit(200);
  return data || [];
}
async function getAdminUsage() {
  const { data } = await db.from('usage').select('*').order('created_at', { ascending: false }).limit(500);
  return data || [];
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({ onLogin, onNeedsConsent }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [recoverSent, setRecoverSent] = useState(false);

  function reset() { setName(""); setEmail(""); setUsername(""); setPassword(""); setConfirmPw(""); setError(""); setRecoverSent(false); }

  async function submit() {
    setError(""); setBusy(true);
    if (mode === "recover") {
      const em = email.trim().toLowerCase();
      if (!em) { setError("Please enter your email address."); setBusy(false); return; }
      try { await apiPost("/api/account", { action: "recover", email: em }); setRecoverSent(true); }
      catch(e) { setError(e.message || "No account found with that email address."); }
      setBusy(false); return;
    }
    if (mode === "login") {
      try {
        const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username.trim().toLowerCase(), password }) });
        if (res.ok) {
          const data = await res.json(); const u = data.user;
          if (!u.consentSigned) { onNeedsConsent({ ...u, role: "client" }); setBusy(false); return; }
          onLogin({ ...u, role: "client" }); setBusy(false); return;
        }
      } catch {}
      try {
        const res = await fetch("/api/admin-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username.trim().toLowerCase(), password }) });
        if (res.ok) { const data = await res.json(); if (data.success) { onLogin({ id: "admin", name: "Admin", role: "admin", adminKey: password }); setBusy(false); return; } }
      } catch {}
      setError("Incorrect username or password."); setBusy(false);
    } else {
      if (!name.trim()) { setError("Please enter your name."); setBusy(false); return; }
      if (!email.trim() || !email.includes("@")) { setError("Please enter a valid email address."); setBusy(false); return; }
      if (username.trim().length < 3) { setError("Username must be at least 3 characters."); setBusy(false); return; }
      if (password.length < 6) { setError("Password must be at least 6 characters."); setBusy(false); return; }
      if (password !== confirmPw) { setError("Passwords don't match."); setBusy(false); return; }
      try {
        const data = await apiPost("/api/register", { name: name.trim(), email: email.trim().toLowerCase(), username: username.trim().toLowerCase(), password });
        sendEmail(`New Client Registration \u2014 ${name.trim()}`, `New account:\n\nName: ${name.trim()}\nUsername: ${username.trim().toLowerCase()}\nEmail: ${email.trim()}\nRegistered: ${new Date().toLocaleString()}`, name.trim());
        onNeedsConsent({ ...data.user, role: "client" });
      } catch(e) { setError(e.message || "Failed to create account. Please try again."); }
      setBusy(false);
    }
  }

  function onKey(e) { if (e.key === "Enter") submit(); }

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(145deg,#fdf6f0 0%,#fce8d8 40%,#f5e6f0 100%)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia,serif", padding: "20px" }}>
      <div style={{ background: "rgba(255,255,255,0.88)", backdropFilter: "blur(12px)", borderRadius: "28px", padding: "40px", maxWidth: 420, width: "100%", boxShadow: "0 20px 60px rgba(150,80,60,0.13)", border: "1px solid rgba(200,120,90,0.12)" }}>
        <div style={{ textAlign: "center", marginBottom: "28px" }}>
          <div style={{ width: 58, height: 58, borderRadius: "50%", background: "linear-gradient(135deg,#e8937a,#c9697a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "26px", margin: "0 auto 14px", boxShadow: "0 4px 16px rgba(200,100,100,0.3)" }}>🌿</div>
          <h1 style={{ color: "#4a2820", fontSize: "22px", margin: "0 0 6px", fontWeight: "700" }}>Steady Parent Coach</h1>
          <p style={{ color: "#9a7060", fontSize: "13px", margin: 0 }}>Parenting support, grounded in clinical practice</p>
        </div>
        {mode !== "recover" && (
          <div style={{ display: "flex", background: "rgba(200,120,90,0.08)", borderRadius: "12px", padding: "4px", marginBottom: "22px" }}>
            {[["login", "Sign In"], ["register", "Create Account"]].map(([m, label]) => (
              <button key={m} onClick={() => { setMode(m); reset(); }} style={{ flex: 1, padding: "9px", borderRadius: "9px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: "14px", fontWeight: "600", background: mode === m ? "#fff" : "transparent", color: mode === m ? "#c9697a" : "#9a7060", boxShadow: mode === m ? "0 2px 8px rgba(150,80,60,0.12)" : "none" }}>{label}</button>
            ))}
          </div>
        )}
        {mode === "recover" && (
          <div style={{ marginBottom: "20px" }}>
            <button onClick={() => { setMode("login"); reset(); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#c9697a", fontSize: "13px", fontFamily: "inherit", fontWeight: "600" }}>← Back to Sign In</button>
            <h2 style={{ color: "#4a2820", fontSize: "18px", margin: "12px 0 6px", fontWeight: "700" }}>Account Recovery</h2>
            <p style={{ color: "#9a7060", fontSize: "13px", margin: 0, lineHeight: 1.6 }}>Enter your registered email and we'll send your username and a temporary password.</p>
          </div>
        )}
        {recoverSent ? (
          <div style={{ textAlign: "center", padding: "16px 0" }}>
            <div style={{ fontSize: "36px", marginBottom: "10px" }}>📬</div>
            <div style={{ fontSize: "15px", fontWeight: "700", color: "#4a2820", marginBottom: "8px" }}>Recovery email sent</div>
            <p style={{ fontSize: "13px", color: "#9a7060", lineHeight: 1.65, margin: "0 0 20px" }}>Check your inbox for your username and a temporary password.</p>
            <Btn onClick={() => { setMode("login"); reset(); }} style={{ background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff" }}>Back to Sign In</Btn>
          </div>
        ) : (
          <>
            {mode === "register" && <Input placeholder="Your full name" value={name} onChange={e => setName(e.target.value)} onKeyDown={onKey} />}
            {mode === "register" && <Input type="email" placeholder="Your email address" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={onKey} />}
            {mode === "recover" ? <Input type="email" placeholder="Email address you registered with" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={onKey} autoFocus /> : <Input placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} onKeyDown={onKey} />}
            {mode !== "recover" && <Input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={onKey} />}
            {mode === "register" && <Input type="password" placeholder="Confirm password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} onKeyDown={onKey} />}
            {error && <div style={{ background: "rgba(220,80,80,0.08)", border: "1px solid rgba(220,80,80,0.2)", borderRadius: "10px", padding: "10px 14px", color: "#c05060", fontSize: "13px", marginBottom: "14px" }}>{error}</div>}
            <Btn onClick={submit} disabled={busy} style={{ width: "100%", padding: "14px", background: busy ? "rgba(200,120,90,0.3)" : "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", fontSize: "15px", fontWeight: "700", borderRadius: "14px" }}>
              {busy ? "Please wait\u2026" : mode === "login" ? "Sign In" : mode === "register" ? "Create Account \u2192" : "Send Recovery Email"}
            </Btn>
            {mode === "login" && <p style={{ color: "#c9a090", fontSize: "12px", textAlign: "center", marginTop: "14px" }}><button onClick={() => { setMode("recover"); reset(); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#c9697a", fontWeight: "600", fontSize: "12px", fontFamily: "inherit", textDecoration: "underline" }}>Forgot your username or password?</button></p>}
            <p style={{ color: "#b89080", fontSize: "11px", textAlign: "center", marginTop: "10px", lineHeight: 1.6 }}>This tool is not a replacement for therapy.</p>
          </>
        )}
      </div>
    </div>
  );
}

function Tutorial({ userId, sessionToken, onComplete }) {
  const [step, setStep] = useState(0);
  const current = TUTORIAL_STEPS[step];
  const isLast = step === TUTORIAL_STEPS.length - 1;

  async function finish() {
    await fetch("/api/complete-tutorial", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId, sessionToken }),
    }).catch(() => {});
    onComplete();
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, backdropFilter: "blur(4px)", padding: "20px" }}>
      <div style={{ background: "#fdf8f4", borderRadius: "24px", padding: "32px", maxWidth: 420, width: "100%", boxShadow: "0 24px 60px rgba(150,80,60,0.25)", animation: "fadeUp 0.3s ease" }}>
        <div style={{ display: "flex", gap: "5px", marginBottom: "24px" }}>
          {TUTORIAL_STEPS.map((_, i) => (
            <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i <= step ? "linear-gradient(90deg,#e8937a,#c9697a)" : "rgba(200,120,90,0.15)", transition: "background 0.3s" }} />
          ))}
        </div>
        <div style={{ fontSize: "26px", marginBottom: "12px", textAlign: "center" }}>🌿</div>
        <h2 style={{ color: "#4a2820", fontSize: "18px", fontWeight: "700", margin: "0 0 12px", textAlign: "center" }}>{current.title}</h2>
        <p style={{ color: "#7c5040", fontSize: "14px", lineHeight: 1.7, margin: "0 0 28px", textAlign: "center" }}>{current.body}</p>
        <div style={{ display: "flex", gap: "10px" }}>
          <button onClick={finish} style={{ flex: 1, padding: "11px", borderRadius: "12px", border: "none", cursor: "pointer", background: "rgba(200,120,90,0.1)", color: "#9a7060", fontFamily: "inherit", fontSize: "13px", fontWeight: "600" }}>Skip</button>
          <Btn onClick={() => isLast ? finish() : setStep(s => s + 1)}
            style={{ flex: 2, padding: "11px", background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", fontWeight: "700" }}>
            {isLast ? "Get started" : `Next (${step + 1}/${TUTORIAL_STEPS.length})`}
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ── Profile Drawer ────────────────────────────────────────────────────────────
function ProfileDrawer({ user, onClose }) {
  const EMPTY = { working_on: "", triggers: "", accommodations: "", notes: "", child_gender: "", child_age: "", focus_areas: "", weekly_goal: "" };
  const [draft, setDraft] = useState(EMPTY);
  const [saved, setSaved] = useState(false);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    getProfile(user.id).then(p => { setDraft({ ...EMPTY, ...p }); setLoading(false); });
  }, [user.id]);

  async function save() {
    const toSave = { ...draft };
    if (toSave.weekly_goal !== (draft._origGoal || "")) toSave.weekly_goal_set_at = new Date().toISOString();
    await saveProfile(user.id, toSave);
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  }

  function toggleFocus(area) {
    const current = draft.focus_areas ? draft.focus_areas.split(",").map(s => s.trim()).filter(Boolean) : [];
    const next = current.includes(area) ? current.filter(a => a !== area) : [...current, area];
    setDraft(d => ({ ...d, focus_areas: next.join(",") }));
  }

  const focusAreas = draft.focus_areas ? draft.focus_areas.split(",").map(s => s.trim()).filter(Boolean) : [];
  const AGE_OPTIONS = ["Under 5", "5–8", "9–12", "13–17"];
  const FOCUS_OPTIONS = ["Anxiety", "ADHD", "Depression", "Parental regulation"];
  const textFields = [
    { key: "working_on", label: "What we're working on in therapy", placeholder: "e.g. reducing bedtime check-ins, getting to school independently…" },
    { key: "triggers", label: "Specific triggers or patterns", placeholder: "e.g. transitions, separation at drop-off, 'what if' questions…" },
    { key: "accommodations", label: "Accommodation habits I'm trying to break", placeholder: "e.g. letting them sleep in our bed, answering the same question multiple times…" },
    { key: "notes", label: "Anything else that's helpful to know", placeholder: "e.g. child's temperament, what's been working, recent changes…" },
  ];

  const chipStyle = (active, color) => ({ padding: "6px 14px", borderRadius: "20px", border: `1.5px solid ${active ? color : "rgba(200,120,90,0.2)"}`, background: active ? color : "rgba(255,255,255,0.7)", color: active ? "#fff" : "#7c4a3a", fontSize: "13px", cursor: "pointer", fontFamily: "inherit", fontWeight: "600", transition: "all 0.15s" });

  return (
    <>
      <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(74,40,32,0.3)", zIndex: 40, backdropFilter: "blur(2px)" }} />
      <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(440px,100vw)", background: "linear-gradient(160deg,#fdf6f0,#fce8d8)", boxShadow: "-8px 0 40px rgba(150,80,60,0.15)", zIndex: 50, display: "flex", flexDirection: "column", fontFamily: "Georgia,serif", animation: "slideIn 0.25s ease" }}>
        <div style={{ padding: "18px 20px 14px", borderBottom: "1px solid rgba(200,120,90,0.15)", display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,255,255,0.6)", backdropFilter: "blur(8px)", flexShrink: 0 }}>
          <div><div style={{ fontSize: "16px", fontWeight: "700", color: "#4a2820" }}>My Profile</div><div style={{ fontSize: "12px", color: "#9a7060", marginTop: "2px" }}>Helps the coach understand your situation</div></div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "20px", color: "#9a7060", padding: "4px" }}>✕</button>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: "18px 20px", display: "flex", flexDirection: "column", gap: "20px" }}>
          {loading ? <div style={{ color: "#c9697a", textAlign: "center", padding: "40px 0" }}>Loading…</div> : (
            <>
              <div style={{ background: "rgba(232,147,122,0.1)", border: "1px solid rgba(200,120,90,0.2)", borderRadius: "12px", padding: "12px 14px", fontSize: "12px", color: "#7c4a3a", lineHeight: 1.6 }}>
                The more you share here, the more personal and relevant the coaching will feel. This information is private to your account.
              </div>

              {/* About Your Child */}
              <div>
                <div style={{ fontSize: "14px", fontWeight: "700", color: "#4a2820", marginBottom: "12px" }}>About Your Child</div>
                <div style={{ marginBottom: "12px" }}>
                  <div style={{ fontSize: "12px", color: "#7c4a3a", fontWeight: "600", marginBottom: "8px" }}>Gender</div>
                  <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                    {["Boy", "Girl", "Non-binary", "Prefer not to say"].map(g => (
                      <button key={g} onClick={() => setDraft(d => ({ ...d, child_gender: d.child_gender === g ? "" : g }))} style={chipStyle(draft.child_gender === g, "#e8937a")}>{g}</button>
                    ))}
                  </div>
                </div>
                <div style={{ marginBottom: "12px" }}>
                  <div style={{ fontSize: "12px", color: "#7c4a3a", fontWeight: "600", marginBottom: "8px" }}>Age</div>
                  <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                    {AGE_OPTIONS.map(a => (
                      <button key={a} onClick={() => setDraft(d => ({ ...d, child_age: d.child_age === a ? "" : a }))} style={chipStyle(draft.child_age === a, "#c9697a")}>{a}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: "12px", color: "#7c4a3a", fontWeight: "600", marginBottom: "8px" }}>Focus areas (select all that apply)</div>

                </div>
              </div>

                <div key={f.key}>

                    onFocus={e => e.target.style.borderColor = "#e8937a"} onBlur={e => e.target.style.borderColor = "rgba(200,120,90,0.22)"} />
                </div>
              ))}

              {/* Weekly goal */}
              <div>
                <label style={{ fontSize: "13px", fontWeight: "700", color: "#4a2820", display: "block", marginBottom: "7px" }}>This week I want to…</label>
                <input value={draft.weekly_goal || ""} onChange={e => setDraft(d => ({ ...d, weekly_goal: e.target.value }))} placeholder="e.g. Hold the bedtime limit even when they escalate"
                  style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.22)", background: "rgba(255,255,255,0.88)", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", boxSizing: "border-box" }}
                  onFocus={e => e.target.style.borderColor = "#e8937a"} onBlur={e => e.target.style.borderColor = "rgba(200,120,90,0.22)"} />
              </div>
            </>
          )}

            {saved ? "✓ Saved!" : "Save Profile"}
          </Btn>
        </div>
      </div>
      <style>{`@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}`}</style>
    </>
  );
}

// ── Progress Tab ──────────────────────────────────────────────────────────────
function ProgressTab({ user, onClose }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showLog, setShowLog] = useState(false);
  const [logType, setLogType] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [weeklyGoal, setWeeklyGoal] = useState("");

  useEffect(() => {
    async function load() {
      const [l, p] = await Promise.all([getProgressLogs(user.id), getProfile(user.id)]);
      setLogs(l);
      setWeeklyGoal(p.weekly_goal || "");
      setLoading(false);
    }
    load();
  }, [user.id]);

  async function saveLog() {
    if (!logType) return;
    setSaving(true);
    await addProgressLog(user.id, user.username, logType, note);
    const fresh = await getProgressLogs(user.id);
    setLogs(fresh); setShowLog(false); setNote(""); setLogType(""); setSaving(false);
  }

  const momentIcons = { "held-firm": "💪", "gave-in-caught": "↩️", "kid-win": "⭐", "free-write": "📝" };
  const momentLabels = { "held-firm": "Held firm", "gave-in-caught": "Gave in — caught myself", "kid-win": "Kid had a win", "free-write": "Free write" };
  const heldCount = logs.filter(l => l.moment_type === "held-firm").length;
  const winCount = logs.filter(l => l.moment_type === "kid-win").length;

  return (
    <div style={{ position: "fixed", inset: 0, background: "linear-gradient(145deg,#fdf6f0,#fce8d8 40%,#f5e6f0)", zIndex: 60, overflowY: "auto", fontFamily: "Georgia,serif" }}>
      <div style={{ maxWidth: 680, margin: "0 auto", padding: "20px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "22px" }}>
          <button onClick={onClose} style={{ background: "rgba(200,120,90,0.1)", border: "none", cursor: "pointer", width: 36, height: 36, borderRadius: "50%", fontSize: "16px", display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
          <h1 style={{ color: "#4a2820", fontSize: "20px", fontWeight: "700", margin: 0 }}>My Progress</h1>
        </div>

        {weeklyGoal && (
          <div style={{ background: "rgba(255,255,255,0.85)", border: "1.5px solid rgba(200,120,90,0.2)", borderRadius: "16px", padding: "16px 18px", marginBottom: "16px" }}>
            <div style={{ fontSize: "12px", color: "#9a7060", fontWeight: "600", marginBottom: "6px" }}>THIS WEEK'S GOAL</div>
            <div style={{ fontSize: "14px", color: "#4a2820", lineHeight: 1.6 }}>{weeklyGoal}</div>
          </div>
        )}

        {/* Stats */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "10px", marginBottom: "20px" }}>
          {[["Total logged", logs.length, "#c9697a"], ["Held firm", heldCount, "#3a8a50"], ["Kid wins", winCount, "#e8937a"]].map(([label, val, color]) => (
            <div key={label} style={{ background: "rgba(255,255,255,0.82)", borderRadius: "14px", padding: "14px", textAlign: "center", border: "1px solid rgba(200,120,90,0.12)" }}>
              <div style={{ fontSize: "24px", fontWeight: "700", color }}>{val}</div>
              <div style={{ fontSize: "12px", color: "#9a7060", marginTop: "3px" }}>{label}</div>
            </div>
          ))}
        </div>

        {/* Log moment buttons */}
        <div style={{ background: "rgba(255,255,255,0.82)", borderRadius: "16px", padding: "18px", marginBottom: "20px", border: "1px solid rgba(200,120,90,0.12)" }}>
          <div style={{ fontSize: "14px", fontWeight: "700", color: "#4a2820", marginBottom: "12px" }}>Log a moment</div>
          {!showLog ? (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: "8px" }}>
              {Object.entries(momentLabels).map(([type, label]) => (
                <button key={type} onClick={() => { setLogType(type); setShowLog(true); }} style={{ padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.2)", background: "rgba(255,255,255,0.7)", cursor: "pointer", fontFamily: "inherit", fontSize: "13px", color: "#7c4a3a", fontWeight: "600", textAlign: "left" }}>
                  {momentIcons[type]} {label}
                </button>
              ))}
            </div>
          ) : (
            <div>
              <div style={{ fontSize: "13px", color: "#9a7060", marginBottom: "10px" }}>{momentIcons[logType]} {momentLabels[logType]}</div>
              <textarea value={note} onChange={e => setNote(e.target.value)} placeholder="What happened? What did you notice? (optional)"
                rows={3} autoFocus style={{ width: "100%", padding: "11px 14px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.22)", background: "#fdfaf8", fontSize: "13px", fontFamily: "inherit", color: "#4a2820", outline: "none", resize: "none", lineHeight: 1.6, boxSizing: "border-box", marginBottom: "10px" }} />
              <div style={{ display: "flex", gap: "8px" }}>
                <button onClick={() => { setShowLog(false); setLogType(""); setNote(""); }} style={{ flex: 1, padding: "10px", borderRadius: "12px", border: "1.5px solid rgba(200,120,90,0.2)", background: "transparent", cursor: "pointer", fontFamily: "inherit", fontSize: "13px", color: "#9a7060" }}>Cancel</button>
                <Btn onClick={saveLog} disabled={saving} style={{ flex: 2, background: "linear-gradient(135deg,#e8937a,#c9697a)", color: "#fff", fontWeight: "700" }}>{saving ? "Saving…" : "Save Moment"}</Btn>
              </div>
            </div>
          )}
        </div>

        {/* Timeline */}
        <div>
          <div style={{ fontSize: "14px", fontWeight: "700", color: "#4a2820", marginBottom: "12px" }}>Timeline</div>
          {loading ? <div style={{ color: "#c9697a", textAlign: "center", padding: "20px" }}>Loading…</div>
          : logs.length === 0 ? (
            <div style={{ background: "rgba(255,255,255,0.7)", borderRadius: "14px", padding: "28px", textAlign: "center", color: "#9a7060", fontSize: "14px" }}>No moments logged yet. Your first win is waiting.</div>
          ) : logs.map((log, i) => (
            <div key={log.id || i} style={{ background: "rgba(255,255,255,0.82)", borderRadius: "14px", padding: "14px 16px", marginBottom: "8px", border: "1px solid rgba(200,120,90,0.1)", display: "flex", gap: "12px", alignItems: "flex-start" }}>
              <div style={{ fontSize: "18px", flexShrink: 0, marginTop: "1px" }}>{momentIcons[log.moment_type] || "📌"}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: "12px", fontWeight: "700", color: "#c9697a", marginBottom: "3px" }}>{momentLabels[log.moment_type] || log.moment_type}</div>
                {log.note && <div style={{ fontSize: "13px", color: "#5a3828", lineHeight: 1.6 }}>{log.note}</div>}
                <div style={{ fontSize: "11px", color: "#b89080", marginTop: "5px" }}>{new Date(log.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
